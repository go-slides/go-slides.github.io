name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  # The second origin can drift or disappear without a commit here.
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  # The playground's git frame lives on a second origin,
  # go-slides-usercontent.github.io (github.io is on the Public Suffix List, so a
  # separate site with storage of its own): .second-origin.json declares it, and
  # this job fails when the published shell drifts from the declaration (its CSP,
  # the origins it accepts) or the origin disappears. An answer it cannot read is
  # "not verified" (exit 2), never a pass.
  second-origin:
    name: second origin verified
    runs-on: ubuntu-latest
    env:
      # the one place the version is written: the cache key and the install use it
      PLAYWRIGHT_VERSION: v0.6401.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4" # secondorigin v0.105.0 requires it (GO-2026-6859)
          cache: false
      # the gate RUNS the published frame (fleettools#243): headless browsers
      # the browsers are downloaded once per Playwright version (the download
      # failed a run: #124), and the install is tried at most three times
      - name: playwright browsers cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/ms-playwright-go
          key: playwright-${{ env.PLAYWRIGHT_VERSION }}-${{ runner.os }}-chromium-firefox
      - name: playwright browsers
        working-directory: ${{ runner.temp }}
        run: |
          for attempt in 1 2 3; do
            go run github.com/mxschmitt/playwright-go/cmd/playwright@"${PLAYWRIGHT_VERSION}" install --with-deps chromium firefox && exit 0
            echo "::warning::playwright install failed (attempt ${attempt} of 3)"
            sleep $((attempt * 10))
          done
          exit 1
      - name: secondorigin verify
        run: |
          set -eu
          umask 077
          token="${RUNNER_TEMP}/secondorigin-token"
          trap 'rm -f "${token}"' EXIT
          printf '%s' '${{ github.token }}' > "${token}"
          go run github.com/go-fleettools/fleettools/cmd/secondorigin@v0.105.0 \
            verify --token-file "${token}" --retry 3 --browser chromium --browser firefox

  build:
    name: the site builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true
      - name: every language has its words and its cards
        run: cd tools/i18ncheck && go run . -root ../..
      - run: hugo --minify
      # A page that builds and says nothing is a page nobody notices is empty.
      - name: every repository is on it
        run: |
          for repo in slides docs brand; do
            grep -q "go-slides/$repo\|go-slides.github.io/$repo" public/index.html \
              || { echo "::error::$repo is not on the page"; exit 1; }
          done
          echo "the page names every repository this org has"
