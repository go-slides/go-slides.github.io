# The playground (playground/, a nested Go module): a go-widgets canvas
# application and a render worker, one WebAssembly module, served at
# /playground/.
#
#   test     gofmt, vet (native and js/wasm), native tests with -race, the
#            module build and its gzip size budget, govulncheck
#   browser  the built site in headless Chrome: it loads, typing updates the
#            preview, a planted error shows in the editor, the preview is
#            sandboxed, the slideshow advances; timings on the 100-slide deck
name: playground

on:
  push:
    branches: [main]
    paths: ["playground/**", "layouts/**", "static/**", "content/**", ".github/workflows/playground.yml"]
  pull_request:
    paths: ["playground/**", "layouts/**", "static/**", "content/**", ".github/workflows/playground.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playground
        # Named, bash runs with -o pipefail; unnamed it is `bash -e {0}`, and
        # `drive | tee` would pass whatever the drive says.
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4" # GO-2026-6809 is fixed in 1.27.3, GO-2026-6859 in 1.27.4
          cache-dependency-path: playground/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: |
          go vet ./...
          GOOS=js GOARCH=wasm go vet ./...
      - name: test (race)
        run: go test -race -short -cover ./...
      - name: the module, and its size budget (12.75 MB gzipped)
        run: go run ./cmd/build --out "$RUNNER_TEMP/site" --max-gzip 12750000| tee -a "$GITHUB_STEP_SUMMARY"
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash # -o pipefail: a failed drive fails the step through tee
    steps:
      - uses: actions/checkout@v7
        with:
          path: site
      - uses: actions/checkout@v7
        with:
          repository: go-slides/vscode
          path: vscode
          sparse-checkout: test/fixtures
      # the git frame's own repository (go-slides#90): git.cjs renders its site for
      # the page's origin and serves it as the page's second origin
      - uses: actions/checkout@v7
        with:
          repository: go-slides-usercontent/go-slides-usercontent.github.io
          ref: v0.2.0
          path: gitframe
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache-dependency-path: site/playground/go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - run: npm install --no-save --prefix "$RUNNER_TEMP/pptr" puppeteer-core@24.43.1
      - name: build the playground into the site
        working-directory: site/playground
        run: go run ./cmd/build
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.170.0"
          extended: true
      - name: build the site
        working-directory: site
        # the git frame's origin for the browser tests: a loopback one, which
        # git.cjs serves (the page's CSP frame-src names exactly this)
        env:
          HUGO_PARAMS_GITFRAMEORIGIN: http://127.0.0.1:18177
        run: hugo --minify --destination "$RUNNER_TEMP/public"
      - name: drive the page in Chrome
        working-directory: site/playground
        env:
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          NODE_PATH: ${{ runner.temp }}/pptr/node_modules
          BENCH_DECK: ${{ github.workspace }}/vscode/test/fixtures/bench100.md
        run: |
          go build -o "$RUNNER_TEMP/serve" ./cmd/serve
          "$RUNNER_TEMP/serve" --dir "$RUNNER_TEMP/public" --port-file "$RUNNER_TEMP/port" &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/port" ] && break; sleep 0.1; done
          node browsertest/drive.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # the thumbnails sit on the strip's cards: three pixel ratios, both schemes
          node browsertest/rail.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          node browsertest/tour.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          node browsertest/draft.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          node browsertest/export.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/downloads" | tee -a "$GITHUB_STEP_SUMMARY"
          # what the export says about animated SVG images, in the page's language
          node browsertest/exportnotes.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/downloads-notes" | tee -a "$GITHUB_STEP_SUMMARY"
          node browsertest/files.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # the Theme editor: import a package, edit, export it, and the CLI's own
          # `slides theme verify` accepts the download; a second browser with empty
          # storage imports it and shows the same theme
          # (the CLI of the go-slides version the page is built with)
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/go-slides/slides/cmd/slides@$(go list -m -f '{{.Version}}' github.com/go-slides/slides)"
          mkdir -p "$RUNNER_TEMP/themefixtures"
          THEME_FIXTURES_OUT="$RUNNER_TEMP/themefixtures" go test -run TestWriteThemeFixturesForBrowser .
          SLIDES="$RUNNER_TEMP/bin/slides" node browsertest/themeeditor.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/themefixtures" "$RUNNER_TEMP/downloads-theme" | tee -a "$GITHUB_STEP_SUMMARY"
          # and in Japanese (CJK text in the pane, the same package out)
          SLIDES="$RUNNER_TEMP/bin/slides" node browsertest/themeeditor.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/ja/playground/" "$RUNNER_TEMP/themefixtures" "$RUNNER_TEMP/downloads-theme-ja" | tee -a "$GITHUB_STEP_SUMMARY"
          # the dividers: drag, collapse, keyboard, kept over a reload, four sizes and schemes
          node browsertest/split.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # the panes' close buttons: each closes and reopens from the View tab, the last one refuses, kept over a reload
          node browsertest/panes.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # the Format tab: marks, shortcuts, the table grid, slide alignment, links
          node browsertest/format.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # Undo and Redo: Ctrl+Z, the ribbon's buttons, a whole-project step
          node browsertest/history.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$RUNNER_TEMP/shots" | tee -a "$GITHUB_STEP_SUMMARY"
          # the GitHub pane as an attacker (a script injected into the page) sees it:
          # the page's CSP names no forge, the token is typed in the git frame (a
          # second origin) and reaches api.github.com from there only; after a
          # connect and a Remember the page's memory, storage and messages hold none
          node browsertest/git.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" "$GITHUB_WORKSPACE/gitframe" http://127.0.0.1:18177 | tee -a "$GITHUB_STEP_SUMMARY"
          # server mode: the real slides-gitd code behind a fake oauth2-proxy, two
          # people in two browser contexts; neither sees the other's anything
          go build -o "$RUNNER_TEMP/gitdfront" ./cmd/gitdfront
          mkdir "$RUNNER_TEMP/vault"
          "$RUNNER_TEMP/gitdfront" --dir "$RUNNER_TEMP/public" --data "$RUNNER_TEMP/vault" --port-file "$RUNNER_TEMP/gitdport" &
          for _ in $(seq 50); do [ -s "$RUNNER_TEMP/gitdport" ] && break; sleep 0.1; done
          node browsertest/gitd.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/gitdport")/playground/" | tee -a "$GITHUB_STEP_SUMMARY"
          # shared links that carry a hostile deck (a self-including one, bombs):
          # the problem is shown and the page stays alive (go-slides/slides#67)
          node browsertest/hostile.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" | tee -a "$GITHUB_STEP_SUMMARY"
          # the page's Content Security Policy: the page and its preview frame work
          # under it, and what an injected script could send a token out by is refused
          node browsertest/csp.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" | tee -a "$GITHUB_STEP_SUMMARY"
          # a terminal recording's player in the preview frame (a sandboxed srcdoc
          # under the page's policy): plays, seeks, paused under reduced motion,
          # nothing refused, nothing fetched
          CAST_PREVIEW_OUT="$RUNNER_TEMP/castframe.html" go test -run TestWritePreviewPageForBrowser .
          node browsertest/cast.cjs "$RUNNER_TEMP/castframe.html" ../layouts/_default/playground.html | tee -a "$GITHUB_STEP_SUMMARY"
          # a video file of the project in the preview frame: its src becomes a
          # blob: URL of the file (media-src blob:), replaced and revoked with it,
          # nothing refused, nothing fetched
          mkdir -p "$RUNNER_TEMP/video"
          VIDEO_PREVIEW_OUT="$RUNNER_TEMP/video" go test -run TestWriteVideoPreviewForBrowser .
          node browsertest/video.cjs "$RUNNER_TEMP/video/frame.html" "$RUNNER_TEMP/video/clip.mp4" ../layouts/_default/playground.html | tee -a "$GITHUB_STEP_SUMMARY"
          # Insert ▸ Image, Background and a drop: media/, never a data: URI
          node browsertest/insert.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/playground/" | tee -a "$GITHUB_STEP_SUMMARY"
          # the interface in other languages: the page's language reaches the wasm,
          # the font subsets load, the ribbon lays out (pictures in the artifact)
          node browsertest/i18n.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")" "$RUNNER_TEMP/shots" fr de ja zh uk pl | tee -a "$GITHUB_STEP_SUMMARY"
          # the landing's hero carousel (landingkit's hero-carousel.html):
          # buttons, arrows, constant height, focus stops, reduced motion
          node browsertest/hero.cjs "http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playground-screenshots
          path: ${{ runner.temp }}/shots
