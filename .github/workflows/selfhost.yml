# The self-hosting files (selfhost/): the Caddyfiles the guide prints must
# be ones Caddy accepts, with the Caddy version the guide names.
name: selfhost

on:
  pull_request:
    paths: ["selfhost/**", ".github/workflows/selfhost.yml"]
  push:
    branches: [main]
    paths: ["selfhost/**", ".github/workflows/selfhost.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  caddy:
    name: the Caddyfiles validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.4"
          cache: false
      - name: Caddy v2.11.7
        run: GOBIN="$RUNNER_TEMP/bin" go install github.com/caddyserver/caddy/v2/cmd/caddy@v2.11.7
      - name: caddy validate
        working-directory: selfhost
        run: |
          for f in Caddyfile.*; do
            echo "== $f"
            "$RUNNER_TEMP/bin/caddy" validate --adapter caddyfile --config "$f"
          done
      # The real Caddy on the real Caddyfile.gitd, with a fake oauth2-proxy and
      # a fake slides-gitd: the identity forward_auth copies must reach the
      # upstream, and a forged one must not (#100). A skip is a failure here.
      - name: Caddyfile.gitd identity headers (real Caddy)
        working-directory: selfhost/caddytest
        env:
          CADDY_BIN: ${{ runner.temp }}/bin/caddy
          REQUIRE_CADDY: "1"
        run: go test -count=1 -v ./...
