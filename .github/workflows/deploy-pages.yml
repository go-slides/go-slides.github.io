name: deploy-pages

on:
  push:
    branches: [main]
  # Build on every pull request too, so a change to the layout, the content,
  # the Hugo version or one of the actions below has to prove the site still
  # builds before it lands. Without this the workflow ran only on main, so a
  # dependency bump arrived with no signal at all: its checks read "no checks",
  # which is not the same thing as green and must not be merged as if it were.
  pull_request:
  workflow_dispatch:

# The build needs nothing beyond the source and the Pages configuration it
# reads to compute the base URL. Publishing rights are granted to the deploy
# job alone, below, so a pull request build cannot replace what is served even
# if a step in it misbehaves.
permissions:
  contents: read
  pages: read

# Deploys serialise with one another under the main group. A pull request gets
# a group of its own, so it neither waits behind a deploy nor holds one up, and
# a new push to the same pull request supersedes the build still running for it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Hugo resolves the landingkit module (hugo.toml [module]) with the go
      # command, at the version go.mod pins.
      # The playground (playground/, a nested module) needs Go 1.27.2; 1.27.3
      # fixes GO-2026-6809 (crypto/x509), which govulncheck finds reachable.
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.3"
          cache-dependency-path: playground/go.sum

      # The playground's wasm is built fresh on every run and never
      # committed: a committed wasm is a build artifact nobody rebuilds.
      - name: Build the playground
        working-directory: playground
        env:
          GOWORK: "off"
        run: go run ./cmd/build

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.169.0"
          extended: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build landing page
        env:
          # Cache-busts the playground: each deploy is a new URL.
          HUGO_PARAMS_WASMSHA: ${{ github.sha }}
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    # Only main publishes. A pull request stops after the build above: it has
    # proved the site builds, which is the whole point of the gate, and it has
    # no business replacing the published site.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ⛔ A GREEN DEPLOY IS NOT A SERVED PAGE. This repository's Pages source
      # was `legacy` -- Jekyll, from the branch -- so for three hours the live
      # site was the default theme's rendering of README.md while this workflow
      # built the Hugo site, uploaded it and reported success three times. Every
      # signal was green and none of them looked at the URL.
      #
      # So look at the URL. Hugo writes its own generator meta; Jekyll writes
      # Jekyll's. If what is served is not ours, the deploy failed whatever the
      # steps above said.
      - name: The page that is served is the page we built
        run: |
          url="${{ steps.deployment.outputs.page_url }}"
          echo "serving: $url"
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL --max-time 20 "$url" || true)
            # ⛔ The pattern matches the MINIFIED output. `hugo --minify` drops
            # the quotes around an attribute name, so the served page says
            # `name=generator content="Hugo 0.167.0"` and a pattern written
            # from the unminified source matches nothing -- a check that can
            # only fail is not a check.
            case "$body" in
              *'content="Hugo'*) echo "Hugo, as built"; exit 0 ;;
            esac
            echo "attempt $i: not ours yet, waiting"
            sleep 10
          done
          echo "::error::$url is not serving this build."
          echo "$body" | grep -i 'name="generator"' || echo "(no generator meta at all)"
          echo "Check Settings -> Pages: the source must be GitHub Actions, not a branch."
          exit 1
