l_titleTail: "слайды в стиле Marp на чистом Go"
l_description: "go-slides — Markdown Marp, который читается и отрисовывается на чистом Go (CGO=0), с интерполяцией text/template и kinds. {{ .version }}: HTML, expand, PNG/JPEG, векторный PDF, редактируемые PPTX и ODP, математика, подсветка кода, заголовки по ширине, эмодзи, HCL, watch и serve, переходы, режимы докладчика и обзора, номера строк и выноски в коде — без headless Chrome."
l_playgroundTitleTail: "песочница: слайды в вашем браузере"
