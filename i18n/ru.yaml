l_headA: "Презентации в Markdown,"
l_headB: "отрисованные на чистом Go."
l_sub: "<code>slides</code> читает тот Markdown, который читает <a href=\"https://marp.app\">Marp</a> — директивы, <code>---</code> между слайдами, фоны <code>![bg]</code>, заметки докладчика, встроенные темы — и добавляет две вещи, которых в Marp нет: <b>шаблоны Go</b> внутри презентации и <b>kinds</b> (типы слайдов), чтобы слайд говорил, чем он является, а не повторял, как он выглядит. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Читать документацию →"
l_ctaTry: "Попробовать в браузере →"
l_trustVersion: "<b>{{ .version }}</b> — выпущена"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, векторный и доступный <b>PDF</b>, редактируемые <b>PPTX</b> и <b>ODP</b>, математика, код с номерами строк и выносками, эмодзи, HCL, <b>watch</b>, <b>serve</b>, <b>режим докладчика</b> и <b>обзор слайдов</b> уже сегодня"
l_trustNoChrome: "без headless Chrome"
l_stripLead: "Одна организация, <b>{{ .n }}</b> репозиториев"

l_marpEyebrow: "Совместимость"
l_marpTitle: "Презентация Marp — это презентация <i>go-slides</i>."
l_marpLead: "Синтаксис — это синтаксис Marpit и Marp Core, а не его диалект. Презентация, написанная для Marp, читается здесь точно так же, а <code>slides expand</code> возвращает обычный Markdown для Marp, так что ничто из написанного с двумя дополнениями ниже не привязано к инструменту."
l_marpC1T: "Слайды и директивы"
l_marpC1P: "<code>---</code> разделяет слайды. Глобальные, локальные и точечные (<code>_class</code>) директивы, во front matter или в HTML-комментариях, с наследованием Marp от слайда к слайду."
l_marpC2T: "Изображения и фоны"
l_marpC2P: "<code>![bg]</code>, его размеры и фильтры, разделённые фоны и ключевые слова изображений, которые понимает Marp."
l_marpC3T: "Вокруг слайда"
l_marpC3P: "Верхний и нижний колонтитулы и нумерация; заметки докладчика из комментариев; списки с постепенным появлением; <code>&lt;style scoped&gt;</code> для CSS одного слайда."
l_marpC4T: "Встроенные темы"
l_marpC4P: "<code>default</code>, <code>gaia</code> и <code>uncover</code>, выбираются через <code>theme:</code>, как в Marp."

l_tplEyebrow: "Первое дополнение"
l_tplTitle: "Шаблоны Go <i>внутри</i> презентации."
l_tplLead: "Презентация — это <code>text/template</code>, вычисляемый до разбора Markdown, поэтому шаблон может порождать слайды, а презентация — быть данными плюс макетом."
l_tplC1T: "Значения"
l_tplC1P: "<code>{{ .a }}</code> читает front matter, а его отображение <code>data:</code> хранит всё остальное, что нужно презентации."
l_tplC2T: "Слайды из данных"
l_tplC2P: "<code>{{ .a }}</code>, выдающий <code>---</code>, — генератор слайдов: по слайду на элемент, на докладчика, на релиз."
l_tplC3T: "Страница и общее число"
l_tplC3P: "<code>{{ .a }}</code> и <code>{{ .b }}</code> становятся известны только после разделения презентации на слайды и подставляются тогда."
l_tplC4T: "Код остаётся нетронутым"
l_tplC4P: "Блоки кода и встроенный код по умолчанию не вычисляются, так что слайд о шаблонах Go может показать шаблон. <code>include</code> подключает другой файл."

l_kindsEyebrow: "Второе дополнение"
l_kindsTitle: "Слайд говорит, чем он <i>является</i>."
l_kindsLead: "<code>kind: section</code> называет набор локальных директив — колонтитулы, нумерацию, класс, фон. <code>kind:</code> действует на слайд и следующие за ним, <code>_kind:</code> — на один слайд. Директивы, записанные на самом слайде, по-прежнему главнее."
l_kindsC1T: "Встроенные"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> и <code>blank</code>, каждый можно переопределить."
l_kindsC2T: "Определены один раз, общие"
l_kindsC2P: "В <code>kinds:</code> во front matter или в YAML-файле kinds, который называют все презентации команды."
l_kindsC3T: "Ничто не просачивается"
l_kindsC3P: "Смена kind сбрасывает то, что задал предыдущий, так что класс или колонтитул не переходит в следующий раздел."

l_pgEyebrow: "Попробуйте"
l_pgTitle: "Презентация в вашем <i>браузере</i>."
l_pgLead: "<a href=\"/playground/\">Песочница</a> — это сам go-slides, скомпилированный в WebAssembly: пишите слева, слайды появляются справа. Ничего не устанавливается и ничего не отправляется на сервер."
l_pgNote: "Интерфейс самой песочницы следует языку страницы."
l_pgFailed: "Не удалось загрузить песочницу."
l_pgStarting: "Запуск…"
l_pgReady: "go-slides готов."
l_pgC1T: "Вживую"
l_pgC1P: "Слайды отрисовываются в worker по мере набора, превью прокручивается вместе с редактором, за ним следуют миникарта и колонка миниатюр слайдов, а показ воспроизводит переходы. «Показ» открывает режим докладчика с заметками и таймером во втором окне."
l_pgC2T: "Справка внутри"
l_pgC2P: "Автодополнение и пояснения для директив, kinds и функций шаблонов; проблемы отмечаются на своей строке; примеры презентаций, среди них математика, изображения и фоны (перетащите файл изображения в редактор); ссылки на документацию. Панель файлов хранит проект: ваши темы, kinds и файлы данных, а также перетащенные медиафайлы — в той же структуре, что строит команда <code>slides</code>. Вкладка «Формат» пишет Markdown за вас, с отменой: жирный, курсив, подчёркивание, списки, таблица из сетки, выравнивание текста слайда и ссылки. Размер каждой панели можно менять."
l_pgC3T: "Поделиться, сохранить, оставить"
l_pgC3P: "Ссылка несёт саму презентацию, сжатую в её <code>#</code>. Сохраните её как HTML, векторный PDF или редактируемую презентацию PowerPoint или OpenDocument — всё это делается в вашем браузере, — или скачайте весь проект в виде <code>.zip</code>. Черновик переживает перезагрузку, только в вашем браузере."
l_pgOpen: "Открыть песочницу →"
l_pgGallery: "Посмотреть галерею примеров →"

l_outEyebrow: "Что он умеет"
l_outTitle: "Сначала HTML. Остальное — <i>без</i> управляемого браузера."
l_outLead: "marp-cli рисует изображения и PDF, управляя headless Chrome. Здесь это делают собственные библиотеки Go нашей организации. Изображения и PDF появились в v0.1.0, PPTX, математика и подсветка — в v0.2.0, ODP, заголовки по ширине и HCL — в v0.3.0, векторный PDF (с выделяемым текстом) и эмодзи — в v0.4.0; в v0.5.0 PPTX и ODP стали редактируемыми, тогда как PPTX у marp-cli состоит из картинок; v0.6.0 добавляет watch, serve, переходы и параметры marp-cli, v0.7.0 — режим докладчика; см. <a href=\"https://go-slides.github.io/docs/\">документацию</a>."
l_planned: "запланировано"

