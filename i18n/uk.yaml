l_titleTail: "Слайд-презентації, сумісні з Marp, на чистому Go"
l_description: "go-slides — Markdown Marp, що читається й рендериться на чистому Go (CGO=0), з інтерполяцією Go text/template та kinds слайдів. {{ .version }}: HTML, expand, PNG/JPEG, векторний PDF, редаговані PPTX і ODP, математика, підсвічування коду, заголовки за шириною, емодзі, HCL, watch і serve, переходи, вигляд доповідача й огляд, номери рядків та виноски в коді, без headless Chrome."
l_playgroundTitleTail: "Playground: слайди у вашому браузері"
l_playgroundDescription: "Пишіть презентацію Marp із шаблонами Go та kinds слайдів і дивіться, як слайди йдуть слідом — сам go-slides, скомпільований у WebAssembly, у вашому браузері, без сервера."
l_logoAlt: "логотип go-slides"

