l_headA: "Презентації у Markdown,"
l_headB: "відрендерені на чистому Go."
l_sub: "<code>slides</code> читає той Markdown, який читає <a href=\"https://marp.app\">Marp</a> — директиви, <code>---</code> між слайдами, фони <code>![bg]</code>, нотатки доповідача, вбудовані теми — і додає дві речі, яких у Marp немає: <b>шаблони Go</b> усередині презентації та <b>kinds</b> (види слайдів), щоб слайд казав, чим він є, а не повторював, як він виглядає. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Читати документацію →"
l_ctaTry: "Спробувати в браузері →"
l_trustVersion: "<b>{{ .version }}</b> — випущено"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, векторний і доступний <b>PDF</b>, редаговані <b>PPTX</b> та <b>ODP</b>, векторні математика й емодзі, код із номерами рядків і виносками, HCL, <b>watch</b>, <b>serve</b>, <b>вигляд доповідача</b> та <b>вигляд огляду</b> уже сьогодні"
l_trustNoChrome: "без headless Chrome"
l_stripLead: "Одна організація, <b>{{ .n }}</b> репозиторіїв"

l_marpEyebrow: "Сумісність"
l_marpTitle: "Презентація Marp — це презентація <i>go-slides</i>."
l_marpLead: "Синтаксис — це синтаксис Marpit і Marp Core, а не його діалект. Презентація, написана для Marp, читається тут так само, а <code>slides expand</code> повертає звичайний Markdown Marp, тож нічого, написаного з двома доповненнями нижче, не заблоковано."
l_marpC1T: "Слайди та директиви"
l_marpC1P: "<code>---</code> розділяє слайди. Глобальні, локальні та spot-директиви (<code>_class</code>), у front matter або в HTML-коментарях, зі спадкуванням Marp від слайда до слайда."
l_marpC2T: "Зображення та фони"
l_marpC2P: "<code>![bg]</code>, його розміри й фільтри, розділені фони та ключові слова зображень, які розуміє Marp."
l_marpC3T: "Навколо слайда"
l_marpC3P: "Верхній і нижній колонтитули та нумерація; нотатки доповідача з коментарів; поетапні списки; <code>&lt;style scoped&gt;</code> для CSS одного слайда."
l_marpC4T: "Вбудовані теми"
l_marpC4P: "<code>default</code>, <code>gaia</code> та <code>uncover</code>, що вибираються через <code>theme:</code> як у Marp."

l_tplEyebrow: "Перше доповнення"
l_tplTitle: "Шаблони Go <i>всередині</i> презентації."
l_tplLead: "Презентація — це <code>text/template</code>, що обчислюється до розбору Markdown, — тож шаблон може генерувати слайди, а презентація може бути даними плюс макетом."
l_tplC1T: "Значення"
l_tplC1P: "<code>{{ .a }}</code> читає front matter, а його відображення <code>data:</code> містить усе, що ще потрібно презентації."
l_tplC2T: "Слайди з даних"
l_tplC2P: "<code>{{ .a }}</code>, що видає <code>---</code>, — це генератор слайдів: один слайд на елемент, на доповідача, на випуск."
l_tplC3T: "Сторінка та підсумок"
l_tplC3P: "<code>{{ .a }}</code> і <code>{{ .b }}</code> відомі лише після розбиття презентації й заповнюються саме тоді."
l_tplC4T: "Код не чіпають"
l_tplC4P: "Блоки коду й рядковий код типово не обчислюються, тож слайд про шаблони Go може його показати. <code>include</code> підтягує інший файл."

l_kindsEyebrow: "Друге доповнення"
l_kindsTitle: "Слайд каже, чим він <i>є</i>."
l_kindsLead: "<code>kind: section</code> називає набір локальних директив — верхній колонтитул, нижній колонтитул, нумерацію, клас, фон. <code>kind:</code> застосовується до слайда й наступних, <code>_kind:</code> — до одного слайда. Директиви, написані на слайді, як і раніше мають перевагу."
l_kindsC1T: "Вбудовані"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> і <code>blank</code>, кожен можна перевизначити."
l_kindsC2T: "Визначені раз, спільні"
l_kindsC2P: "У <code>kinds:</code> front matter або у файлі kinds YAML, який називає кожна презентація команди."
l_kindsC3T: "Нічого не витікає"
l_kindsC3P: "Перемикання kinds скидає те, що встановив попередній, тож клас чи нижній колонтитул не перейде за вами до наступного розділу."

l_pgEyebrow: "Спробуйте"
l_pgTitle: "Презентація у вашому <i>браузері</i>."
l_pgLead: "<a href=\"/playground/\">Playground</a> — це сам go-slides, скомпільований у WebAssembly: пишіть ліворуч, слайди йдуть слідом праворуч. Нічого не встановлюється й нічого не надсилається на сервер."
l_pgNote: "Інтерфейс самого Playground відповідає мові сторінки."
l_pgFailed: "Не вдалося завантажити Playground."
l_pgStarting: "Запуск…"
l_pgReady: "go-slides готовий."
l_pgC1T: "Наживо"
l_pgC1P: "Слайди рендеряться у воркері під час набору, попередній перегляд прокручується разом із редактором, за ним йдуть мінікарта й колонка мініатюр слайдів, а показ презентує з переходами. Present відкриває вигляд доповідача з вашими нотатками й таймером у другому вікні."
l_pgC2T: "Вбудована довідка"
l_pgC2P: "Автодоповнення та пояснення для директив, kinds і функцій шаблонів; проблеми, позначені на своєму рядку; приклади презентацій, серед них математика, зображення й фони (киньте файл зображення в редактор); посилання на документацію. Панель файлів містить проєкт: ваші теми, kinds і файли даних та медіа, які ви скидаєте, у тому макеті, який збирає команда <code>slides</code>. Вкладка Format пише Markdown за вас, з Undo: жирний, курсив, підкреслення, списки, таблиця із сітки, вирівнювання тексту слайда й посилання. Кожна панель змінює розмір."
l_pgC3T: "Поділитися, зберегти, залишити"
l_pgC3P: "Посилання несе саму презентацію, стиснуту в його <code>#</code>. Збережіть її як HTML, векторний PDF або редаговану презентацію PowerPoint чи OpenDocument, усе створюється у вашому браузері, або завантажте весь проєкт як <code>.zip</code>. Ваша чернетка переживає перезавантаження, лише у вашому браузері."
l_pgOpen: "Відкрити Playground →"
l_pgGallery: "Переглянути галерею прикладів →"

l_outEyebrow: "Що це вміє"
l_outTitle: "Спершу HTML. Решта — <i>без</i> браузера, яким треба керувати."
l_outLead: "marp-cli рендерить зображення й PDF, керуючи headless Chrome. Тут це натомість роблять власні бібліотеки Go флоту. Зображення й PDF з'явилися у v0.1.0, PPTX, математика й підсвічування — у v0.2.0, ODP, заголовки за шириною й HCL — у v0.3.0, векторний PDF (з текстом, який можна виділяти) та емодзі — у v0.4.0; у v0.5.0 PPTX і ODP стали редагованими, тоді як PPTX у marp-cli — це картинки; v0.6.0 додає watch, serve, переходи та параметри marp-cli, v0.7.0 — вигляд доповідача — див. <a href=\"https://go-slides.github.io/docs/\">документацію</a>."
l_planned: "заплановано"

