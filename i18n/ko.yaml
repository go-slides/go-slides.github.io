l_titleTail: "순수 Go로 만드는 Marp 호환 슬라이드 덱"
l_description: "go-slides — Marp의 Markdown을 순수 Go(CGO=0)로 읽고 렌더링하며, Go text/template 보간과 슬라이드 종류를 더했습니다. {{ .version }}: HTML, expand, PNG/JPEG, 벡터 PDF, 편집 가능한 PPTX와 ODP, 수식, 코드 하이라이트, 폭에 맞춘 제목, 이모지, HCL, watch와 serve, 전환 효과, 발표자 보기와 개요 보기, 줄 번호와 코드 콜아웃을 headless Chrome 없이 제공합니다."
l_playgroundTitleTail: "플레이그라운드: 브라우저에서 만드는 슬라이드"
l_playgroundDescription: "Go 템플릿과 슬라이드 종류로 Marp 덱을 작성하면 슬라이드가 바로 따라옵니다 — WebAssembly로 컴파일된 go-slides 그 자체가 서버 없이 브라우저에서 동작합니다."
