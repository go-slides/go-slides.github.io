l_headA: "Markdown으로 쓰는 슬라이드 덱,"
l_headB: "순수 Go로 렌더링합니다."
l_sub: "<code>slides</code>는 <a href=\"https://marp.app\">Marp</a>가 읽는 Markdown을 그대로 읽습니다 — 디렉티브, 슬라이드 사이의 <code>---</code>, <code>![bg]</code> 배경, 발표자 노트, 내장 테마까지. 여기에 Marp에 없는 두 가지를 더합니다. 덱 안의 <b>Go 템플릿</b>, 그리고 슬라이드가 어떻게 보이는지를 반복하는 대신 무엇인지를 말하게 해 주는 <b>슬라이드 종류</b>입니다. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "문서 읽기 →"
l_ctaTry: "브라우저에서 써 보기 →"
l_trustVersion: "<b>{{ .version }}</b> — 릴리스됨"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, 접근성을 갖춘 벡터 <b>PDF</b>, 편집 가능한 <b>PPTX</b>와 <b>ODP</b>, 수식, 줄 번호와 콜아웃이 있는 코드, 이모지, HCL, <b>watch</b>, <b>serve</b>, <b>발표자 보기</b>와 <b>개요 보기</b>를 지금 바로 사용할 수 있습니다"
l_trustNoChrome: "headless Chrome 불필요"
l_stripLead: "하나의 조직, <b>{{ .n }}</b>개의 저장소"

l_marpEyebrow: "호환성"
l_marpTitle: "Marp 덱은 곧 <i>go-slides</i> 덱입니다."
l_marpLead: "문법은 Marpit과 Marp Core의 것이며, 별도의 방언이 아닙니다. Marp용으로 작성한 덱을 여기서도 똑같이 읽고, <code>slides expand</code>는 평범한 Marp Markdown으로 되돌려 주므로 아래 두 가지 추가 기능으로 작성한 내용에 갇힐 일이 없습니다."
l_marpC1T: "슬라이드와 디렉티브"
l_marpC1P: "<code>---</code>로 슬라이드를 나눕니다. 프런트 매터나 HTML 주석 안의 전역, 로컬, 스폿(<code>_class</code>) 디렉티브를 지원하며, 슬라이드 간 상속도 Marp와 같습니다."
l_marpC2T: "이미지와 배경"
l_marpC2P: "<code>![bg]</code>와 그 크기 및 필터, 분할 배경, 그리고 Marp가 이해하는 이미지 키워드를 지원합니다."
l_marpC3T: "슬라이드 주변"
l_marpC3P: "헤더, 푸터, 페이지 번호; 주석에서 가져오는 발표자 노트; 단계별로 나타나는 목록; 슬라이드 하나만의 CSS를 위한 <code>&lt;style scoped&gt;</code>."
l_marpC4T: "내장 테마"
l_marpC4P: "<code>default</code>, <code>gaia</code>, <code>uncover</code>를 Marp처럼 <code>theme:</code>로 선택합니다."

l_tplEyebrow: "첫 번째 추가 기능"
l_tplTitle: "덱 <i>안에서</i> 쓰는 Go 템플릿."
l_tplLead: "덱은 <code>text/template</code>이며 Markdown을 파싱하기 전에 평가됩니다. 그래서 템플릿으로 슬라이드를 생성할 수 있고, 덱을 데이터와 레이아웃의 조합으로 만들 수 있습니다."
l_tplC1T: "값"
l_tplC1P: "<code>{{ .a }}</code>는 프런트 매터를 읽고, 그 <code>data:</code> 매핑에는 덱에 필요한 그 밖의 무엇이든 담을 수 있습니다."
l_tplC2T: "데이터로 만드는 슬라이드"
l_tplC2P: "<code>---</code>를 출력하는 <code>{{ .a }}</code>는 슬라이드 생성기입니다. 항목마다, 발표자마다, 릴리스마다 슬라이드가 하나씩 만들어집니다."
l_tplC3T: "페이지와 전체 수"
l_tplC3P: "<code>{{ .a }}</code>와 <code>{{ .b }}</code>는 덱이 나뉜 뒤에야 알 수 있으므로 그때 채워집니다."
l_tplC4T: "코드는 건드리지 않습니다"
l_tplC4P: "펜스 블록과 인라인 코드는 기본적으로 평가하지 않으므로, Go 템플릿을 설명하는 슬라이드에 템플릿을 그대로 보여 줄 수 있습니다. <code>include</code>로 다른 파일을 불러옵니다."

l_kindsEyebrow: "두 번째 추가 기능"
l_kindsTitle: "슬라이드가 스스로 <i>무엇인지</i> 말합니다."
l_kindsLead: "<code>kind: section</code>은 헤더, 푸터, 페이지 번호, 클래스, 배경 같은 로컬 디렉티브 묶음에 이름을 붙입니다. <code>kind:</code>는 해당 슬라이드와 그 뒤 슬라이드에, <code>_kind:</code>는 한 슬라이드에만 적용됩니다. 슬라이드에 직접 쓴 디렉티브가 항상 우선합니다."
l_kindsC1T: "내장 종류"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code>, <code>blank</code>가 있으며, 모두 다시 정의할 수 있습니다."
l_kindsC2T: "한 번 정의하고 공유"
l_kindsC2P: "프런트 매터의 <code>kinds:</code>에, 또는 팀의 모든 덱이 가리키는 종류 YAML 파일에 정의합니다."
l_kindsC3T: "새어 나가지 않습니다"
l_kindsC3P: "종류를 바꾸면 이전 종류가 설정한 값이 지워지므로, 클래스나 푸터가 다음 섹션까지 따라오지 않습니다."

l_pgEyebrow: "써 보기"
l_pgTitle: "<i>브라우저</i> 안의 덱."
l_pgLead: "<a href=\"/playground/\">플레이그라운드</a>는 WebAssembly로 컴파일된 go-slides 그 자체입니다. 왼쪽에 쓰면 오른쪽에 슬라이드가 따라옵니다. 아무것도 설치하지 않고, 아무것도 서버로 보내지 않습니다."
l_pgNote: "플레이그라운드 인터페이스는 페이지의 언어를 따릅니다."
l_pgFailed: "플레이그라운드를 불러오지 못했습니다."
l_pgStarting: "시작하는 중…"
l_pgReady: "go-slides가 준비되었습니다."
l_pgC1T: "실시간"
l_pgC1P: "입력하는 동안 워커에서 슬라이드가 렌더링되고, 미리 보기는 편집기와 함께 스크롤되며, 미니맵과 슬라이드 썸네일 열이 그 뒤를 따릅니다. 슬라이드쇼는 전환 효과와 함께 발표됩니다. Present를 누르면 노트와 타이머가 있는 발표자 보기가 두 번째 창에 열립니다."
l_pgC2T: "내장된 도움말"
l_pgC2P: "디렉티브, 종류, 템플릿 함수의 자동 완성과 설명; 해당 줄에 표시되는 문제; 수식, 이미지, 배경 등을 담은 예제 덱(이미지 파일을 편집기에 끌어다 놓으세요); 문서로 가는 링크. 파일 패널은 프로젝트를 담습니다. 테마, 종류, 데이터 파일, 끌어다 놓은 미디어가 <code>slides</code> 명령이 만드는 구조 그대로 들어갑니다. Format 탭은 Undo와 함께 Markdown을 대신 써 줍니다: 굵게, 기울임, 밑줄, 목록, 격자로 만드는 표, 슬라이드 텍스트 정렬, 링크. 모든 창은 크기를 조절할 수 있습니다."
l_pgC3T: "공유, 저장, 보관"
l_pgC3P: "링크에는 덱 자체가 <code>#</code> 안에 압축되어 담깁니다. HTML, 벡터 PDF, 편집 가능한 PowerPoint 또는 OpenDocument 덱으로 저장할 수 있으며 모두 브라우저에서 만들어집니다. 프로젝트 전체를 <code>.zip</code>으로 내려받을 수도 있습니다. 작성 중인 초안은 새로 고침 후에도 남으며, 오직 브라우저에만 저장됩니다."
l_pgOpen: "플레이그라운드 열기 →"
l_pgGallery: "예제 갤러리 둘러보기 →"

l_outEyebrow: "할 수 있는 일"
l_outTitle: "HTML이 먼저. 나머지는 브라우저를 구동하지 <i>않고</i>."
l_outLead: "marp-cli는 headless Chrome을 구동해 이미지와 PDF를 렌더링합니다. 여기서는 플릿 자체의 Go 라이브러리가 그 일을 대신합니다. 이미지와 PDF는 v0.1.0, PPTX와 수식, 하이라이트는 v0.2.0, ODP와 폭에 맞춘 제목, HCL은 v0.3.0, 텍스트를 선택할 수 있는 벡터 PDF와 이모지는 v0.4.0에 추가되었습니다. v0.5.0에서는 PPTX와 ODP를 편집할 수 있게 되었는데, marp-cli의 PPTX는 그림일 뿐입니다. v0.6.0은 watch, serve, 전환 효과와 marp-cli의 옵션을, v0.7.0은 발표자 보기를 더했습니다 — <a href=\"https://go-slides.github.io/docs/\">문서</a>를 참고하세요."
l_planned: "계획됨"

