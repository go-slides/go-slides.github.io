l_headA: "Slide decks in Markdown,"
l_headB: "rendered in pure Go."
l_sub: "<code>slides</code> reads the Markdown <a href=\"https://marp.app\">Marp</a> reads — directives, <code>---</code> between slides, <code>![bg]</code> backgrounds, speaker notes, the built-in themes — and adds two things Marp does not have: <b>Go templates</b> inside the deck, and <b>slide kinds</b>, so a slide says what it is instead of repeating how it looks. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Read the documentation →"
l_ctaTry: "Try it in your browser →"
l_trustVersion: "<b>{{ .version }}</b> — released"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, vector <b>PDF</b>, editable <b>PPTX</b> and <b>ODP</b>, math, code with line numbers and callouts, emoji, HCL, <b>watch</b>, <b>serve</b>, a <b>presenter</b> and an <b>overview view</b> today"
l_trustNoChrome: "no headless Chrome"
l_stripLead: "One organisation, <b>{{ .n }}</b> repositories"

l_marpEyebrow: "Compatibility"
l_marpTitle: "A Marp deck is a <i>go-slides</i> deck."
l_marpLead: "The syntax is Marpit's and Marp Core's, not a dialect of it. A deck written for Marp is read the same way here, and <code>slides expand</code> gives back plain Marp Markdown, so nothing written with the two additions below is locked in."
l_marpC1T: "Slides and directives"
l_marpC1P: "<code>---</code> splits slides. Global, local and spot (<code>_class</code>) directives, in the front matter or in HTML comments, with Marp's inheritance from one slide to the next."
l_marpC2T: "Images and backgrounds"
l_marpC2P: "<code>![bg]</code>, its sizes and filters, split backgrounds, and the image keywords Marp understands."
l_marpC3T: "Around the slide"
l_marpC3P: "Header, footer and pagination; speaker notes from comments; fragmented lists; <code>&lt;style scoped&gt;</code> for one slide's CSS."
l_marpC4T: "The built-in themes"
l_marpC4P: "<code>default</code>, <code>gaia</code> and <code>uncover</code>, selected with <code>theme:</code> as in Marp."

l_tplEyebrow: "The first addition"
l_tplTitle: "Go templates, <i>inside</i> the deck."
l_tplLead: "The deck is a <code>text/template</code>, evaluated before the Markdown is parsed — so a template can generate slides, and a deck can be data plus a layout."
l_tplC1T: "Values"
l_tplC1P: "<code>{{ .a }}</code> reads the front matter, and its <code>data:</code> mapping holds whatever else the deck needs."
l_tplC2T: "Slides from data"
l_tplC2P: "A <code>{{ .a }}</code> that emits <code>---</code> is a slide generator: one slide per item, per speaker, per release."
l_tplC3T: "Page and total"
l_tplC3P: "<code>{{ .a }}</code> and <code>{{ .b }}</code> are known only once the deck is split, and are filled in then."
l_tplC4T: "Code is left alone"
l_tplC4P: "Fenced blocks and inline code are not evaluated by default, so a slide about Go templates can show one. <code>include</code> pulls another file in."

l_kindsEyebrow: "The second addition"
l_kindsTitle: "A slide says what it <i>is</i>."
l_kindsLead: "<code>kind: section</code> names a preset of local directives — header, footer, pagination, class, background. <code>kind:</code> applies to the slide and those after it, <code>_kind:</code> to one slide. Directives written on the slide still win."
l_kindsC1T: "Built in"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> and <code>blank</code>, each redefinable."
l_kindsC2T: "Defined once, shared"
l_kindsC2P: "In the front matter's <code>kinds:</code>, or in a kinds YAML file that every deck of a team names."
l_kindsC3T: "Nothing leaks"
l_kindsC3P: "Switching kinds clears what the previous one set, so a class or a footer does not follow you into the next section."

l_pgEyebrow: "Try it"
l_pgTitle: "A deck in your <i>browser</i>."
l_pgLead: "The <a href=\"/playground/\">playground</a> is go-slides itself, compiled to WebAssembly: write on the left, the slides follow on the right. Nothing is installed and nothing is sent to a server."
l_pgNote: "The playground's own interface is in English."
l_pgC1T: "Live"
l_pgC1P: "The slides render in a worker as you type, the preview scrolls with the editor, a minimap and a column of slide thumbnails follow it, and the slideshow presents with its transitions. Present opens the presenter view, with your notes and a timer, in a second window."
l_pgC2T: "Help built in"
l_pgC2P: "Completion and explanations for directives, kinds and template functions; problems marked on their line; example decks, math, images and backgrounds among them (drop an image file into the editor); links to the documentation. A file panel holds the project: your themes, kinds and data files, and the media you drop, in the layout the <code>slides</code> command builds. A Format tab writes the Markdown for you, with Undo: bold, italic, underline, lists, a table from a grid, the slide's text alignment and links. Every pane resizes."
l_pgC3T: "Share, save, keep"
l_pgC3P: "A link carries the deck itself, compressed in its <code>#</code>. Save it as HTML, a vector PDF, or an editable PowerPoint or OpenDocument deck, all made in your browser, or download the whole project as a <code>.zip</code>. Your draft survives a reload, in your browser only."
l_pgOpen: "Open the playground →"
l_pgGallery: "Browse the gallery of examples →"

l_outEyebrow: "What it does"
l_outTitle: "HTML first. The rest <i>without</i> a browser to drive."
l_outLead: "marp-cli renders images and PDF by driving a headless Chrome. Here the fleet's own Go libraries do it instead. Images and PDF arrived in v0.1.0, PPTX, math and highlighting in v0.2.0, ODP, fitting headings and HCL in v0.3.0, the vector PDF (its text selectable) and emoji in v0.4.0; in v0.5.0 the PPTX and ODP became editable, where marp-cli's PPTX is pictures; v0.6.0 adds watch, serve, transitions and marp-cli's options, v0.7.0 the presenter view — see the <a href=\"https://go-slides.github.io/docs/\">documentation</a>."
