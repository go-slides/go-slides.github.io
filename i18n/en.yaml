l_titleTail: "Marp-compatible slide decks in pure Go"
l_description: "go-slides — Marp's Markdown read and rendered in pure Go (CGO=0), with Go text/template interpolation and slide kinds. {{ .version }}: HTML, expand, PNG/JPEG, vector PDF, editable PPTX and ODP, math, code highlighting, fitting headings, emoji, HCL, watch and serve, transitions, presenter and overview views, line numbers and code callouts, with no headless Chrome."
l_playgroundTitleTail: "playground: slides in your browser"
l_playgroundDescription: "Write a Marp deck with Go templates and slide kinds and watch the slides follow — go-slides itself compiled to WebAssembly, in your browser, with no server."
