l_headA: "スライドは Markdown で、"
l_headB: "レンダリングは純粋な Go で。"
l_sub: "<code>slides</code> は <a href=\"https://marp.app\">Marp</a> と同じ Markdown を読み込みます。ディレクティブ、スライド間の <code>---</code>、<code>![bg]</code> による背景、スピーカーノート、組み込みテーマ。そのうえで Marp にはない 2 つの機能を加えます。デッキの中で使える <b>Go テンプレート</b>と、見た目を繰り返し書く代わりにスライドの役割を宣言できる<b>kind</b>です。"
l_subLicence: "<code>CGO_ENABLED=0</code>、BSD-3-Clause。"
l_ctaDocs: "ドキュメントを読む →"
l_ctaTry: "ブラウザで試す →"
l_trustVersion: "<b>{{ .version }}</b> — リリース済み"
l_trustFeatures: "<b>HTML</b>、<b>expand</b>、<b>PNG/JPEG</b>、アクセシブルなベクター <b>PDF</b>、編集可能な <b>PPTX</b> と <b>ODP</b>、数式、行番号と注釈付きのコード、絵文字、HCL、<b>watch</b>、<b>serve</b>、<b>発表者ビュー</b>と<b>一覧ビュー</b>に対応済み"
l_trustNoChrome: "ヘッドレス Chrome 不要"
l_stripLead: "1 つの組織、<b>{{ .n }}</b> のリポジトリ"

l_marpEyebrow: "互換性"
l_marpTitle: "Marp のデッキは、そのまま <i>go-slides</i> のデッキです。"
l_marpLead: "構文は Marpit と Marp Core のものであり、独自の方言ではありません。Marp 向けに書いたデッキはここでも同じように読み込まれ、<code>slides expand</code> を使えば素の Marp Markdown に戻せるので、以下の 2 つの追加機能を使っても囲い込まれることはありません。"
l_marpC1T: "スライドとディレクティブ"
l_marpC1P: "<code>---</code> でスライドを区切ります。グローバル、ローカル、スポット（<code>_class</code>）のディレクティブをフロントマターや HTML コメントに書け、Marp と同じくスライドからスライドへ引き継がれます。"
l_marpC2T: "画像と背景"
l_marpC2P: "<code>![bg]</code> とそのサイズやフィルター、分割背景、そして Marp が解釈する画像キーワード。"
l_marpC3T: "スライドの周辺"
l_marpC3P: "ヘッダー、フッター、ページ番号。コメントから作るスピーカーノート。段階表示のリスト。1 枚のスライド専用の CSS を書く <code>&lt;style scoped&gt;</code>。"
l_marpC4T: "組み込みテーマ"
l_marpC4P: "<code>default</code>、<code>gaia</code>、<code>uncover</code> を、Marp と同じく <code>theme:</code> で選べます。"

l_tplEyebrow: "1 つめの追加機能"
l_tplTitle: "Go テンプレートを、デッキの<i>中で</i>。"
l_tplLead: "デッキは <code>text/template</code> として、Markdown の解析より前に評価されます。そのためテンプレートでスライドを生成でき、デッキを「データ＋レイアウト」として書けます。"
l_tplC1T: "値"
l_tplC1P: "<code>{{ .a }}</code> でフロントマターを読み、その <code>data:</code> マッピングにデッキが必要とするその他の値を置けます。"
l_tplC2T: "データからスライドを"
l_tplC2P: "<code>---</code> を出力する <code>{{ .a }}</code> はスライドのジェネレーターです。項目ごと、登壇者ごと、リリースごとに 1 枚のスライドを作れます。"
l_tplC3T: "ページ番号と総数"
l_tplC3P: "<code>{{ .a }}</code> と <code>{{ .b }}</code> はデッキを分割して初めて決まる値なので、その時点で埋め込まれます。"
l_tplC4T: "コードには手を加えません"
l_tplC4P: "コードブロックとインラインコードは既定では評価されないので、Go テンプレートを解説するスライドでもそのまま表示できます。<code>include</code> で別ファイルを取り込めます。"

l_kindsEyebrow: "2 つめの追加機能"
l_kindsTitle: "スライドが、自分の<i>役割</i>を語ります。"
l_kindsLead: "<code>kind: section</code> は、ヘッダー、フッター、ページ番号、クラス、背景といったローカルディレクティブのプリセットに名前を付けます。<code>kind:</code> はそのスライドと以降のスライドに、<code>_kind:</code> はそのスライドだけに適用されます。スライドに直接書いたディレクティブが常に優先されます。"
l_kindsC1T: "組み込み"
l_kindsC1P: "<code>title</code>、<code>section</code>、<code>content</code>、<code>blank</code>。いずれも再定義できます。"
l_kindsC2T: "一度定義して共有"
l_kindsC2P: "フロントマターの <code>kinds:</code> に書くか、チームのすべてのデッキが参照する kinds の YAML ファイルにまとめられます。"
l_kindsC3T: "設定が漏れ出さない"
l_kindsC3P: "kind を切り替えると前の kind が設定したものはクリアされるので、クラスやフッターが次のセクションまでついてくることはありません。"

l_pgEyebrow: "試してみる"
l_pgTitle: "デッキを<i>ブラウザ</i>で。"
l_pgLead: "<a href=\"/playground/\">Playground</a> は、WebAssembly にコンパイルした go-slides そのものです。左側に書くと、右側のスライドが追従します。インストールは不要で、サーバーには何も送信されません。"
l_pgNote: "Playground の画面はページの言語に従います。"
l_pgFailed: "Playground を読み込めませんでした。"
l_pgStarting: "起動しています…"
l_pgReady: "go-slides の準備ができました。"
l_pgC1T: "ライブ"
l_pgC1P: "入力に合わせてワーカー内でスライドがレンダリングされ、プレビューはエディターと連動してスクロールし、ミニマップとスライドのサムネイル列も追従します。スライドショーはトランジション付きで再生されます。「Present」を押すと、ノートとタイマー付きの発表者ビューが別ウィンドウで開きます。"
l_pgC2T: "ヘルプを内蔵"
l_pgC2P: "ディレクティブ、kind、テンプレート関数の補完と解説。問題は該当行に表示。数式、画像、背景などのサンプルデッキ（画像ファイルはエディターにドロップできます）。ドキュメントへのリンク。ファイルパネルには、テーマ、kind、データファイル、ドロップしたメディアといったプロジェクト一式が、<code>slides</code> コマンドが作るのと同じ構成で並びます。Format タブは、太字、斜体、下線、リスト、グリッドから作る表、スライドの文字揃え、リンクの Markdown を代わりに書いてくれます（元に戻すこともできます）。すべてのペインはサイズを変更できます。"
l_pgC3T: "共有・保存・保持"
l_pgC3P: "リンクの <code>#</code> にはデッキそのものが圧縮して格納されます。HTML、ベクター PDF、編集可能な PowerPoint や OpenDocument として保存でき、すべてブラウザ内で生成されます。プロジェクト全体を <code>.zip</code> でダウンロードすることもできます。下書きはリロードしても残り、保存先はお使いのブラウザだけです。"
l_pgOpen: "Playground を開く →"
l_pgGallery: "サンプルのギャラリーを見る →"

l_outEyebrow: "できること"
l_outTitle: "まず HTML。残りは、ブラウザを操作<i>せずに</i>。"
l_outLead: "marp-cli は画像や PDF をヘッドレス Chrome を操作してレンダリングします。go-slides では、代わりにフリート自身の Go ライブラリがそれを担います。画像と PDF は v0.1.0、PPTX・数式・ハイライトは v0.2.0、ODP・見出しの自動フィット・HCL は v0.3.0、ベクター PDF（テキスト選択可能）と絵文字は v0.4.0 で登場しました。v0.5.0 では PPTX と ODP が編集可能になりました（marp-cli の PPTX は画像です）。v0.6.0 で watch、serve、トランジション、marp-cli のオプション、v0.7.0 で発表者ビューが加わりました。詳しくは<a href=\"https://go-slides.github.io/docs/\">ドキュメント</a>をご覧ください。"
l_planned: "予定"

