l_titleTail: "純粋な Go で作る Marp 互換のスライド"
l_description: "go-slides — Marp の Markdown を純粋な Go（CGO=0）で読み込み・レンダリングし、Go の text/template による埋め込みとkind（スライドの種類）を加えます。{{ .version }}：HTML、expand、PNG/JPEG、ベクター PDF、編集可能な PPTX と ODP、数式、コードのハイライト、見出しの自動フィット、絵文字、HCL、watch と serve、トランジション、発表者ビューと一覧ビュー、行番号とコードの注釈に対応し、ヘッドレス Chrome は不要です。"
l_playgroundTitleTail: "Playground：ブラウザでスライドを"
l_playgroundDescription: "Go テンプレートとkind を使って Marp のデッキを書くと、スライドがその場で追従します。WebAssembly にコンパイルした go-slides そのものが、サーバーなしでブラウザ上で動きます。"
l_logoAlt: "go-slides のロゴ"

