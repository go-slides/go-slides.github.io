l_headA: "用 Markdown 写幻灯片，"
l_headB: "用纯 Go 来渲染。"
l_sub: "<code>slides</code> 读取的正是 <a href=\"https://marp.app\">Marp</a> 所读的 Markdown：指令、幻灯片之间的 <code>---</code>、<code>![bg]</code> 背景、演讲者备注、内置主题。它还新增了 Marp 没有的两样东西：演示文稿内的 <b>Go 模板</b>，以及<b>幻灯片类型</b>，让每张幻灯片直接声明自己是什么，而不必一再重复它的样式。"
l_subLicence: "<code>CGO_ENABLED=0</code>，BSD-3-Clause 许可。"
l_ctaDocs: "阅读文档 →"
l_ctaTry: "在浏览器中试用 →"
l_trustVersion: "<b>{{ .version }}</b> 已发布"
l_trustFeatures: "现已支持 <b>HTML</b>、<b>expand</b>、<b>PNG/JPEG</b>、无障碍矢量 <b>PDF</b>、可编辑的 <b>PPTX</b> 和 <b>ODP</b>、数学公式、带行号与标注的代码、emoji、HCL、<b>watch</b>、<b>serve</b>、<b>演讲者视图</b>和<b>总览视图</b>"
l_trustNoChrome: "无需无头 Chrome"
l_stripLead: "一个组织，<b>{{ .n }}</b> 个仓库"

l_marpEyebrow: "兼容性"
l_marpTitle: "Marp 演示文稿就是 <i>go-slides</i> 演示文稿。"
l_marpLead: "语法就是 Marpit 和 Marp Core 的语法，而不是它的某种方言。为 Marp 编写的演示文稿在这里以同样的方式读取；<code>slides expand</code> 还能导出纯粹的 Marp Markdown，因此用下面两项扩展写成的内容不会被锁定。"
l_marpC1T: "幻灯片与指令"
l_marpC1P: "<code>---</code> 分隔幻灯片。全局、局部和单页（<code>_class</code>）指令，可写在 front matter 或 HTML 注释中，并沿用 Marp 在幻灯片之间的继承规则。"
l_marpC2T: "图片与背景"
l_marpC2P: "<code>![bg]</code> 及其尺寸与滤镜、分栏背景，以及 Marp 能识别的各种图片关键字。"
l_marpC3T: "幻灯片周边"
l_marpC3P: "页眉、页脚和页码；来自注释的演讲者备注；分步显示的列表；用 <code>&lt;style scoped&gt;</code> 为单张幻灯片写 CSS。"
l_marpC4T: "内置主题"
l_marpC4P: "<code>default</code>、<code>gaia</code> 和 <code>uncover</code>，与 Marp 一样用 <code>theme:</code> 选择。"

l_tplEyebrow: "第一项扩展"
l_tplTitle: "Go 模板，就写在演示文稿<i>里面</i>。"
l_tplLead: "整个演示文稿是一个 <code>text/template</code>，在解析 Markdown 之前求值。因此模板可以生成幻灯片，演示文稿也可以是「数据加版式」。"
l_tplC1T: "取值"
l_tplC1P: "<code>{{ .a }}</code> 读取 front matter，其中的 <code>data:</code> 映射可存放演示文稿所需的任何其他内容。"
l_tplC2T: "由数据生成幻灯片"
l_tplC2P: "输出 <code>---</code> 的 <code>{{ .a }}</code> 就是幻灯片生成器：每个条目、每位讲者、每次发布各一张。"
l_tplC3T: "页码与总数"
l_tplC3P: "<code>{{ .a }}</code> 和 <code>{{ .b }}</code> 要等演示文稿分页后才能确定，届时再填入。"
l_tplC4T: "代码保持原样"
l_tplC4P: "围栏代码块和行内代码默认不求值，所以讲 Go 模板的幻灯片也能原样展示模板。<code>include</code> 可引入另一个文件。"

l_kindsEyebrow: "第二项扩展"
l_kindsTitle: "幻灯片自己说明它<i>是</i>什么。"
l_kindsLead: "<code>kind: section</code> 指定一组预设的局部指令：页眉、页脚、页码、class、背景。<code>kind:</code> 作用于当前及之后的幻灯片，<code>_kind:</code> 只作用于一张。直接写在幻灯片上的指令依然优先。"
l_kindsC1T: "内置类型"
l_kindsC1P: "<code>title</code>、<code>section</code>、<code>content</code> 和 <code>blank</code>，每个都可重新定义。"
l_kindsC2T: "定义一次，处处共享"
l_kindsC2P: "写在 front matter 的 <code>kinds:</code> 中，或写进一个 kinds YAML 文件，供团队的所有演示文稿引用。"
l_kindsC3T: "互不渗透"
l_kindsC3P: "切换类型会清除上一个类型的设置，class 或页脚不会一路跟到下一节。"

l_pgEyebrow: "试一试"
l_pgTitle: "在<i>浏览器</i>里做演示文稿。"
l_pgLead: "<a href=\"/playground/\">在线体验</a>就是编译成 WebAssembly 的 go-slides 本身：左边写，右边的幻灯片随之更新。无需安装，也不会向服务器发送任何内容。"
l_pgNote: "在线体验的界面会跟随页面的语言。"
l_pgFailed: "在线体验加载失败。"
l_pgStarting: "正在启动…"
l_pgReady: "go-slides 已就绪。"
l_pgC1T: "实时"
l_pgC1P: "边输入边在 worker 中渲染，预览随编辑器滚动，缩略地图和一列幻灯片缩略图同步跟随，放映模式带过渡动画。点击 Present 会在第二个窗口打开演讲者视图，附带备注和计时器。"
l_pgC2T: "内置帮助"
l_pgC2P: "指令、类型和模板函数的补全与说明；问题标注在对应行上；示例演示文稿，涵盖数学公式、图片和背景（把图片文件拖进编辑器即可）；文档链接。文件面板管理整个项目：你的主题、类型、数据文件以及拖入的媒体，目录结构与 <code>slides</code> 命令生成的一致。Format 选项卡替你写 Markdown，可撤销：粗体、斜体、下划线、列表、从网格生成表格、幻灯片文字对齐和链接。每个面板都可调整大小。"
l_pgC3T: "分享、保存、留存"
l_pgC3P: "链接本身就携带演示文稿，压缩在 <code>#</code> 之后。可保存为 HTML、矢量 PDF，或可编辑的 PowerPoint、OpenDocument 演示文稿，全部在浏览器中生成；也可将整个项目下载为 <code>.zip</code>。草稿在刷新后依然保留，只存在你的浏览器里。"
l_pgOpen: "打开在线体验 →"
l_pgGallery: "浏览示例库 →"

l_outEyebrow: "功能一览"
l_outTitle: "HTML 优先，其余输出<i>无需</i>驱动浏览器。"
l_outLead: "marp-cli 靠驱动无头 Chrome 来渲染图片和 PDF，这里则由本组织自己的 Go 库完成。图片和 PDF 始于 v0.1.0；PPTX、数学公式和代码高亮始于 v0.2.0；ODP、自适应标题和 HCL 始于 v0.3.0；矢量 PDF（文字可选中）和 emoji 始于 v0.4.0；v0.5.0 起 PPTX 和 ODP 可编辑，而 marp-cli 的 PPTX 只是图片；v0.6.0 加入 watch、serve、过渡动画和 marp-cli 的选项，v0.7.0 加入演讲者视图。详见<a href=\"https://go-slides.github.io/docs/\">文档</a>。"
