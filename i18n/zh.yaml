# 落地页的简体中文（zh-Hans）文案，键与 i18n/en.yaml 相同。

l_titleTail: "纯 Go 实现、兼容 Marp 的幻灯片"
l_description: "go-slides：以纯 Go（CGO=0）读取并渲染 Marp 的 Markdown，支持 Go text/template 插值和幻灯片类型。{{ .version }}：HTML、expand、PNG/JPEG、矢量 PDF、可编辑的 PPTX 和 ODP、数学公式、代码高亮、自适应标题、emoji、HCL、watch 与 serve、过渡动画、演讲者视图和总览视图、代码行号与代码标注，全程无需无头 Chrome。"
l_playgroundTitleTail: "在线体验：在浏览器里做幻灯片"
l_playgroundDescription: "用 Go 模板和幻灯片类型编写 Marp 演示文稿，幻灯片实时跟随。这就是编译成 WebAssembly 的 go-slides 本身，在浏览器中运行，无需服务器。"
