l_headA: "Presentaciones en Markdown,"
l_headB: "renderizadas en Go puro."
l_sub: "<code>slides</code> lee el Markdown que lee <a href=\"https://marp.app\">Marp</a> — directivas, <code>---</code> entre diapositivas, fondos <code>![bg]</code>, notas del presentador, los temas integrados — y añade dos cosas que Marp no tiene: <b>plantillas de Go</b> dentro de la presentación y <b>tipos de diapositiva</b>, para que una diapositiva diga qué es en lugar de repetir su aspecto. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Leer la documentación →"
l_ctaTry: "Probarlo en el navegador →"
l_trustVersion: "<b>{{ .version }}</b> — publicada"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, <b>PDF</b> vectorial y accesible, <b>PPTX</b> y <b>ODP</b> editables, matemáticas, código con números de línea y llamadas, emoji, HCL, <b>watch</b>, <b>serve</b>, un <b>presentador</b> y una <b>vista de resumen</b> hoy"
l_trustNoChrome: "sin Chrome headless"
l_stripLead: "Una organización, <b>{{ .n }}</b> repositorios"

l_marpEyebrow: "Compatibilidad"
l_marpTitle: "Una presentación Marp es una presentación <i>go-slides</i>."
l_marpLead: "La sintaxis es la de Marpit y Marp Core, no un dialecto suyo. Una presentación escrita para Marp se lee igual aquí, y <code>slides expand</code> devuelve Markdown de Marp sin más, así que nada de lo escrito con las dos novedades siguientes queda atrapado."
l_marpC1T: "Diapositivas y directivas"
l_marpC1P: "<code>---</code> separa las diapositivas. Directivas globales, locales y puntuales (<code>_class</code>), en el front matter o en comentarios HTML, con la herencia de Marp de una diapositiva a la siguiente."
l_marpC2T: "Imágenes y fondos"
l_marpC2P: "<code>![bg]</code>, sus tamaños y filtros, fondos divididos y las palabras clave de imagen que Marp entiende."
l_marpC3T: "Alrededor de la diapositiva"
l_marpC3P: "Encabezado, pie y paginación; notas del presentador a partir de comentarios; listas fragmentadas; <code>&lt;style scoped&gt;</code> para el CSS de una sola diapositiva."
l_marpC4T: "Los temas integrados"
l_marpC4P: "<code>default</code>, <code>gaia</code> y <code>uncover</code>, que se eligen con <code>theme:</code> como en Marp."

l_tplEyebrow: "La primera novedad"
l_tplTitle: "Plantillas de Go, <i>dentro</i> de la presentación."
l_tplLead: "La presentación es un <code>text/template</code>, evaluado antes de analizar el Markdown — así una plantilla puede generar diapositivas, y una presentación puede ser datos más un diseño."
l_tplC1T: "Valores"
l_tplC1P: "<code>{{ .a }}</code> lee el front matter, y su mapa <code>data:</code> guarda todo lo demás que la presentación necesite."
l_tplC2T: "Diapositivas a partir de datos"
l_tplC2P: "Un <code>{{ .a }}</code> que emite <code>---</code> es un generador de diapositivas: una por elemento, por ponente, por versión."
l_tplC3T: "Página y total"
l_tplC3P: "<code>{{ .a }}</code> y <code>{{ .b }}</code> solo se conocen una vez dividida la presentación, y se rellenan entonces."
l_tplC4T: "El código se deja en paz"
l_tplC4P: "Los bloques delimitados y el código en línea no se evalúan por defecto, así que una diapositiva sobre plantillas de Go puede mostrar una. <code>include</code> incorpora otro archivo."

l_kindsEyebrow: "La segunda novedad"
l_kindsTitle: "Una diapositiva dice lo que <i>es</i>."
l_kindsLead: "<code>kind: section</code> (el tipo de una diapositiva) nombra un conjunto predefinido de directivas locales — encabezado, pie, paginación, clase, fondo. <code>kind:</code> se aplica a la diapositiva y a las siguientes, <code>_kind:</code> a una sola. Las directivas escritas en la diapositiva siguen teniendo prioridad."
l_kindsC1T: "Integrados"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> y <code>blank</code>, todos redefinibles."
l_kindsC2T: "Definidos una vez, compartidos"
l_kindsC2P: "En el <code>kinds:</code> del front matter, o en un archivo YAML de kinds que nombran todas las presentaciones de un equipo."
l_kindsC3T: "Nada se filtra"
l_kindsC3P: "Cambiar de kind borra lo que fijó el anterior, así que una clase o un pie no te siguen a la sección siguiente."

l_pgEyebrow: "Pruébalo"
l_pgTitle: "Una presentación en tu <i>navegador</i>."
l_pgLead: "El <a href=\"/playground/\">Playground</a> es el propio go-slides compilado a WebAssembly: escribes a la izquierda, las diapositivas te siguen a la derecha. No se instala nada y no se envía nada a ningún servidor."
l_pgNote: "La interfaz del Playground sigue el idioma de la página."
l_pgFailed: "No se pudo cargar el Playground."
l_pgStarting: "Iniciando…"
l_pgReady: "go-slides está listo."
l_pgC1T: "En vivo"
l_pgC1P: "Las diapositivas se renderizan en un worker mientras escribes, la vista previa se desplaza con el editor, un minimapa y una columna de miniaturas la acompañan, y la presentación se reproduce con sus transiciones. Presentar abre la vista de presentador, con tus notas y un temporizador, en una segunda ventana."
l_pgC2T: "Ayuda integrada"
l_pgC2P: "Autocompletado y explicaciones de directivas, tipos y funciones de plantilla; problemas marcados en su línea; presentaciones de ejemplo, matemáticas, imágenes y fondos entre ellas (suelta un archivo de imagen en el editor); enlaces a la documentación. Un panel de archivos contiene el proyecto: tus temas, tipos y archivos de datos, y los medios que sueltes, con la estructura que construye el comando <code>slides</code>. Una pestaña Formato escribe el Markdown por ti, con Deshacer: negrita, cursiva, subrayado, listas, una tabla a partir de una cuadrícula, la alineación del texto de la diapositiva y enlaces. Todos los paneles se redimensionan."
l_pgC3T: "Compartir, guardar, conservar"
l_pgC3P: "Un enlace lleva la propia presentación, comprimida en su <code>#</code>. Guárdala como HTML, PDF vectorial, o una presentación editable de PowerPoint u OpenDocument, todo generado en tu navegador, o descarga el proyecto entero como <code>.zip</code>. Tu borrador sobrevive a una recarga, solo en tu navegador."
l_pgOpen: "Abrir el Playground →"
l_pgGallery: "Ver la galería de ejemplos →"

l_outEyebrow: "Qué hace"
l_outTitle: "Primero HTML. El resto <i>sin</i> un navegador que manejar."
l_outLead: "marp-cli renderiza imágenes y PDF manejando un Chrome headless. Aquí lo hacen en su lugar las bibliotecas Go de la propia flota. Imágenes y PDF llegaron en v0.1.0, PPTX, matemáticas y resaltado en v0.2.0, ODP, títulos ajustados y HCL en v0.3.0, el PDF vectorial (con texto seleccionable) y los emoji en v0.4.0; en v0.5.0 el PPTX y el ODP pasaron a ser editables, mientras que el PPTX de marp-cli son imágenes; v0.6.0 añade watch, serve, transiciones y las opciones de marp-cli, v0.7.0 la vista de presentador — consulta la <a href=\"https://go-slides.github.io/docs/\">documentación</a>."
l_planned: "previsto"

