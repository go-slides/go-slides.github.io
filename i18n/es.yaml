# Las palabras de la landing, en español.

l_titleTail: "Presentaciones compatibles con Marp en Go puro"
l_description: "go-slides — el Markdown de Marp leído y renderizado en Go puro (CGO=0), con interpolación text/template de Go y tipos de diapositiva. {{ .version }}: HTML, expand, PNG/JPEG, PDF vectorial, PPTX y ODP editables, matemáticas, resaltado de código, títulos ajustados, emoji, HCL, watch y serve, transiciones, vistas de presentador y de resumen, números de línea y llamadas en el código, sin Chrome headless."
l_playgroundTitleTail: "Playground: presentaciones en tu navegador"
l_playgroundDescription: "Escribe una presentación Marp con plantillas de Go y tipos de diapositiva, y mira cómo las diapositivas te siguen — el propio go-slides compilado a WebAssembly, en tu navegador, sin servidor."
l_logoAlt: "logotipo de go-slides"

