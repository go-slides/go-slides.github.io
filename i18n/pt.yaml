l_headA: "Apresentações em Markdown,"
l_headB: "renderizadas em Go puro."
l_sub: "<code>slides</code> lê o Markdown que o <a href=\"https://marp.app\">Marp</a> lê — diretivas, <code>---</code> entre os slides, fundos <code>![bg]</code>, notas do apresentador, os temas embutidos — e acrescenta duas coisas que o Marp não tem: <b>templates Go</b> dentro da apresentação, e <b>kinds de slide</b>, para que um slide diga o que ele é em vez de repetir a sua aparência. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Ler a documentação →"
l_ctaTry: "Experimentar no navegador →"
l_trustVersion: "<b>{{ .version }}</b> — lançada"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, <b>PDF</b> vetorial e acessível, <b>PPTX</b> e <b>ODP</b> editáveis, matemática, código com números de linha e chamadas, emoji, HCL, <b>watch</b>, <b>serve</b>, uma visão do <b>apresentador</b> e uma <b>visão geral</b> hoje"
l_trustNoChrome: "sem Chrome headless"
l_stripLead: "Uma organização, <b>{{ .n }}</b> repositórios"

l_marpEyebrow: "Compatibilidade"
l_marpTitle: "Uma apresentação Marp é uma apresentação <i>go-slides</i>."
l_marpLead: "A sintaxe é a do Marpit e do Marp Core, não um dialeto dela. Uma apresentação escrita para o Marp é lida do mesmo jeito aqui, e <code>slides expand</code> devolve Markdown Marp simples, então nada escrito com os dois acréscimos abaixo fica preso."
l_marpC1T: "Slides e diretivas"
l_marpC1P: "<code>---</code> divide os slides. Diretivas globais, locais e pontuais (<code>_class</code>), no front matter ou em comentários HTML, com a herança do Marp de um slide para o seguinte."
l_marpC2T: "Imagens e fundos"
l_marpC2P: "<code>![bg]</code>, seus tamanhos e filtros, fundos divididos e as palavras-chave de imagem que o Marp entende."
l_marpC3T: "Ao redor do slide"
l_marpC3P: "Cabeçalho, rodapé e paginação; notas do apresentador a partir de comentários; listas fragmentadas; <code>&lt;style scoped&gt;</code> para o CSS de um único slide."
l_marpC4T: "Os temas embutidos"
l_marpC4P: "<code>default</code>, <code>gaia</code> e <code>uncover</code>, selecionados com <code>theme:</code> como no Marp."

l_tplEyebrow: "O primeiro acréscimo"
l_tplTitle: "Templates Go, <i>dentro</i> da apresentação."
l_tplLead: "A apresentação é um <code>text/template</code>, avaliado antes de o Markdown ser analisado — assim um template pode gerar slides, e uma apresentação pode ser dados mais um layout."
l_tplC1T: "Valores"
l_tplC1P: "<code>{{ .a }}</code> lê o front matter, e o mapeamento <code>data:</code> dele guarda o que mais a apresentação precisar."
l_tplC2T: "Slides a partir de dados"
l_tplC2P: "Um <code>{{ .a }}</code> que emite <code>---</code> é um gerador de slides: um slide por item, por palestrante, por release."
l_tplC3T: "Página e total"
l_tplC3P: "<code>{{ .a }}</code> e <code>{{ .b }}</code> só são conhecidos depois que a apresentação é dividida, e são preenchidos nesse momento."
l_tplC4T: "O código é deixado em paz"
l_tplC4P: "Blocos delimitados e código em linha não são avaliados por padrão, então um slide sobre templates Go pode mostrar um. <code>include</code> traz outro arquivo."

l_kindsEyebrow: "O segundo acréscimo"
l_kindsTitle: "Um slide diz o que ele <i>é</i>."
l_kindsLead: "<code>kind: section</code> nomeia um conjunto predefinido de diretivas locais — cabeçalho, rodapé, paginação, classe, fundo. <code>kind:</code> vale para o slide e os seguintes, <code>_kind:</code> para um só slide. As diretivas escritas no slide continuam prevalecendo."
l_kindsC1T: "Embutidos"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> e <code>blank</code>, cada um redefinível."
l_kindsC2T: "Definidos uma vez, compartilhados"
l_kindsC2P: "No <code>kinds:</code> do front matter, ou em um arquivo YAML de kinds que todas as apresentações de uma equipe nomeiam."
l_kindsC3T: "Nada vaza"
l_kindsC3P: "Trocar de kind limpa o que o anterior definiu, de modo que uma classe ou um rodapé não o acompanha até a próxima seção."

l_pgEyebrow: "Experimente"
l_pgTitle: "Uma apresentação no seu <i>navegador</i>."
l_pgLead: "O <a href=\"/playground/\">playground</a> é o próprio go-slides, compilado para WebAssembly: escreva à esquerda, os slides acompanham à direita. Nada é instalado e nada é enviado a um servidor."
l_pgNote: "A interface do próprio playground segue o idioma da página."
l_pgFailed: "Não foi possível carregar o playground."
l_pgStarting: "Iniciando…"
l_pgReady: "O go-slides está pronto."
l_pgC1T: "Ao vivo"
l_pgC1P: "Os slides são renderizados em um worker enquanto você digita, a pré-visualização rola junto com o editor, um minimapa e uma coluna de miniaturas dos slides a acompanham, e a apresentação de slides tem suas transições. Present abre a visão do apresentador, com as suas notas e um cronômetro, em uma segunda janela."
l_pgC2T: "Ajuda embutida"
l_pgC2P: "Autocompletar e explicações para diretivas, kinds e funções de template; problemas marcados na própria linha; apresentações de exemplo, com matemática, imagens e fundos (solte um arquivo de imagem no editor); links para a documentação. Um painel de arquivos guarda o projeto: seus temas, kinds e arquivos de dados, e a mídia que você solta, no layout que o comando <code>slides</code> constrói. Uma aba Format escreve o Markdown para você, com Undo: negrito, itálico, sublinhado, listas, uma tabela a partir de uma grade, o alinhamento do texto do slide e links. Todos os painéis são redimensionáveis."
l_pgC3T: "Compartilhe, salve, mantenha"
l_pgC3P: "Um link carrega a própria apresentação, compactada no seu <code>#</code>. Salve-a como HTML, PDF vetorial, ou uma apresentação PowerPoint ou OpenDocument editável, tudo feito no seu navegador, ou baixe o projeto inteiro como um <code>.zip</code>. O seu rascunho sobrevive a uma recarga, somente no seu navegador."
l_pgOpen: "Abrir o playground →"
l_pgGallery: "Ver a galeria de exemplos →"

l_outEyebrow: "O que ele faz"
l_outTitle: "HTML primeiro. O resto <i>sem</i> um navegador para controlar."
l_outLead: "O marp-cli renderiza imagens e PDF controlando um Chrome headless. Aqui, as próprias bibliotecas Go da frota fazem isso. Imagens e PDF chegaram na v0.1.0, PPTX, matemática e destaque na v0.2.0, ODP, títulos ajustados e HCL na v0.3.0, o PDF vetorial (com o texto selecionável) e emoji na v0.4.0; na v0.5.0 o PPTX e o ODP se tornaram editáveis, enquanto o PPTX do marp-cli são imagens; a v0.6.0 acrescenta watch, serve, transições e as opções do marp-cli, a v0.7.0 a visão do apresentador — veja a <a href=\"https://go-slides.github.io/docs/\">documentação</a>."
l_planned: "planejado"

