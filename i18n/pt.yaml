l_titleTail: "Apresentações compatíveis com Marp em Go puro"
l_description: "go-slides — o Markdown do Marp lido e renderizado em Go puro (CGO=0), com interpolação de text/template do Go e kinds de slide. {{ .version }}: HTML, expand, PNG/JPEG, PDF vetorial, PPTX e ODP editáveis, matemática, destaque de código, títulos ajustados, emoji, HCL, watch e serve, transições, visões do apresentador e geral, números de linha e chamadas de código, sem Chrome headless."
l_playgroundTitleTail: "playground: slides no seu navegador"
l_playgroundDescription: "Escreva uma apresentação Marp com templates Go e kinds de slide e veja os slides acompanharem — o próprio go-slides compilado para WebAssembly, no seu navegador, sem servidor."
