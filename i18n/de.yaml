l_headA: "Foliensätze in Markdown,"
l_headB: "gerendert in reinem Go."
l_sub: "<code>slides</code> liest das Markdown, das <a href=\"https://marp.app\">Marp</a> liest — Direktiven, <code>---</code> zwischen den Folien, <code>![bg]</code>-Hintergründe, Referentennotizen, die eingebauten Themes — und ergänzt zwei Dinge, die Marp nicht kennt: <b>Go-Templates</b> im Deck und <b>Folienarten</b>, sodass eine Folie sagt, was sie ist, statt zu wiederholen, wie sie aussieht. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Zur Dokumentation →"
l_ctaTry: "Im Browser ausprobieren →"
l_trustVersion: "<b>{{ .version }}</b> — veröffentlicht"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, barrierefreies Vektor-<b>PDF</b>, bearbeitbares <b>PPTX</b> und <b>ODP</b>, Formeln, Code mit Zeilennummern und Markierungen, Emoji, HCL, <b>watch</b>, <b>serve</b>, eine <b>Referentenansicht</b> und eine <b>Übersichtsansicht</b> schon heute"
l_trustNoChrome: "kein Headless-Chrome"
l_stripLead: "Eine Organisation, <b>{{ .n }}</b> Repositories"

l_marpEyebrow: "Kompatibilität"
l_marpTitle: "Ein Marp-Deck ist ein <i>go-slides</i>-Deck."
l_marpLead: "Die Syntax ist die von Marpit und Marp Core, kein Dialekt davon. Ein für Marp geschriebenes Deck wird hier genauso gelesen, und <code>slides expand</code> liefert reines Marp-Markdown zurück — nichts, was Sie mit den beiden Erweiterungen unten schreiben, sperrt Sie ein."
l_marpC1T: "Folien und Direktiven"
l_marpC1P: "<code>---</code> trennt Folien. Globale, lokale und punktuelle (<code>_class</code>) Direktiven, im Front Matter oder in HTML-Kommentaren, mit Marps Vererbung von einer Folie zur nächsten."
l_marpC2T: "Bilder und Hintergründe"
l_marpC2P: "<code>![bg]</code>, seine Größen und Filter, geteilte Hintergründe und die Bildschlüsselwörter, die Marp versteht."
l_marpC3T: "Rund um die Folie"
l_marpC3P: "Kopf-, Fußzeile und Seitenzahlen; Referentennotizen aus Kommentaren; schrittweise Listen; <code>&lt;style scoped&gt;</code> für das CSS einer einzelnen Folie."
l_marpC4T: "Die eingebauten Themes"
l_marpC4P: "<code>default</code>, <code>gaia</code> und <code>uncover</code>, gewählt mit <code>theme:</code> wie in Marp."

l_tplEyebrow: "Die erste Erweiterung"
l_tplTitle: "Go-Templates, <i>im</i> Deck."
l_tplLead: "Das Deck ist ein <code>text/template</code>, ausgewertet, bevor das Markdown geparst wird — ein Template kann also Folien erzeugen, und ein Deck kann aus Daten plus Layout bestehen."
l_tplC1T: "Werte"
l_tplC1P: "<code>{{ .a }}</code> liest das Front Matter, und dessen <code>data:</code>-Mapping enthält alles Weitere, was das Deck braucht."
l_tplC2T: "Folien aus Daten"
l_tplC2P: "Ein <code>{{ .a }}</code>, das <code>---</code> ausgibt, ist ein Foliengenerator: eine Folie pro Eintrag, pro Vortrag, pro Release."
l_tplC3T: "Seite und Gesamtzahl"
l_tplC3P: "<code>{{ .a }}</code> und <code>{{ .b }}</code> sind erst bekannt, wenn das Deck in Folien geteilt ist, und werden dann eingesetzt."
l_tplC4T: "Code bleibt unangetastet"
l_tplC4P: "Codeblöcke und Inline-Code werden standardmäßig nicht ausgewertet, sodass eine Folie über Go-Templates eines zeigen kann. <code>include</code> bindet eine weitere Datei ein."

l_kindsEyebrow: "Die zweite Erweiterung"
l_kindsTitle: "Eine Folie sagt, was sie <i>ist</i>."
l_kindsLead: "<code>kind: section</code> benennt ein Preset lokaler Direktiven — Kopfzeile, Fußzeile, Seitenzahl, Klasse, Hintergrund. <code>kind:</code> gilt für die Folie und die folgenden, <code>_kind:</code> für eine einzelne Folie. Direktiven auf der Folie selbst haben weiterhin Vorrang."
l_kindsC1T: "Eingebaut"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> und <code>blank</code>, jede neu definierbar."
l_kindsC2T: "Einmal definiert, geteilt"
l_kindsC2P: "Im <code>kinds:</code> des Front Matters oder in einer YAML-Datei mit Folienarten, die jedes Deck eines Teams nennt."
l_kindsC3T: "Nichts läuft über"
l_kindsC3P: "Ein Wechsel der Folienart setzt zurück, was die vorige gesetzt hat — Klasse oder Fußzeile wandern also nicht in den nächsten Abschnitt."

l_pgEyebrow: "Ausprobieren"
l_pgTitle: "Ein Deck in Ihrem <i>Browser</i>."
l_pgLead: "Der <a href=\"/playground/\">Playground</a> ist go-slides selbst, zu WebAssembly kompiliert: links schreiben, rechts folgen die Folien. Es wird nichts installiert und nichts an einen Server gesendet."
l_pgNote: "Die Oberfläche des Playgrounds folgt der Sprache der Seite."
l_pgFailed: "Der Playground konnte nicht geladen werden."
l_pgStarting: "Wird gestartet …"
l_pgReady: "go-slides ist bereit."
l_pgC1T: "Live"
l_pgC1P: "Die Folien werden beim Tippen in einem Worker gerendert, die Vorschau scrollt mit dem Editor, eine Minimap und eine Spalte mit Folienminiaturen folgen ihr, und die Präsentation läuft mit ihren Übergängen. „Present“ öffnet die Referentenansicht mit Ihren Notizen und einem Timer in einem zweiten Fenster."
l_pgC2T: "Hilfe eingebaut"
l_pgC2P: "Vervollständigung und Erklärungen für Direktiven, Folienarten und Template-Funktionen; Probleme in ihrer Zeile markiert; Beispiel-Decks, darunter Formeln, Bilder und Hintergründe (Bilddatei einfach in den Editor ziehen); Links zur Dokumentation. Ein Dateipanel hält das Projekt: Ihre Themes, Folienarten und Datendateien sowie die abgelegten Medien, im Layout, das der Befehl <code>slides</code> erwartet. Ein Tab „Format“ schreibt das Markdown für Sie, mit Undo: fett, kursiv, unterstrichen, Listen, eine Tabelle aus einem Raster, die Textausrichtung der Folie und Links. Jedes Panel ist in der Größe veränderbar."
l_pgC3T: "Teilen, sichern, behalten"
l_pgC3P: "Ein Link trägt das Deck selbst, komprimiert in seinem <code>#</code>. Speichern Sie es als HTML, Vektor-PDF oder bearbeitbares PowerPoint- oder OpenDocument-Deck, alles in Ihrem Browser erzeugt, oder laden Sie das ganze Projekt als <code>.zip</code> herunter. Ihr Entwurf übersteht ein Neuladen, nur in Ihrem Browser."
l_pgOpen: "Playground öffnen →"
l_pgGallery: "Beispielgalerie ansehen →"

l_outEyebrow: "Was es kann"
l_outTitle: "Zuerst HTML. Der Rest <i>ohne</i> Browser, den man fernsteuern müsste."
l_outLead: "marp-cli rendert Bilder und PDF, indem es einen Headless-Chrome steuert. Hier übernehmen das die Go-Bibliotheken der Flotte. Bilder und PDF kamen in v0.1.0, PPTX, Formeln und Hervorhebung in v0.2.0, ODP, einpassende Überschriften und HCL in v0.3.0, das Vektor-PDF (mit markierbarem Text) und Emoji in v0.4.0; in v0.5.0 wurden PPTX und ODP bearbeitbar, während das PPTX von marp-cli aus Bildern besteht; v0.6.0 bringt watch, serve, Übergänge und die Optionen von marp-cli, v0.7.0 die Referentenansicht — siehe die <a href=\"https://go-slides.github.io/docs/\">Dokumentation</a>."
