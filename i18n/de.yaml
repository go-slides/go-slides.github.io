l_titleTail: "Marp-kompatible Foliensätze in reinem Go"
l_description: "go-slides — Marps Markdown, gelesen und gerendert in reinem Go (CGO=0), mit Go-text/template-Interpolation und Folienarten. {{ .version }}: HTML, expand, PNG/JPEG, Vektor-PDF, bearbeitbares PPTX und ODP, Formeln, Code-Hervorhebung, einpassende Überschriften, Emoji, HCL, watch und serve, Übergänge, Referenten- und Übersichtsansicht, Zeilennummern und Code-Markierungen, ganz ohne Headless-Chrome."
l_playgroundTitleTail: "Playground: Folien im Browser"
l_playgroundDescription: "Schreiben Sie ein Marp-Deck mit Go-Templates und Folienarten und sehen Sie, wie die Folien folgen — go-slides selbst, zu WebAssembly kompiliert, in Ihrem Browser, ohne Server."
