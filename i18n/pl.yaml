l_headA: "Prezentacje w Markdown,"
l_headB: "renderowane w czystym Go."
l_sub: "<code>slides</code> czyta ten Markdown, który czyta <a href=\"https://marp.app\">Marp</a> — dyrektywy, <code>---</code> między slajdami, tła <code>![bg]</code>, notatki prelegenta, wbudowane motywy — i dodaje dwie rzeczy, których Marp nie ma: <b>szablony Go</b> wewnątrz prezentacji oraz <b>rodzaje slajdów</b>, dzięki którym slajd mówi, czym jest, zamiast powtarzać, jak wygląda. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Przeczytaj dokumentację →"
l_ctaTry: "Wypróbuj w przeglądarce →"
l_trustVersion: "<b>{{ .version }}</b> — wydana"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, wektorowy i dostępny <b>PDF</b>, edytowalne <b>PPTX</b> i <b>ODP</b>, matematyka, kod z numerami linii i objaśnieniami, emoji, HCL, <b>watch</b>, <b>serve</b>, <b>widok prelegenta</b> i <b>widok przeglądu</b> już dziś"
l_trustNoChrome: "bez headless Chrome"
l_stripLead: "Jedna organizacja, <b>{{ .n }}</b> repozytoriów"

l_marpEyebrow: "Zgodność"
l_marpTitle: "Prezentacja Marp to prezentacja <i>go-slides</i>."
l_marpLead: "Składnia jest składnią Marpit i Marp Core, a nie jej dialektem. Prezentacja napisana dla Marp jest tu czytana tak samo, a <code>slides expand</code> oddaje zwykły Markdown Marp, więc nic, co napisano z użyciem dwóch poniższych dodatków, nie jest uwięzione."
l_marpC1T: "Slajdy i dyrektywy"
l_marpC1P: "<code>---</code> dzieli slajdy. Dyrektywy globalne, lokalne i punktowe (<code>_class</code>), we front matter lub w komentarzach HTML, z dziedziczeniem Marp od slajdu do slajdu."
l_marpC2T: "Obrazy i tła"
l_marpC2P: "<code>![bg]</code>, jego rozmiary i filtry, tła dzielone oraz słowa kluczowe obrazów, które rozumie Marp."
l_marpC3T: "Wokół slajdu"
l_marpC3P: "Nagłówek, stopka i numeracja stron; notatki prelegenta z komentarzy; listy stopniowane; <code>&lt;style scoped&gt;</code> dla CSS jednego slajdu."
l_marpC4T: "Wbudowane motywy"
l_marpC4P: "<code>default</code>, <code>gaia</code> i <code>uncover</code>, wybierane przez <code>theme:</code> jak w Marp."

l_tplEyebrow: "Pierwszy dodatek"
l_tplTitle: "Szablony Go, <i>wewnątrz</i> prezentacji."
l_tplLead: "Prezentacja jest <code>text/template</code>, wyliczanym przed parsowaniem Markdownu — więc szablon może generować slajdy, a prezentacja może być danymi plus układem."
l_tplC1T: "Wartości"
l_tplC1P: "<code>{{ .a }}</code> czyta front matter, a jego mapa <code>data:</code> przechowuje wszystko inne, czego potrzebuje prezentacja."
l_tplC2T: "Slajdy z danych"
l_tplC2P: "<code>{{ .a }}</code>, które emituje <code>---</code>, jest generatorem slajdów: jeden slajd na element, na prelegenta, na wydanie."
l_tplC3T: "Strona i suma"
l_tplC3P: "<code>{{ .a }}</code> i <code>{{ .b }}</code> są znane dopiero po podziale prezentacji i wtedy są uzupełniane."
l_tplC4T: "Kod zostaje nietknięty"
l_tplC4P: "Bloki kodu i kod w tekście domyślnie nie są wyliczane, więc slajd o szablonach Go może jeden pokazać. <code>include</code> wciąga inny plik."

l_kindsEyebrow: "Drugi dodatek"
l_kindsTitle: "Slajd mówi, czym <i>jest</i>."
l_kindsLead: "<code>kind: section</code> nazywa zestaw dyrektyw lokalnych — nagłówek, stopka, numeracja, klasa, tło. <code>kind:</code> dotyczy slajdu i następnych, <code>_kind:</code> jednego slajdu. Dyrektywy zapisane na slajdzie nadal mają pierwszeństwo."
l_kindsC1T: "Wbudowane"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> i <code>blank</code>, każdy z możliwością przedefiniowania."
l_kindsC2T: "Zdefiniowane raz, wspólne"
l_kindsC2P: "We <code>kinds:</code> we front matter albo w pliku YAML z rodzajami, który wskazują wszystkie prezentacje zespołu."
l_kindsC3T: "Nic nie przecieka"
l_kindsC3P: "Zmiana rodzaju czyści to, co ustawił poprzedni, więc klasa czy stopka nie przechodzą za tobą do następnej sekcji."

l_pgEyebrow: "Wypróbuj"
l_pgTitle: "Prezentacja w <i>przeglądarce</i>."
l_pgLead: "<a href=\"/playground/\">Playground</a> to sam go-slides skompilowany do WebAssembly: piszesz po lewej, slajdy podążają po prawej. Nic się nie instaluje i nic nie jest wysyłane na serwer."
l_pgNote: "Interfejs samego playgroundu jest po angielsku."
l_pgC1T: "Na żywo"
l_pgC1P: "Slajdy renderują się w workerze w trakcie pisania, podgląd przewija się razem z edytorem, podążają za nim minimapa i kolumna miniatur slajdów, a pokaz slajdów prezentuje się z przejściami. Present otwiera w drugim oknie widok prelegenta z twoimi notatkami i stoperem."
l_pgC2T: "Wbudowana pomoc"
l_pgC2P: "Uzupełnianie i objaśnienia dyrektyw, rodzajów i funkcji szablonów; problemy zaznaczone w ich linii; przykładowe prezentacje, m.in. matematyka, obrazy i tła (upuść plik obrazu do edytora); odnośniki do dokumentacji. Panel plików przechowuje projekt: twoje motywy, rodzaje i pliki danych oraz upuszczone media, w układzie, który buduje polecenie <code>slides</code>. Karta Format pisze za ciebie Markdown, z cofaniem: pogrubienie, kursywa, podkreślenie, listy, tabela z siatki, wyrównanie tekstu slajdu i odnośniki. Każdy panel zmienia rozmiar."
l_pgC3T: "Udostępnij, zapisz, zachowaj"
l_pgC3P: "Odnośnik niesie samą prezentację, skompresowaną w swoim <code>#</code>. Zapisz ją jako HTML, wektorowy PDF albo edytowalną prezentację PowerPoint lub OpenDocument, wszystko tworzone w przeglądarce, albo pobierz cały projekt jako <code>.zip</code>. Twój szkic przetrwa przeładowanie, tylko w twojej przeglądarce."
l_pgOpen: "Otwórz playground →"
l_pgGallery: "Przeglądaj galerię przykładów →"

l_outEyebrow: "Co robi"
l_outTitle: "Najpierw HTML. Reszta <i>bez</i> przeglądarki do sterowania."
l_outLead: "marp-cli renderuje obrazy i PDF, sterując headless Chrome. Tu robią to zamiast niego własne biblioteki Go z naszej floty. Obrazy i PDF pojawiły się w v0.1.0, PPTX, matematyka i podświetlanie w v0.2.0, ODP, dopasowane nagłówki i HCL w v0.3.0, wektorowy PDF (z zaznaczalnym tekstem) i emoji w v0.4.0; w v0.5.0 PPTX i ODP stały się edytowalne, podczas gdy PPTX z marp-cli to obrazy; v0.6.0 dodaje watch, serve, przejścia i opcje marp-cli, v0.7.0 widok prelegenta — zobacz <a href=\"https://go-slides.github.io/docs/\">dokumentację</a>."
