l_description: "go-slides — Markdown Marp odczytywany i renderowany w czystym Go (CGO=0), z interpolacją text/template z Go i rodzajami slajdów. {{ .version }}: HTML, expand, PNG/JPEG, wektorowy PDF, edytowalne PPTX i ODP, matematyka, podświetlanie kodu, dopasowane nagłówki, emoji, HCL, watch i serve, przejścia, widoki prelegenta i przeglądu, numery linii i objaśnienia kodu, bez headless Chrome."
