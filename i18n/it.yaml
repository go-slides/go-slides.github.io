l_titleTail: "Presentazioni compatibili con Marp in puro Go"
l_description: "go-slides — il Markdown di Marp letto e reso in puro Go (CGO=0), con interpolazione text/template di Go e tipi di slide. {{ .version }}: HTML, expand, PNG/JPEG, PDF vettoriale, PPTX e ODP modificabili, matematica, evidenziazione del codice, titoli adattati, emoji, HCL, watch e serve, transizioni, vista del relatore e panoramica, numeri di riga e chiamate nel codice, senza Chrome headless."
l_playgroundTitleTail: "playground: le slide nel tuo browser"
l_playgroundDescription: "Scrivi una presentazione Marp con template Go e tipi di slide e guarda le slide seguirti — go-slides stesso compilato in WebAssembly, nel tuo browser, senza server."
