l_headA: "Presentazioni in Markdown,"
l_headB: "rese in puro Go."
l_sub: "<code>slides</code> legge il Markdown che legge <a href=\"https://marp.app\">Marp</a> — direttive, <code>---</code> tra le slide, sfondi <code>![bg]</code>, note del relatore, temi integrati — e aggiunge due cose che Marp non ha: i <b>template Go</b> dentro la presentazione e i <b>tipi di slide</b>, così una slide dichiara cos'è invece di ripetere che aspetto ha. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Leggi la documentazione →"
l_ctaTry: "Provalo nel browser →"
l_trustVersion: "<b>{{ .version }}</b> — rilasciata"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, <b>PDF</b> vettoriale e accessibile, <b>PPTX</b> e <b>ODP</b> modificabili, matematica, codice con numeri di riga e chiamate, emoji, HCL, <b>watch</b>, <b>serve</b>, una <b>vista del relatore</b> e una <b>panoramica</b> già oggi"
l_trustNoChrome: "senza Chrome headless"
l_stripLead: "Un'organizzazione, <b>{{ .n }}</b> repository"

l_marpEyebrow: "Compatibilità"
l_marpTitle: "Una presentazione Marp è una presentazione <i>go-slides</i>."
l_marpLead: "La sintassi è quella di Marpit e Marp Core, non un suo dialetto. Una presentazione scritta per Marp viene letta qui allo stesso modo, e <code>slides expand</code> restituisce semplice Markdown Marp, quindi nulla di ciò che è scritto con le due aggiunte qui sotto resta bloccato."
l_marpC1T: "Slide e direttive"
l_marpC1P: "<code>---</code> divide le slide. Direttive globali, locali e spot (<code>_class</code>), nel front matter o in commenti HTML, con l'ereditarietà di Marp da una slide alla successiva."
l_marpC2T: "Immagini e sfondi"
l_marpC2P: "<code>![bg]</code>, le sue dimensioni e i filtri, sfondi divisi e le parole chiave per immagini che Marp comprende."
l_marpC3T: "Attorno alla slide"
l_marpC3P: "Intestazione, piè di pagina e numerazione; note del relatore dai commenti; elenchi a frammenti; <code>&lt;style scoped&gt;</code> per il CSS di una sola slide."
l_marpC4T: "I temi integrati"
l_marpC4P: "<code>default</code>, <code>gaia</code> e <code>uncover</code>, scelti con <code>theme:</code> come in Marp."

l_tplEyebrow: "La prima aggiunta"
l_tplTitle: "Template Go, <i>dentro</i> la presentazione."
l_tplLead: "La presentazione è un <code>text/template</code>, valutato prima che il Markdown venga analizzato — così un template può generare slide, e una presentazione può essere dati più un layout."
l_tplC1T: "Valori"
l_tplC1P: "<code>{{ .a }}</code> legge il front matter, e la sua mappa <code>data:</code> contiene tutto il resto di cui la presentazione ha bisogno."
l_tplC2T: "Slide dai dati"
l_tplC2P: "Un <code>{{ .a }}</code> che emette <code>---</code> è un generatore di slide: una slide per voce, per relatore, per release."
l_tplC3T: "Pagina e totale"
l_tplC3P: "<code>{{ .a }}</code> e <code>{{ .b }}</code> sono noti solo dopo che la presentazione è stata divisa, e vengono compilati in quel momento."
l_tplC4T: "Il codice non viene toccato"
l_tplC4P: "I blocchi delimitati e il codice in linea non vengono valutati per impostazione predefinita, così una slide sui template Go può mostrarne uno. <code>include</code> inserisce un altro file."

l_kindsEyebrow: "La seconda aggiunta"
l_kindsTitle: "Una slide dichiara cosa <i>è</i>."
l_kindsLead: "<code>kind: section</code> nomina un insieme predefinito di direttive locali — intestazione, piè di pagina, numerazione, classe, sfondo. <code>kind:</code> si applica alla slide e a quelle successive, <code>_kind:</code> a una sola slide. Le direttive scritte sulla slide prevalgono comunque."
l_kindsC1T: "Integrati"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> e <code>blank</code>, tutti ridefinibili."
l_kindsC2T: "Definiti una volta, condivisi"
l_kindsC2P: "Nei <code>kinds:</code> del front matter, o in un file YAML di tipi che ogni presentazione di un team nomina."
l_kindsC3T: "Nulla trapela"
l_kindsC3P: "Cambiare tipo azzera ciò che il precedente aveva impostato, così una classe o un piè di pagina non ti segue nella sezione successiva."

l_pgEyebrow: "Provalo"
l_pgTitle: "Una presentazione nel tuo <i>browser</i>."
l_pgLead: "Il <a href=\"/playground/\">playground</a> è go-slides stesso, compilato in WebAssembly: scrivi a sinistra, le slide seguono a destra. Non si installa nulla e nulla viene inviato a un server."
l_pgNote: "L'interfaccia del playground è in inglese."
l_pgC1T: "In tempo reale"
l_pgC1P: "Le slide vengono rese in un worker mentre digiti, l'anteprima scorre con l'editor, una minimappa e una colonna di miniature delle slide la seguono, e lo slideshow presenta con le sue transizioni. Present apre la vista del relatore, con le tue note e un timer, in una seconda finestra."
l_pgC2T: "Guida integrata"
l_pgC2P: "Completamento e spiegazioni per direttive, tipi e funzioni di template; problemi segnalati sulla loro riga; presentazioni di esempio, tra cui matematica, immagini e sfondi (trascina un file immagine nell'editor); link alla documentazione. Un pannello dei file contiene il progetto: i tuoi temi, tipi e file di dati, e i media che trascini, nel layout che il comando <code>slides</code> compila. Una scheda Format scrive il Markdown al posto tuo, con Annulla: grassetto, corsivo, sottolineato, elenchi, una tabella da una griglia, l'allineamento del testo della slide e i link. Ogni riquadro si ridimensiona."
l_pgC3T: "Condividi, salva, conserva"
l_pgC3P: "Un link porta la presentazione stessa, compressa nel suo <code>#</code>. Salvala come HTML, PDF vettoriale, o presentazione PowerPoint o OpenDocument modificabile, tutto prodotto nel tuo browser, oppure scarica l'intero progetto come <code>.zip</code>. La tua bozza sopravvive a un ricaricamento, solo nel tuo browser."
l_pgOpen: "Apri il playground →"
l_pgGallery: "Sfoglia la galleria di esempi →"

l_outEyebrow: "Cosa fa"
l_outTitle: "Prima l'HTML. Il resto <i>senza</i> un browser da pilotare."
l_outLead: "marp-cli produce immagini e PDF pilotando un Chrome headless. Qui lo fanno invece le librerie Go della flotta. Immagini e PDF sono arrivati nella v0.1.0, PPTX, matematica ed evidenziazione nella v0.2.0, ODP, titoli adattati e HCL nella v0.3.0, il PDF vettoriale (con testo selezionabile) e le emoji nella v0.4.0; nella v0.5.0 PPTX e ODP sono diventati modificabili, mentre il PPTX di marp-cli è fatto di immagini; la v0.6.0 aggiunge watch, serve, transizioni e le opzioni di marp-cli, la v0.7.0 la vista del relatore — vedi la <a href=\"https://go-slides.github.io/docs/\">documentazione</a>."
l_planned: "in programma"

