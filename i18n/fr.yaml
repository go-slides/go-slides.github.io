l_titleTail: "des présentations compatibles Marp, en Go pur"
l_description: "go-slides — le Markdown de Marp lu et rendu en Go pur (CGO=0), avec l'interpolation text/template de Go et les types de diapositives. {{ .version }} : HTML, expand, PNG/JPEG, PDF vectoriel, PPTX et ODP modifiables, mathématiques, coloration du code, titres ajustés, emoji, HCL, watch et serve, transitions, vues présentateur et d'ensemble, numéros de ligne et annotations de code, sans Chrome headless."
l_playgroundTitleTail: "bac à sable : vos diapositives dans le navigateur"
l_playgroundDescription: "Écrivez une présentation Marp avec des templates Go et des types de diapositives, et regardez les diapositives suivre — go-slides lui-même compilé en WebAssembly, dans votre navigateur, sans serveur."
