l_headA: "Des présentations en Markdown,"
l_headB: "rendues en Go pur."
l_sub: "<code>slides</code> lit le Markdown que lit <a href=\"https://marp.app\">Marp</a> — directives, <code>---</code> entre les diapositives, arrière-plans <code>![bg]</code>, notes de l'orateur, thèmes intégrés — et y ajoute deux choses que Marp n'a pas : des <b>templates Go</b> dans la présentation, et des <b>types de diapositives</b>, pour qu'une diapositive dise ce qu'elle est au lieu de répéter à quoi elle ressemble. "
l_subLicence: "<code>CGO_ENABLED=0</code>, BSD-3-Clause."
l_ctaDocs: "Lire la documentation →"
l_ctaTry: "L'essayer dans le navigateur →"
l_trustVersion: "<b>{{ .version }}</b> — publiée"
l_trustFeatures: "<b>HTML</b>, <b>expand</b>, <b>PNG/JPEG</b>, <b>PDF</b> vectoriel et accessible, <b>PPTX</b> et <b>ODP</b> modifiables, mathématiques, code avec numéros de ligne et annotations, emoji, HCL, <b>watch</b>, <b>serve</b>, une vue <b>présentateur</b> et une <b>vue d'ensemble</b>, dès aujourd'hui"
l_trustNoChrome: "sans Chrome headless"
l_stripLead: "Une organisation, <b>{{ .n }}</b> dépôts"

l_marpEyebrow: "Compatibilité"
l_marpTitle: "Une présentation Marp est une présentation <i>go-slides</i>."
l_marpLead: "La syntaxe est celle de Marpit et de Marp Core, pas un dialecte. Une présentation écrite pour Marp se lit ici de la même façon, et <code>slides expand</code> restitue du Markdown Marp ordinaire : rien de ce qui est écrit avec les deux ajouts ci-dessous ne vous enferme."
l_marpC1T: "Diapositives et directives"
l_marpC1P: "<code>---</code> sépare les diapositives. Directives globales, locales et ponctuelles (<code>_class</code>), dans l'en-tête ou dans des commentaires HTML, avec l'héritage de Marp d'une diapositive à la suivante."
l_marpC2T: "Images et arrière-plans"
l_marpC2P: "<code>![bg]</code>, ses tailles et ses filtres, les arrière-plans partagés, et les mots-clés d'image que Marp comprend."
l_marpC3T: "Autour de la diapositive"
l_marpC3P: "En-tête, pied de page et pagination ; notes de l'orateur tirées des commentaires ; listes fragmentées ; <code>&lt;style scoped&gt;</code> pour le CSS d'une seule diapositive."
l_marpC4T: "Les thèmes intégrés"
l_marpC4P: "<code>default</code>, <code>gaia</code> et <code>uncover</code>, choisis avec <code>theme:</code> comme dans Marp."

l_tplEyebrow: "Premier ajout"
l_tplTitle: "Des templates Go, <i>dans</i> la présentation."
l_tplLead: "La présentation est un <code>text/template</code>, évalué avant l'analyse du Markdown — un template peut donc générer des diapositives, et une présentation peut n'être que des données et une mise en page."
l_tplC1T: "Valeurs"
l_tplC1P: "<code>{{ .a }}</code> lit l'en-tête, dont la table <code>data:</code> contient tout ce dont la présentation a besoin par ailleurs."
l_tplC2T: "Des diapositives à partir des données"
l_tplC2P: "Un <code>{{ .a }}</code> qui émet <code>---</code> est un générateur de diapositives : une par élément, par orateur, par version."
l_tplC3T: "Page et total"
l_tplC3P: "<code>{{ .a }}</code> et <code>{{ .b }}</code> ne sont connus qu'une fois la présentation découpée, et sont remplis à ce moment-là."
l_tplC4T: "Le code n'est pas touché"
l_tplC4P: "Les blocs délimités et le code en ligne ne sont pas évalués par défaut : une diapositive sur les templates Go peut en montrer un. <code>include</code> insère un autre fichier."

l_kindsEyebrow: "Second ajout"
l_kindsTitle: "Une diapositive dit ce qu'elle <i>est</i>."
l_kindsLead: "<code>kind: section</code> nomme un jeu prédéfini de directives locales — en-tête, pied de page, pagination, classe, arrière-plan. <code>kind:</code> s'applique à la diapositive et aux suivantes, <code>_kind:</code> à une seule. Les directives écrites sur la diapositive l'emportent toujours."
l_kindsC1T: "Intégrés"
l_kindsC1P: "<code>title</code>, <code>section</code>, <code>content</code> et <code>blank</code>, chacun redéfinissable."
l_kindsC2T: "Définis une fois, partagés"
l_kindsC2P: "Dans le <code>kinds:</code> de l'en-tête, ou dans un fichier YAML de types que toutes les présentations d'une équipe désignent."
l_kindsC3T: "Rien ne déborde"
l_kindsC3P: "Changer de type efface ce que le précédent avait défini : une classe ou un pied de page ne vous suit pas dans la section suivante."

l_pgEyebrow: "Essayez"
l_pgTitle: "Une présentation dans votre <i>navigateur</i>."
l_pgLead: "Le <a href=\"/playground/\">bac à sable</a>, c'est go-slides lui-même, compilé en WebAssembly : écrivez à gauche, les diapositives suivent à droite. Rien à installer, rien n'est envoyé à un serveur."
l_pgNote: "L'interface du bac à sable suit la langue de la page."
l_pgFailed: "Le bac à sable n'a pas pu se charger."
l_pgStarting: "Démarrage…"
l_pgReady: "go-slides est prêt."
l_pgC1T: "En direct"
l_pgC1P: "Les diapositives se rendent dans un worker pendant la frappe, l'aperçu défile avec l'éditeur, une minimap et une colonne de vignettes le suivent, et le diaporama se lance avec ses transitions. Présenter ouvre la vue présentateur, avec vos notes et un minuteur, dans une seconde fenêtre."
l_pgC2T: "L'aide intégrée"
l_pgC2P: "Complétion et explications pour les directives, les types et les fonctions de template ; problèmes signalés sur leur ligne ; présentations d'exemple, dont mathématiques, images et arrière-plans (déposez une image dans l'éditeur) ; liens vers la documentation. Un panneau de fichiers contient le projet : vos thèmes, types et fichiers de données, et les médias déposés, selon l'arborescence que construit la commande <code>slides</code>. Un onglet Format écrit le Markdown pour vous, avec Annuler : gras, italique, souligné, listes, un tableau à partir d'une grille, l'alignement du texte et les liens. Chaque panneau se redimensionne."
l_pgC3T: "Partager, enregistrer, conserver"
l_pgC3P: "Un lien transporte la présentation elle-même, compressée dans son <code>#</code>. Enregistrez-la en HTML, en PDF vectoriel ou en présentation PowerPoint ou OpenDocument modifiable, le tout produit dans votre navigateur, ou téléchargez le projet entier en <code>.zip</code>. Votre brouillon survit à un rechargement, dans votre navigateur seulement."
l_pgOpen: "Ouvrir le bac à sable →"
l_pgGallery: "Parcourir la galerie d'exemples →"

l_outEyebrow: "Ce qu'il fait"
l_outTitle: "D'abord le HTML. Le reste <i>sans</i> navigateur à piloter."
l_outLead: "marp-cli produit images et PDF en pilotant un Chrome headless. Ici, ce sont les bibliothèques Go de la flotte qui s'en chargent. Images et PDF sont arrivés en v0.1.0, PPTX, mathématiques et coloration en v0.2.0, ODP, titres ajustés et HCL en v0.3.0, le PDF vectoriel (texte sélectionnable) et les emoji en v0.4.0 ; en v0.5.0, PPTX et ODP sont devenus modifiables, là où le PPTX de marp-cli n'est que des images ; v0.6.0 ajoute watch, serve, les transitions et les options de marp-cli, v0.7.0 la vue présentateur — voir la <a href=\"https://go-slides.github.io/docs/\">documentation</a>."
l_planned: "prévu"

