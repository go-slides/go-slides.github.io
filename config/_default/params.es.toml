[tr.out.video]
name = "Vídeo"
what = "<code>![video](clip.mp4#t=12.5)</code> incrusta un vídeo: el navegador lo reproduce en la página HTML, nunca con sonido por sí solo y en pausa con movimiento reducido; el PDF muestra el fotograma de portada en un instante elegido con un enlace al archivo, y el PPTX y el ODP incrustan el vídeo. <a href=\"https://go-slides.github.io/docs/latest/video/\">Vídeo →</a>"

[tr.out.svg-animation]
  name = "SVG animado"
  what = "Una imagen SVG que se anima por sí misma se reproduce en la página HTML. En PPTX y ODP cada elemento animado es una forma con su propia animación (movimiento, rotación, escala, opacidad, color) que empieza con la diapositiva, o un GIF animado donde estas no pueden expresarlo; el PDF y las imágenes muestran el estado inicial. Una imagen local bloqueada sin <code>--allow-local-files</code> ahora se avisa, no se descarta. <a href=\"https://go-slides.github.io/docs/latest/svg-animation/\">SVG animado →</a>"

[tr.out.providers]
name = "Fuente matemática y emoji tras proveedores"
what = "La fuente matemática (v0.22.0) y las imágenes de emoji (v0.23.0) llegan mediante proveedores: <code>mathfont.Provider</code> y <code>emoji.Provider</code>. El comando sigue incrustando ambas y su salida es idéntica byte a byte. Un anfitrión que no las quiera compila con <code>slides_nomathfont</code> o <code>slides_noemoji</code> y no enlaza ninguno de esos datos (una compilación <code>js/wasm</code> pesa 651 KB y 2,06 MB menos en gzip) y las aporta después: hasta entonces una fórmula se muestra como su fuente TeX y un emoji como su texto. La imagen de un proveedor pesa como máximo 256 KiB y se incrusta como imagen <code>data:</code>."

[tr.out.providers-refresh]
name = "Las diapositivas se actualizan cuando llegan la fuente o las imágenes"
what = "Un anfitrión que registra la fuente matemática o las imágenes de emoji después del primer renderizado ya no conserva el texto sustituto: la caché de renderizado vuelve a renderizar solo las diapositivas que recurrieron al sustituto, una vez registrado un proveedor, y las que no tienen fórmula ni emoji siguen en caché. La salida del comando no cambia."

[tr.out.provider-font-bound]
name = "La fuente de un proveedor se acota antes de analizarla"
what = "Una fuente matemática aportada por un proveedor se reconstruye a partir de las tablas que lee el compositor y se rechaza tras unos pocos KB cuando sus contadores declarados harían que el analizador reservara demasiado (una fuente de 924 bytes que reservó 1,36 GB). <b>La fuente matemática es una entrada no fiable desde la v0.27.0, y está acotada</b>: cada glifo (CFF y CFF2 incluidos), luego el total, como máximo 128 MiB de contornos TrueType o 64 MiB de texto de trazados CFF (la STIX Two Math incluida es uno), comprobado en un solo recorrido al cargar, limitado a 5 s. La fuente incrustada se renderiza idéntica byte a byte."

[tr.out.scheduler]
name = "Un planificador y una tabla multinúcleo"
what = "El grupo de trabajadores de la exportación y el grupo de <code>-P</code> para varias presentaciones usan ambos el <code>inflight.Ordered</code> compartido de la flota: acotado, en orden, que se detiene en el primer error, con archivos idénticos byte a byte. Con <code>-P</code>, los mensajes de una presentación y la lista de las fallidas salen ahora en el orden de la línea de comandos, no en el de finalización. La versión añade una tabla multinúcleo frente a marp-cli (<code>slidesbench -cores</code>); las presentaciones de 20 diapositivas y las de 100 a PNG son más rápidas que marp-cli con cualquier número de núcleos. <b>El PDF de 100 diapositivas no lo era</b>: 3166 ms con un núcleo y 2568 ms con 16, frente a los 1513 ms de marp-cli; el PDF y el PPTX de 100 diapositivas no escalaban con los núcleos (seguimiento en <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>; corregido en la v0.26.1)."

[tr.out.shared-font-instances]
name = "Instancias de fuente compartidas"
what = "go-webengine/engine v0.48.0 comparte las instancias estáticas de una fuente variable entre las páginas en vez de reconstruirlas para cada una (<a href=\"https://github.com/go-webengine/engine/issues/443\">engine#443</a>), lo que corrige la regresión de la v0.18.0 a la v0.26.0 que se seguía en <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>. El PDF de 100 diapositivas tarda 544 ms con un núcleo (antes 3166 ms) y 256 ms con 16, y llega a un pico de 169 MiB en vez de 2182 MiB; el PPTX de 100 diapositivas tarda 692 ms con un núcleo (antes 3299 ms) y 276 ms con 16. El PDF pesa 792,4 KiB en vez de 1005,5 KiB, porque la fuente se incrusta 3 veces en vez de 102; las páginas son idénticas píxel a píxel. <b>go-slides es ahora más rápido que marp-cli en cada presentación, modo y número de núcleos medidos.</b>"

[tr.repo.slides]
blurb = "El comando `slides` y su biblioteca: el Markdown de Marp analizado y renderizado en Go, con plantillas de Go y tipos de diapositiva encima. Publicado como v0.26.1: `go install github.com/go-slides/slides/cmd/slides@latest`."
[tr.repo.docs]
blurb = "La documentación (Hugo + Hextra), que describe v0.26.1: primeros pasos, compatibilidad con Marp, plantillas, tipos y línea de comandos. <a href=\"https://github.com/go-slides/docs\">Código →</a>"
[tr.repo.vscode]
blurb = "La extensión de VS Code, como Marp for VS Code lo es de Marp: presentaciones con vista previa en el panel Markdown de VS Code gracias a go-slides compilado a WebAssembly (sin binario, funciona en vscode.dev), desplazamiento sincronizado con el editor a través de las plantillas, errores en el panel Problemas, autocompletado de directivas, tipos y funciones de plantilla, una vista de resumen y una de presentador junto al editor, exportación mediante <code>slides</code> con un PDF accesible y etiquetado. Instala el <code>.vsix</code> adjunto a la release de GitHub; la publicación en Marketplace y Open VSX está preparada, pero aún no está disponible. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"
[tr.repo.brand]
blurb = "La marca — una diapositiva en su soporte, en el índigo de la familia de documentos — y todos sus formatos: SVG, PNG, JPG, ICO, ICNS, avatar e imagen social."

[tr.repo.gitd]
blurb = "slides-gitd, el backend de git autoalojado del playground de go-slides: las credenciales de la forja se quedan en el servidor, cada usuario está aislado y funciona detrás de oauth2-proxy. Go puro."

[tr.out.html]
name = "HTML"
what = "Una página por presentación, tal como la renderiza Marp: cada diapositiva es una <code>&lt;section&gt;</code> con marco SVG que se adapta a la ventana, el CSS del tema y un visor con teclado."
[tr.out.slides-expand]
name = "slides expand"
what = "La presentación con sus plantillas evaluadas y sus tipos convertidos en directivas puntuales, reescrita como Markdown de Marp sin más — para que cualquier herramienta de Marp pueda continuar desde ahí."
[tr.out.notes-kinds-themes]
name = "notes, kinds, themes"
what = "<code>slides notes</code> imprime las notas del presentador; <code>slides kinds</code> y <code>slides themes</code> listan lo que una presentación puede nombrar."
[tr.out.slides-yaml]
name = "slides.yaml"
what = "Un archivo de configuración para una carpeta de presentaciones: tipos compartidos, temas, datos de plantilla, opciones HTML e idioma."
[tr.out.png-jpeg]
name = "PNG / JPEG"
what = "<code>--images png|jpeg</code> escribe una imagen por diapositiva (<code>deck.001.png</code>, …), <code>--image</code> la primera. Renderizado por <a href=\"https://github.com/go-webengine\">go-webengine</a>, un motor de navegador en Go — no un Chrome headless. <code>--image-scale 2</code> renderiza al doble de densidad."
[tr.out.pdf]
name = "PDF"
what = "<code>--pdf</code>, o <code>-o deck.pdf</code>: una página por diapositiva con el tamaño de la diapositiva, con un índice de diapositivas y títulos, escrito por <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. Las fuentes van incrustadas; nada toca la red. Desde v0.4.0 las páginas son vectoriales: texto seleccionable, formas nítidas, 758 KiB para 100 diapositivas frente a los 837 KiB de marp-cli (<code>--pdf-raster</code> conserva una imagen por página)."
[tr.out.pptx]
name = "PPTX"
what = "<code>--pptx</code>, o <code>-o deck.pptx</code>: con sus notas del presentador y los metadatos de la presentación, escrito por <a href=\"https://github.com/go-ooxml\">go-ooxml</a>. Desde v0.5.0 las diapositivas son <b>editables</b> — cuadros de texto con las fuentes de la propia presentación (incrustadas), formas, degradados, imágenes almacenadas una sola vez — mientras que las de marp-cli son imágenes (<code>--pptx-raster</code> las conserva). 100 diapositivas: 692 ms con un núcleo y 276 ms con 16, frente a los 7,2 s de marp-cli (v0.26.1); 760 KiB, frente a los 7,2 MiB de marp-cli."
[tr.out.math-and-highlighting]
name = "Matemáticas y resaltado"
what = "<code>$…$</code> y <code>$$…$$</code> compuestos por <a href=\"https://github.com/go-tex\">go-tex</a>, código delimitado resaltado por <a href=\"https://github.com/go-rouge\">go-rouge</a> — en la página HTML, las imágenes y el PDF."
[tr.out.odp]
name = "ODP"
what = "<code>--odp</code>, o <code>-o deck.odp</code>: una presentación OpenDocument con sus notas del presentador — editable desde v0.5.0, como el PPTX (<code>--odp-raster</code> para una imagen por diapositiva)."
[tr.out.fitting-headings]
name = "Títulos ajustados"
what = "<code># &lt;!-- fit --&gt; Title</code> ocupa el ancho de la diapositiva en una sola línea, en la página y en cada exportación."
[tr.out.emoji]
name = "Emoji"
what = "Los códigos <code>:smile:</code> y los emoji Unicode (😄 👩‍💻 🇫🇷) se convierten en imágenes <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> exactamente como las escribe Marp Core — pero incrustadas desde <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> en lugar de cargadas desde un CDN, así que no necesitan red y se dibujan en la página, las imágenes, el PDF, el PPTX y el ODP. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">Emoji →</a>"
[tr.out.hcl]
name = "HCL"
what = "HCL2 allí donde una presentación admite YAML — un front matter <code>---hcl</code>, <code>slides.hcl</code>, archivos de tipos y de datos — para expresiones y funciones: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code> reescribe el front matter como YAML. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"
[tr.out.watch-serve-preview]
name = "Watch, serve, preview"
what = "<code>--watch</code> vuelve a construir lo que cambia y recarga las páginas abiertas; <code>--server dir</code> sirve una carpeta de presentaciones — <code>deck.md</code> como página, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code> convertidos bajo demanda — en <b>127.0.0.1</b>, comprobando Host y Origin, sin salir nunca de la carpeta; <code>--preview</code> abre el navegador. Las rutas y la recarga en vivo de marp-cli, sin su puerto abierto. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Línea de comandos →</a>"
[tr.out.many-decks]
name = "Muchas presentaciones"
what = "<code>slides -I decks/ -o site/</code> convierte todas las presentaciones de una carpeta y replica el árbol; varios archivos, una carpeta o un patrón a la vez, <code>-P</code> en paralelo."
[tr.out.transitions]
name = "Transiciones"
what = "El <code>&lt;!-- transition: fade 1s --&gt;</code> de marp-cli, con sus 33 transiciones integradas, reproducidas con la View Transition API del navegador; un controlador en pantalla; <code>--template bare</code>. Las exportaciones a PDF, PPTX y ODP también las llevan, en la diapositiva siguiente, y las listas fragmentadas se convierten en animaciones con clic en el PPTX y el ODP (<code>--pdf-fragments</code> escribe una página PDF por paso). Desde v0.18.0; comprobado solo en LibreOffice, no verificado en PowerPoint."
[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
name = "Notas en PDF, metadatos, opciones de marp-cli"
what = "<code>--notes</code> escribe las notas del presentador como texto, <code>--pdf-notes</code> las coloca en las páginas del PDF, <code>--pdf-outlines</code> sus marcadores; <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; se leen el <code>.marprc</code> de marp-cli y <code>--config-file</code> (JSON, YAML)."
[tr.out.overview-view]
name = "Vista de resumen"
what = "Pulsa <code>o</code>: todas las diapositivas en una cuadrícula, las flechas eligen una, Intro o un clic va a ella — sobre la página o sobre la vista de presentador, con las URL de marp-cli y su sincronización, sin red. Las diapositivas están etiquetadas y son enfocables; el resumen cerrado es inerte. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Línea de comandos →</a>"
[tr.out.presenter-view]
name = "Vista de presentador"
what = "Pulsa <code>p</code> en la página: la diapositiva actual, el paso siguiente, tus notas (escapadas, nunca en lo que lee el lector de pantalla del público), un reloj y un temporizador, en una segunda ventana que sigue a la primera y a la que la primera sigue — las URL y la sincronización de marp-cli, mediante <code>localStorage</code>, sin servidor y sin red. Unos 10 KB por página. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Línea de comandos →</a>"
[tr.out.line-numbers-and-code-callouts]
name = "Números de línea y llamadas en el código"
what = "<code>```go {lineNumbers}</code> numera las líneas de un bloque de código (<code>{lineNumbers=10}</code> empieza en 10); un marcador en un comentario al final de una línea (<code>// &lt;1&gt;</code>) seguido de una lista numerada da un disco numerado en la línea y en su nota — en la página, las imágenes, el PDF, el PPTX y el ODP. Los números y los discos no se copian con el código. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">Matemáticas y código →</a>"
[tr.out.theme-packages]
name = "Paquetes de tema"
what = "Un tema en un solo archivo <code>.gsta.xz</code>: un archivo tar comprimido con xz, con un <code>theme.hcl</code> que lo nombra y enumera su CSS, fuentes, recursos y kinds. <code>slides theme pack|verify|install|list|remove</code> gestionan los paquetes, y <code>--theme</code> acepta uno. Los archivos son entrada no confiable: enlaces, rutas inseguras, bombas y sumas de comprobación erróneas se rechazan con errores codificados. <a href=\"https://go-slides.github.io/docs/latest/themes/\">Paquetes de tema →</a>"
[tr.out.terminal-recordings]
name = "Grabaciones de terminal"
what = "<code>![cast](demo.cast)</code> incrusta una grabación de asciinema: se reproduce en un reproductor integrado en la página HTML, sin scripts de terceros y en pausa con movimiento reducido; en el PDF, el PPTX y el ODP, la pantalla en un instante elegido (<code>#t=12.5</code>) se dibuja como texto vectorial. <a href=\"https://go-slides.github.io/docs/latest/recordings/\">Grabaciones de terminal →</a>"
[tr.out.animations-in-the-exports]
name = "Animaciones en las exportaciones"
what = "Las transiciones de Marp se convierten en transiciones de diapositiva en el PPTX y el ODP, y las listas fragmentadas en fundidos clic a clic; cada página del PDF recibe una transición <code>/Trans</code>, y <code>--pdf-fragments</code> escribe una página por paso de fragmento. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Línea de comandos →</a>"
