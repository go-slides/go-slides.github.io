# Le parole delle schede di hugo.toml, in italiano.

[tr.out.html]
  name = "HTML"
  what = "Una pagina per presentazione, come la rende Marp: ogni slide è una <code>&lt;section&gt;</code> inquadrata in un SVG che si adatta alla finestra, con il CSS del tema e un visualizzatore da tastiera."

[tr.out.slides-expand]
  name = "slides expand"
  what = "La presentazione, con i template valutati e i kinds trasformati in direttive spot, riscritta come semplice Markdown Marp — così qualsiasi strumento Marp può proseguire da lì."

[tr.out.notes-kinds-themes]
  name = "note, kinds, temi"
  what = "<code>slides notes</code> stampa le note del relatore; <code>slides kinds</code> e <code>slides themes</code> elencano ciò che una presentazione può nominare."

[tr.out.slides-yaml]
  name = "slides.yaml"
  what = "Un file di configurazione per una cartella di presentazioni: kinds e temi condivisi, dati dei template, opzioni HTML e lingua."

[tr.out.png-jpeg]
  name = "PNG / JPEG"
  what = "<code>--images png|jpeg</code> scrive un'immagine per slide (<code>deck.001.png</code>, …), <code>--image</code> la prima slide. Reso da <a href=\"https://github.com/go-webengine\">go-webengine</a>, un motore di browser in Go — non un Chrome headless. <code>--image-scale 2</code> rende a densità doppia."

[tr.out.pdf]
  name = "PDF"
  what = "<code>--pdf</code>, oppure <code>-o deck.pdf</code>: una pagina per slide alla dimensione della slide, con un indice di slide e titoli, scritto da <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. I font sono incorporati; nulla passa dalla rete. Dalla v0.4.0 le pagine sono vettoriali: testo selezionabile, forme nitide, 758 KiB per 100 slide contro gli 837 KiB di marp-cli (<code>--pdf-raster</code> mantiene un'immagine per pagina)."

[tr.out.pptx]
  name = "PPTX"
  what = "<code>--pptx</code>, oppure <code>-o deck.pptx</code>: con le note del relatore e i metadati della presentazione, scritto da <a href=\"https://github.com/go-ooxml\">go-ooxml</a>. Dalla v0.5.0 le slide sono <b>modificabili</b> — caselle di testo nei font della presentazione (incorporati), forme, gradienti, immagini memorizzate una sola volta — mentre quelle di marp-cli sono immagini (<code>--pptx-raster</code> le mantiene). 100 slide: 692 ms con un core e 276 ms con 16, contro i 7,2 s di marp-cli (v0.26.1); 760 KiB, contro i 7,2 MiB di marp-cli."

[tr.out.math-and-highlighting]
  name = "Matematica ed evidenziazione"
  what = "<code>$…$</code> e <code>$$…$$</code> composti da <a href=\"https://github.com/go-tex\">go-tex</a>, codice delimitato evidenziato da <a href=\"https://github.com/go-rouge\">go-rouge</a> — nella pagina HTML, nelle immagini e nel PDF."

[tr.out.odp]
  name = "ODP"
  what = "<code>--odp</code>, oppure <code>-o deck.odp</code>: una presentazione OpenDocument con le note del relatore — modificabile dalla v0.5.0, come il PPTX (<code>--odp-raster</code> per un'immagine per slide)."

[tr.out.fitting-headings]
  name = "Titoli adattati"
  what = "<code># &lt;!-- fit --&gt; Title</code> riempie la larghezza della slide su una riga, nella pagina e in ogni esportazione."

[tr.out.emoji]
  name = "Emoji"
  what = "Gli shortcode <code>:smile:</code> e le emoji Unicode (😄 👩‍💻 🇫🇷) diventano immagini <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> esattamente come le scrive Marp Core — ma incorporate da <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> invece che caricate da una CDN, quindi non richiedono rete e vengono disegnate nella pagina, nelle immagini, nel PDF, nel PPTX e nell'ODP. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">Emoji →</a>"

[tr.out.hcl]
  name = "HCL"
  what = "HCL2 ovunque una presentazione accetti YAML — un front matter <code>---hcl</code>, <code>slides.hcl</code>, file di kinds e di dati — per espressioni e funzioni: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code> riscrive il front matter come YAML. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"

[tr.out.watch-serve-preview]
  name = "Watch, serve, anteprima"
  what = "<code>--watch</code> ricompila ciò che cambia e ricarica le pagine aperte; <code>--server dir</code> serve una cartella di presentazioni — <code>deck.md</code> come pagina, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code> convertiti su richiesta — su <b>127.0.0.1</b>, controllando Host e Origin, senza mai uscire dalla cartella; <code>--preview</code> apre il browser. Le rotte e il ricaricamento in tempo reale di marp-cli, senza la sua porta aperta. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Riga di comando →</a>"

[tr.out.many-decks]
  name = "Più presentazioni"
  what = "<code>slides -I decks/ -o site/</code> converte ogni presentazione di una cartella e ne riproduce l'albero; più file, una cartella o un pattern in una volta, <code>-P</code> per quante alla volta."

[tr.out.transitions]
  name = "Transizioni"
  what = "Il <code>&lt;!-- transition: fade 1s --&gt;</code> di marp-cli, con le sue 33 transizioni integrate, eseguite con la View Transition API del browser; un controller a schermo; <code>--template bare</code>. Anche le esportazioni in PDF, PPTX e ODP le portano con sé, sulla slide successiva, e gli elenchi a frammenti diventano animazioni a clic nel PPTX e nell'ODP (<code>--pdf-fragments</code> scrive una pagina PDF per passo). Dalla v0.18.0; verificato solo in LibreOffice, non in PowerPoint."

[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
  name = "Note nel PDF, metadati, opzioni di marp-cli"
  what = "<code>--notes</code> scrive le note del relatore come testo, <code>--pdf-notes</code> le mette sulle pagine del PDF, <code>--pdf-outlines</code> i suoi segnalibri; <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; vengono letti il <code>.marprc</code> e il <code>--config-file</code> (JSON, YAML) di marp-cli."

[tr.out.overview-view]
  name = "Vista panoramica"
  what = "Premi <code>o</code>: tutte le slide in una griglia, le frecce ne scelgono una, Invio o un clic vi porta — sopra la pagina o sopra la vista del relatore, con gli URL di marp-cli e la sua sincronizzazione, senza rete. Le slide sono etichettate e attivabili con il focus; la panoramica chiusa è inerte. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Riga di comando →</a>"

[tr.out.presenter-view]
  name = "Vista del relatore"
  what = "Premi <code>p</code> nella pagina: la slide corrente, il passo successivo, le tue note del relatore (con escape, mai lette dallo screen reader del pubblico), un orologio e un timer, in una seconda finestra che segue la prima e viceversa — gli URL di marp-cli e la sua sincronizzazione, tramite <code>localStorage</code>, senza server né rete. Circa 10 KB per pagina. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Riga di comando →</a>"

[tr.out.line-numbers-and-code-callouts]
  name = "Numeri di riga e chiamate nel codice"
  what = "<code>```go {lineNumbers}</code> numera le righe di un blocco di codice (<code>{lineNumbers=10}</code> parte da 10); un marcatore in un commento a fine riga (<code>// &lt;1&gt;</code>) seguito da un elenco numerato mette un cerchio numerato sulla riga e sulla sua nota — nella pagina, nelle immagini, nel PDF, nel PPTX e nell'ODP. Numeri e cerchi non vengono copiati con il codice. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">Matematica e codice →</a>"

[tr.out.theme-packages]
  name = "Pacchetti di tema"
  what = "Un tema in un solo file <code>.gsta.xz</code>: un archivio tar compresso con xz, con un <code>theme.hcl</code> che lo nomina e ne elenca CSS, font, risorse e kinds. <code>slides theme pack|verify|install|list|remove</code> gestiscono i pacchetti, e <code>--theme</code> ne accetta uno. Gli archivi sono input non attendibile: link, percorsi non sicuri, bombe e checksum errati vengono rifiutati con errori codificati. <a href=\"https://go-slides.github.io/docs/latest/themes/\">Pacchetti di tema →</a>"

[tr.out.terminal-recordings]
  name = "Registrazioni del terminale"
  what = "<code>![cast](demo.cast)</code> incorpora una registrazione asciinema: viene riprodotta in un lettore integrato nella pagina HTML, senza script di terze parti e in pausa se si chiede di ridurre il movimento; nel PDF, nel PPTX e nell'ODP lo schermo a un istante scelto (<code>#t=12.5</code>) è disegnato come testo vettoriale. <a href=\"https://go-slides.github.io/docs/latest/recordings/\">Registrazioni del terminale →</a>"

[tr.out.animations-in-the-exports]
  name = "Animazioni nelle esportazioni"
  what = "Le transizioni di Marp diventano transizioni di slide nel PPTX e nell'ODP, e gli elenchi a frammenti diventano dissolvenze a ogni clic; ogni pagina del PDF riceve una transizione <code>/Trans</code>, e <code>--pdf-fragments</code> scrive una pagina per ogni passo di frammento. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Riga di comando →</a>"

[tr.out.video]
  name = "Video"
  what = "<code>![video](clip.mp4#t=12.5)</code> incorpora un video: il browser lo riproduce nella pagina HTML, mai con l'audio da solo e in pausa se si chiede di ridurre il movimento; il PDF mostra il fotogramma di anteprima a un istante scelto con un link al file, e il PPTX e l'ODP incorporano il video. <a href=\"https://go-slides.github.io/docs/latest/video/\">Video →</a>"

[tr.out.svg-animation]
  name = "SVG animato"
  what = "Un'immagine SVG che si anima da sola viene riprodotta nella pagina HTML. Nel PPTX e nell'ODP ogni elemento animato è una forma con la propria animazione (movimento, rotazione, scala, opacità, colore) che parte con la diapositiva, o una GIF animata dove queste non possono esprimerla; il PDF e le immagini mostrano lo stato iniziale. Un'immagine locale bloccata senza <code>--allow-local-files</code> ora viene segnalata, non scartata. <a href=\"https://go-slides.github.io/docs/latest/svg-animation/\">SVG animato →</a>"

[tr.out.providers]
  name = "Font matematico ed emoji dietro provider"
  what = "Il font matematico (v0.22.0) e le immagini delle emoji (v0.23.0) arrivano tramite provider: <code>mathfont.Provider</code> e <code>emoji.Provider</code>. Il comando incorpora ancora entrambi e il suo output è identico byte per byte. Un host che non li vuole compila con <code>slides_nomathfont</code> o <code>slides_noemoji</code> e non collega nessuno di questi dati (una build <code>js/wasm</code> è più piccola di 651 KB e di 2,06 MB in gzip) e li fornisce più tardi: fino ad allora una formula appare come il suo sorgente TeX e un'emoji come il suo testo. L'immagine di un provider è al massimo di 256 KiB ed è incorporata come immagine <code>data:</code>."

[tr.out.providers-refresh]
  name = "Le slide si aggiornano quando arrivano il font o le immagini"
  what = "Un host che registra il font matematico o le immagini delle emoji dopo il primo rendering non conserva più il testo di ripiego: la cache di rendering rielabora solo le slide che erano ricadute sul ripiego, una volta registrato un provider, mentre quelle senza formule né emoji restano in cache. L'output del comando non cambia."

[tr.out.provider-font-bound]
  name = "Il font di un provider è limitato prima di essere analizzato"
  what = "Un font matematico fornito da un provider viene ricostruito dalle tabelle che legge il compositore e rifiutato dopo pochi KB quando i suoi contatori dichiarati farebbero allocare troppo al parser (un font di 924 byte che ha allocato 1,36 GB). <b>Il font matematico è un input non attendibile dalla v0.27.0, ed è limitato</b>: ogni glifo (CFF e CFF2 inclusi), poi il totale, al massimo 128 MiB di contorni TrueType o 64 MiB di testo di tracciati CFF (lo STIX Two Math fornito è tra questi) o 1.350.000 operatori di charstring in totale (lo STIX Two Math ne ha 166.885), verificato in una sola scansione al caricamento che conta operatori, non tempo (dalla v0.28.0). Il font incorporato viene reso identico byte per byte."

[tr.out.scheduler]
  name = "Uno scheduler e una tabella multicore"
  what = "Il pool di worker dell'esportazione e il pool <code>-P</code> per più presentazioni girano entrambi sull'<code>inflight.Ordered</code> condiviso della flotta: limitato, in ordine, con arresto al primo errore, con file identici byte per byte. Con <code>-P</code>, i messaggi di una presentazione e l'elenco di quelle fallite escono ora nell'ordine della riga di comando, non in quello di completamento. La versione aggiunge una tabella multicore rispetto a marp-cli (<code>slidesbench -cores</code>); le presentazioni da 20 slide e quelle da 100 in PNG sono più veloci di marp-cli con qualsiasi numero di core. <b>Il PDF da 100 slide non lo era</b>: 3166 ms con un core e 2568 ms con 16, contro i 1513 ms di marp-cli; il PDF e il PPTX da 100 slide non scalavano con i core (seguito in <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>; corretto nella v0.26.1)."

[tr.out.shared-font-instances]
  name = "Istanze di font condivise"
  what = "go-webengine/engine v0.48.0 condivide le istanze statiche di un font variabile tra le pagine invece di ricostruirle per ognuna (<a href=\"https://github.com/go-webengine/engine/issues/443\">engine#443</a>), il che corregge la regressione dalla v0.18.0 alla v0.26.0 tracciata in <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>. Il PDF da 100 slide richiede 544 ms con un core (prima 3166 ms) e 256 ms con 16, e arriva a un picco di 169 MiB invece di 2182 MiB; il PPTX da 100 slide richiede 692 ms con un core (prima 3299 ms) e 276 ms con 16. Il PDF pesa 792,4 KiB invece di 1005,5 KiB, perché il font è incorporato 3 volte invece di 102; le pagine sono identiche al pixel. <b>go-slides è ora più veloce di marp-cli per ogni presentazione, modalità e numero di core misurati.</b>"

[tr.repo.slides]
  blurb = "Il comando `slides` e la sua libreria: il Markdown di Marp analizzato e reso in Go, con in più template Go e slide kinds. Rilasciata come v0.26.1: `go install github.com/go-slides/slides/cmd/slides@latest`."

[tr.repo.docs]
  blurb = "La documentazione (Hugo + Hextra), che descrive la v0.26.1: per iniziare, compatibilità con Marp, template, kinds e riga di comando. <a href=\"https://github.com/go-slides/docs\">Sorgente →</a>"

[tr.repo.vscode]
  blurb = "L'estensione per VS Code, come Marp for VS Code lo è per Marp: presentazioni mostrate nell'anteprima Markdown di VS Code da go-slides compilato in WebAssembly (nessun binario, funziona su vscode.dev), scorrimento sincronizzato con l'editor anche attraverso i template, errori nel pannello Problemi, completamento di direttive, kinds e funzioni di template, una panoramica e una vista del relatore accanto all'editor, esportazione tramite <code>slides</code>, con un PDF accessibile e con tag. Installa il <code>.vsix</code> allegato alla release su GitHub; la pubblicazione sul Marketplace e su Open VSX è preparata, ma non è ancora disponibile. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"

[tr.repo.brand]
  blurb = "Il marchio — una slide sul suo supporto, nell'indaco della famiglia dei documenti — e ogni suo formato: SVG, PNG, JPG, ICO, ICNS, avatar e immagine social."

[tr.repo.gitd]
  blurb = "slides-gitd, il backend git self-hosted del playground di go-slides: le credenziali della forge restano sul server, ogni utente è isolato e gira dietro oauth2-proxy. Go puro."

