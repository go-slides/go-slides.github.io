# 카드의 한국어 문구: hugo.toml의 params.outputs, params.repos, params.hero.

[tr.out.html]
  name = "HTML"
  what = "덱마다 한 페이지를 Marp와 같은 방식으로 렌더링합니다. 각 슬라이드는 창 크기에 맞춰 늘어나는 SVG 프레임 안의 <code>&lt;section&gt;</code>이며, 테마 CSS와 키보드 뷰어가 함께 들어갑니다."

[tr.out.slides-expand]
  name = "slides expand"
  what = "템플릿을 평가하고 종류를 스폿 디렉티브로 바꾼 덱을 평범한 Marp Markdown으로 다시 써 줍니다. 그다음은 어떤 Marp 도구로든 이어 갈 수 있습니다."

[tr.out.notes-kinds-themes]
  name = "notes, kinds, themes"
  what = "<code>slides notes</code>는 발표자 노트를 출력하고, <code>slides kinds</code>와 <code>slides themes</code>는 덱이 지정할 수 있는 항목을 나열합니다."

[tr.out.slides-yaml]
  name = "slides.yaml"
  what = "덱 폴더를 위한 설정 파일: 공유 종류, 테마, 템플릿 데이터, HTML 옵션, 언어."

[tr.out.png-jpeg]
  name = "PNG / JPEG"
  what = "<code>--images png|jpeg</code>는 슬라이드마다 이미지를 하나씩(<code>deck.001.png</code>, …), <code>--image</code>는 첫 슬라이드를 씁니다. headless Chrome이 아니라 Go로 만든 브라우저 엔진 <a href=\"https://github.com/go-webengine\">go-webengine</a>이 렌더링합니다. <code>--image-scale 2</code>는 두 배 밀도로 렌더링합니다."

[tr.out.pdf]
  name = "PDF"
  what = "<code>--pdf</code> 또는 <code>-o deck.pdf</code>: 슬라이드 크기 그대로 슬라이드마다 한 페이지, 슬라이드와 제목의 개요까지 <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>이 씁니다. 글꼴은 임베드되며 네트워크는 전혀 쓰지 않습니다. v0.4.0부터 페이지는 벡터입니다: 선택 가능한 텍스트, 선명한 도형, 슬라이드 100장에 758 KiB로 marp-cli의 837 KiB보다 작습니다(<code>--pdf-raster</code>는 페이지마다 이미지 하나를 유지)."

[tr.out.pptx]
  name = "PPTX"
  what = "<code>--pptx</code> 또는 <code>-o deck.pptx</code>: 발표자 노트와 덱 메타데이터를 포함해 <a href=\"https://github.com/go-ooxml\">go-ooxml</a>이 씁니다. v0.5.0부터 슬라이드를 <b>편집</b>할 수 있습니다 — 덱 자체 글꼴(임베드)로 된 텍스트 상자, 도형, 그라디언트, 한 번만 저장되는 그림. marp-cli의 슬라이드는 그림일 뿐입니다(<code>--pptx-raster</code>로 유지). 슬라이드 100장: 348 ms와 760 KiB, marp-cli는 7.8 s와 7.2 MiB."

[tr.out.math-and-highlighting]
  name = "수식과 하이라이트"
  what = "<code>$…$</code>와 <code>$$…$$</code>는 <a href=\"https://github.com/go-tex\">go-tex</a>가 조판하고, 펜스 코드는 <a href=\"https://github.com/go-rouge\">go-rouge</a>가 하이라이트합니다 — HTML 페이지, 이미지, PDF 모두에서."

[tr.out.odp]
  name = "ODP"
  what = "<code>--odp</code> 또는 <code>-o deck.odp</code>: 발표자 노트가 포함된 OpenDocument 프레젠테이션입니다. PPTX처럼 v0.5.0부터 편집할 수 있습니다(슬라이드마다 그림 하나를 원하면 <code>--odp-raster</code>)."

[tr.out.fitting-headings]
  name = "폭에 맞춘 제목"
  what = "<code># &lt;!-- fit --&gt; Title</code>은 페이지와 모든 내보내기에서 한 줄로 슬라이드 폭을 가득 채웁니다."

[tr.out.emoji]
  name = "이모지"
  what = "<code>:smile:</code> 숏코드와 유니코드 이모지(😄 👩‍💻 🇫🇷)는 Marp Core와 똑같이 <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> 이미지가 됩니다. 다만 CDN에서 불러오지 않고 <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a>에서 임베드하므로, 네트워크 없이 페이지, 이미지, PDF, PPTX, ODP에 그려집니다. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">이모지 →</a>"

[tr.out.hcl]
  name = "HCL"
  what = "덱이 YAML을 받는 곳이면 어디서나 HCL2를 쓸 수 있습니다 — <code>---hcl</code> 프런트 매터, <code>slides.hcl</code>, 종류와 데이터 파일 — 표현식과 함수까지: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code>는 프런트 매터를 YAML로 다시 씁니다. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"

[tr.out.watch-serve-preview]
  name = "Watch, serve, preview"
  what = "<code>--watch</code>는 바뀐 것을 다시 빌드하고 열린 페이지를 새로 고칩니다. <code>--server dir</code>는 덱 폴더를 서비스합니다 — <code>deck.md</code>는 페이지로, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code>는 요청 시 변환 — <b>127.0.0.1</b>에서, Host와 Origin을 확인하며 폴더 밖으로는 절대 나가지 않습니다. <code>--preview</code>는 브라우저를 엽니다. marp-cli의 경로와 라이브 리로드를, 열린 포트 없이. <a href=\"https://go-slides.github.io/docs/latest/cli/\">명령줄 →</a>"

[tr.out.many-decks]
  name = "여러 덱"
  what = "<code>slides -I decks/ -o site/</code>는 폴더 아래의 모든 덱을 변환하고 디렉터리 구조를 그대로 옮깁니다. 여러 파일, 폴더, 패턴을 한 번에, <code>-P</code>개씩 동시에 처리합니다."

[tr.out.transitions]
  name = "전환 효과"
  what = "marp-cli의 <code>&lt;!-- transition: fade 1s --&gt;</code>와 33가지 내장 전환을 브라우저의 View Transition API로 재생합니다. 화면 위 컨트롤러와 <code>--template bare</code>도 지원합니다."

[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
  name = "PDF 속 노트, 메타데이터, marp-cli 옵션"
  what = "<code>--notes</code>는 발표자 노트를 텍스트로 쓰고, <code>--pdf-notes</code>는 PDF 페이지에 넣으며, <code>--pdf-outlines</code>는 책갈피를 만듭니다. <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; marp-cli의 <code>.marprc</code>와 <code>--config-file</code>(JSON, YAML)도 읽습니다."

[tr.out.overview-view]
  name = "개요 보기"
  what = "<code>o</code>를 누르면 모든 슬라이드가 격자로 표시되고, 화살표로 고른 뒤 Enter나 클릭으로 이동합니다 — 페이지 위에서도 발표자 보기 위에서도, marp-cli의 URL과 동기화 방식 그대로, 네트워크 없이. 슬라이드에는 레이블이 있고 포커스를 받을 수 있으며, 닫힌 개요는 비활성(inert) 상태입니다. <a href=\"https://go-slides.github.io/docs/latest/cli/\">명령줄 →</a>"

[tr.out.presenter-view]
  name = "발표자 보기"
  what = "페이지에서 <code>p</code>를 누르면 현재 슬라이드, 다음 단계, 발표자 노트(이스케이프되며 청중의 스크린 리더에는 절대 읽히지 않음), 시계와 타이머가 두 번째 창에 열립니다. 두 창은 서로를 따라갑니다 — marp-cli의 URL과 동기화 방식으로, <code>localStorage</code>를 통해, 서버도 네트워크도 없이. 페이지당 약 10 KB. <a href=\"https://go-slides.github.io/docs/latest/cli/\">명령줄 →</a>"

[tr.out.line-numbers-and-code-callouts]
  name = "줄 번호와 코드 콜아웃"
  what = "<code>```go {lineNumbers}</code>는 코드 블록의 줄에 번호를 붙입니다(<code>{lineNumbers=10}</code>은 10부터 시작). 줄 끝 주석의 마커(<code>// &lt;1&gt;</code>) 뒤에 번호 목록을 두면 그 줄과 해당 설명에 번호 원이 표시됩니다 — 페이지, 이미지, PDF, PPTX, ODP 모두에서. 번호와 원은 코드와 함께 복사되지 않습니다. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">수식과 코드 →</a>"

[tr.repo.slides]
  blurb = "`slides` 명령과 그 라이브러리: Marp의 Markdown을 Go로 파싱하고 렌더링하며, 그 위에 Go 템플릿과 슬라이드 종류를 더했습니다. v0.9.0으로 릴리스됨: `go install github.com/go-slides/slides/cmd/slides@latest`."

[tr.repo.docs]
  blurb = "v0.9.0을 설명하는 문서(Hugo + Hextra): 시작하기, Marp 호환성, 템플릿, 종류, 명령줄. <a href=\"https://github.com/go-slides/docs\">소스 →</a>"

[tr.repo.vscode]
  blurb = "Marp for VS Code가 Marp에 해 주는 역할을 하는 VS Code 확장입니다. WebAssembly로 컴파일된 go-slides가 VS Code의 Markdown 미리 보기에 덱을 표시하며(바이너리 불필요, vscode.dev에서도 동작), 템플릿을 거쳐도 편집기와 스크롤이 맞춰지고, 오류는 Problems 패널에, 디렉티브·종류·템플릿 함수 자동 완성, 편집기 옆의 개요 보기와 발표자 보기, <code>slides</code>를 통한 내보내기를 제공합니다. GitHub 릴리스에 첨부된 <code>.vsix</code>를 설치하세요. Marketplace와 Open VSX 게시는 준비되어 있지만 아직 올라가지 않았습니다. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"

[tr.repo.brand]
  blurb = "문서 패밀리의 인디고 색으로 그린, 받침대 위의 슬라이드 마크와 그 모든 형식: SVG, PNG, JPG, ICO, ICNS, 아바타, 소셜 이미지."

