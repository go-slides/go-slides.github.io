[tr.hero]
  label = "go-slides in Bildern"

[[tr.hero.cards]]
[[tr.hero.cards]]
  alt = "Der Playground: der Markdown-Editor, die Folienleiste und die Live-Vorschau"
  caption = "Der Playground: ein Deck im Browser schreiben"
[[tr.hero.cards]]
  alt = "Eine mit Go-Templates aus Daten erzeugte Folie"
  caption = "Go-Templates: Folien aus Daten erzeugen"
[[tr.hero.cards]]
  alt = "Eine Folie, gestaltet durch ihr Kind"
  caption = "Kinds: Direktiven einmal benennen"
[[tr.hero.cards]]
  alt = "Eine Folie mit gesetzten Formeln"
  caption = "Formeln, gesetzt von go-tex, in Go"
[[tr.hero.cards]]
  alt = "Eine Folie über den Export als PDF, PPTX und ODP"
  caption = "Vektor-PDF, bearbeitbares PPTX und ODP"
[[tr.hero.cards]]
  title = "VS Code"
  text = "Dieselbe Live-Vorschau neben Ihrem Markdown, die mit ihm scrollt."
  more = "Die Erweiterung"

[tr.repo.slides]
  blurb = "Der Befehl `slides` und seine Bibliothek: Marps Markdown, geparst und gerendert in Go, mit Go-Templates und Kinds obendrauf. Veröffentlicht als v0.16.0: `go install github.com/go-slides/slides/cmd/slides@latest`."
[tr.repo.docs]
  blurb = "Die Dokumentation (Hugo + Hextra) zu v0.16.0: Einstieg, Marp-Kompatibilität, Templates, Kinds und Kommandozeile. <a href=\"https://github.com/go-slides/docs\">Quelltext →</a>"
[tr.repo.vscode]
  blurb = "Die VS-Code-Erweiterung, so wie Marp for VS Code die von Marp ist: Decks in der Markdown-Vorschau von VS Code, gerendert von zu WebAssembly kompiliertem go-slides (keine Binärdatei, läuft auf vscode.dev), synchron mit dem Editor scrollend, auch durch Templates hindurch, Fehler im Problems-Panel, Vervollständigung von Direktiven, Kinds und Template-Funktionen, eine Übersichts- und eine Referentenansicht neben dem Editor, Export über <code>slides</code> mit barrierefreiem, getaggtem PDF. Installieren Sie die am GitHub-Release angehängte <code>.vsix</code>; die Veröffentlichung im Marketplace und auf Open VSX ist vorbereitet, aber noch nicht erfolgt. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"
[tr.repo.brand]
  blurb = "Das Zeichen — eine Folie auf ihrem Ständer, im Indigo der Dokumentenfamilie — und alle seine Formate: SVG, PNG, JPG, ICO, ICNS, Avatar und Social-Image."

[tr.out.html]
  name = "HTML"
  what = "Eine Seite pro Deck, so wie Marp sie rendert: jede Folie ein SVG-gerahmtes <code>&lt;section&gt;</code>, das mit dem Fenster skaliert, das CSS des Themes und ein Tastatur-Viewer."
[tr.out.slides-expand]
  name = "slides expand"
  what = "Das Deck mit ausgewerteten Templates und in punktuelle Direktiven umgewandelten Kinds, zurückgeschrieben als reines Marp-Markdown — damit jedes Marp-Werkzeug es weiterverarbeiten kann."
[tr.out.notes-kinds-themes]
  name = "notes, kinds, themes"
  what = "<code>slides notes</code> gibt die Referentennotizen aus; <code>slides kinds</code> und <code>slides themes</code> listen auf, was ein Deck benennen kann."
[tr.out.slides-yaml]
  name = "slides.yaml"
  what = "Eine Konfigurationsdatei für einen Ordner mit Decks: gemeinsame Kinds, Themes, Template-Daten, HTML-Optionen und Sprache."
[tr.out.png-jpeg]
  name = "PNG / JPEG"
  what = "<code>--images png|jpeg</code> schreibt ein Bild pro Folie (<code>deck.001.png</code>, …), <code>--image</code> die erste Folie. Gerendert von <a href=\"https://github.com/go-webengine\">go-webengine</a>, einer Browser-Engine in Go — kein Headless-Chrome. <code>--image-scale 2</code> rendert in doppelter Dichte."
[tr.out.pdf]
  name = "PDF"
  what = "<code>--pdf</code> oder <code>-o deck.pdf</code>: eine Seite pro Folie in der Foliengröße, mit einer Gliederung aus Folien und Überschriften, geschrieben von <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. Schriften sind eingebettet; nichts greift aufs Netz zu. Seit v0.4.0 sind die Seiten Vektoren: markierbarer Text, scharfe Formen, 758 KiB für 100 Folien gegenüber 837 KiB bei marp-cli (<code>--pdf-raster</code> behält ein Bild pro Seite)."
[tr.out.pptx]
  name = "PPTX"
  what = "<code>--pptx</code> oder <code>-o deck.pptx</code>: mit Referentennotizen und den Metadaten des Decks, geschrieben von <a href=\"https://github.com/go-ooxml\">go-ooxml</a>. Seit v0.5.0 sind die Folien <b>bearbeitbar</b> — Textfelder in den eigenen (eingebetteten) Schriften des Decks, Formen, Verläufe, einmalig gespeicherte Bilder — während die von marp-cli Bilder sind (<code>--pptx-raster</code> behält sie bei). 100 Folien: 348 ms und 760 KiB, gegenüber 7,8 s und 7,2 MiB bei marp-cli."
[tr.out.math-and-highlighting]
  name = "Formeln und Hervorhebung"
  what = "<code>$…$</code> und <code>$$…$$</code>, gesetzt von <a href=\"https://github.com/go-tex\">go-tex</a>, Codeblöcke hervorgehoben von <a href=\"https://github.com/go-rouge\">go-rouge</a> — in der HTML-Seite, in Bildern und im PDF."
[tr.out.odp]
  name = "ODP"
  what = "<code>--odp</code> oder <code>-o deck.odp</code>: eine OpenDocument-Präsentation mit Referentennotizen — seit v0.5.0 bearbeitbar, wie das PPTX (<code>--odp-raster</code> für ein Bild pro Folie)."
[tr.out.fitting-headings]
  name = "Einpassende Überschriften"
  what = "<code># &lt;!-- fit --&gt; Title</code> füllt die Folienbreite in einer Zeile, auf der Seite und in jedem Export."
[tr.out.emoji]
  name = "Emoji"
  what = "<code>:smile:</code>-Shortcodes und Unicode-Emoji (😄 👩‍💻 🇫🇷) werden zu <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a>-Bildern, genau wie Marp Core sie schreibt — aber aus <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> eingebettet statt von einem CDN geladen, brauchen sie also kein Netz und erscheinen auf der Seite, in Bildern, PDF, PPTX und ODP. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">Emoji →</a>"
[tr.out.hcl]
  name = "HCL"
  what = "HCL2 überall dort, wo ein Deck YAML nimmt — ein <code>---hcl</code>-Front-Matter, <code>slides.hcl</code>, Kinds und Datendateien — für Ausdrücke und Funktionen: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code> schreibt das Front Matter als YAML zurück. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"
[tr.out.watch-serve-preview]
  name = "Watch, Serve, Vorschau"
  what = "<code>--watch</code> baut Geändertes neu und lädt die offenen Seiten neu; <code>--server dir</code> stellt einen Ordner mit Decks bereit — <code>deck.md</code> als Seite, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code> auf Anfrage konvertiert — auf <b>127.0.0.1</b>, mit Prüfung von Host und Origin, ohne je den Ordner zu verlassen; <code>--preview</code> öffnet den Browser. Die Routen und das Live-Reload von marp-cli, ohne dessen offenen Port. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Kommandozeile →</a>"
[tr.out.many-decks]
  name = "Viele Decks"
  what = "<code>slides -I decks/ -o site/</code> konvertiert jedes Deck unter einem Ordner und spiegelt den Baum; mehrere Dateien, ein Ordner oder ein Muster auf einmal, <code>-P</code> gleichzeitig."
[tr.out.transitions]
  name = "Übergänge"
  what = "Das <code>&lt;!-- transition: fade 1s --&gt;</code> von marp-cli mit seinen 33 eingebauten Übergängen, abgespielt mit der View Transition API des Browsers; ein Bedienelement auf dem Bildschirm; <code>--template bare</code>."
[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
  name = "Notizen im PDF, Metadaten, Optionen von marp-cli"
  what = "<code>--notes</code> schreibt die Referentennotizen als Text, <code>--pdf-notes</code> legt sie auf die PDF-Seiten, <code>--pdf-outlines</code> setzt dessen Lesezeichen; <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; das <code>.marprc</code> und <code>--config-file</code> (JSON, YAML) von marp-cli werden gelesen."
[tr.out.overview-view]
  name = "Übersichtsansicht"
  what = "Drücken Sie <code>o</code>: alle Folien in einem Raster, die Pfeiltasten wählen eine aus, Enter oder ein Klick springt hin — über der Seite oder über der Referentenansicht, mit den URLs und der Synchronisation von marp-cli, ohne Netz. Folien sind beschriftet und fokussierbar; die geschlossene Übersicht ist inaktiv. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Kommandozeile →</a>"
[tr.out.presenter-view]
  name = "Referentenansicht"
  what = "Drücken Sie <code>p</code> auf der Seite: die aktuelle Folie, der nächste Schritt, Ihre Referentennotizen (maskiert, nie im Vorlesetext für das Publikum), eine Uhr und ein Timer, in einem zweiten Fenster, das dem ersten folgt und dem das erste folgt — mit den URLs und der Synchronisation von marp-cli, über <code>localStorage</code>, ohne Server und ohne Netz. Rund 10 KB pro Seite. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Kommandozeile →</a>"
[tr.out.line-numbers-and-code-callouts]
  name = "Zeilennummern und Code-Markierungen"
  what = "<code>```go {lineNumbers}</code> nummeriert die Zeilen eines Codeblocks (<code>{lineNumbers=10}</code> beginnt bei 10); eine Markierung in einem Kommentar am Zeilenende (<code>// &lt;1&gt;</code>) gefolgt von einer nummerierten Liste ergibt eine nummerierte Scheibe an der Zeile und an ihrer Notiz — auf der Seite, in Bildern, PDF, PPTX und ODP. Nummern und Scheiben werden mit dem Code nicht kopiert. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">Formeln und Code →</a>"
