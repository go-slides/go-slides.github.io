# 卡片的简体中文（zh-Hans）文案，对应 hugo.toml 中的 params。

[tr.out.html]
name = "HTML"
what = "每个演示文稿一个页面，与 Marp 的渲染方式相同：每张幻灯片是一个以 SVG 为框、随窗口缩放的 <code>&lt;section&gt;</code>，附带主题 CSS 和键盘查看器。"

[tr.out.slides-expand]
name = "slides expand"
what = "对模板求值、把类型展开为单页指令后，写回为纯粹的 Marp Markdown，任何 Marp 工具都能接手。"

[tr.out.notes-kinds-themes]
name = "备注、类型、主题"
what = "<code>slides notes</code> 输出演讲者备注；<code>slides kinds</code> 和 <code>slides themes</code> 列出演示文稿可引用的名称。"

[tr.out.slides-yaml]
name = "slides.yaml"
what = "为整个文件夹的演示文稿提供配置文件：共享的类型、主题、模板数据、HTML 选项和语言。"

[tr.out.png-jpeg]
name = "PNG / JPEG"
what = "<code>--images png|jpeg</code> 为每张幻灯片输出一张图片（<code>deck.001.png</code>，…），<code>--image</code> 只输出第一张。由 Go 编写的浏览器引擎 <a href=\"https://github.com/go-webengine\">go-webengine</a> 渲染，而不是无头 Chrome。<code>--image-scale 2</code> 以两倍密度渲染。"

[tr.out.pdf]
name = "PDF"
what = "<code>--pdf</code> 或 <code>-o deck.pdf</code>：每张幻灯片一页，页面尺寸与幻灯片一致，附带幻灯片和标题的书签大纲，由 <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a> 写出。字体内嵌，不访问网络。自 v0.4.0 起页面为矢量：文字可选中、图形清晰，100 张幻灯片仅 758 KiB，而 marp-cli 为 837 KiB（<code>--pdf-raster</code> 仍可每页一张图片）。"

[tr.out.pptx]
name = "PPTX"
what = "<code>--pptx</code> 或 <code>-o deck.pptx</code>：包含演讲者备注和演示文稿元数据，由 <a href=\"https://github.com/go-ooxml\">go-ooxml</a> 写出。自 v0.5.0 起幻灯片<b>可编辑</b>：文本框使用演示文稿自带的字体（内嵌），还有形状、渐变，图片只存一份；而 marp-cli 输出的是图片（<code>--pptx-raster</code> 保留这种方式）。100 张幻灯片：348 ms、760 KiB，marp-cli 则需 7.8 s、7.2 MiB。"

[tr.out.math-and-highlighting]
name = "数学公式与代码高亮"
what = "<code>$…$</code> 和 <code>$$…$$</code> 由 <a href=\"https://github.com/go-tex\">go-tex</a> 排版，围栏代码由 <a href=\"https://github.com/go-rouge\">go-rouge</a> 高亮，HTML 页面、图片和 PDF 中均可呈现。"

[tr.out.odp]
name = "ODP"
what = "<code>--odp</code> 或 <code>-o deck.odp</code>：带演讲者备注的 OpenDocument 演示文稿；自 v0.5.0 起与 PPTX 一样可编辑（<code>--odp-raster</code> 则每张幻灯片一张图片）。"

[tr.out.fitting-headings]
name = "自适应标题"
what = "<code># &lt;!-- fit --&gt; Title</code> 让标题在一行内撑满幻灯片宽度，页面和所有导出格式中都一样。"

[tr.out.emoji]
name = "Emoji"
what = "<code>:smile:</code> 短代码和 Unicode emoji（😄 👩‍💻 🇫🇷）会变成 <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> 图片，写法与 Marp Core 完全一致，但它们内嵌自 <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a>，而非从 CDN 加载，因此无需网络，在页面、图片、PDF、PPTX 和 ODP 中都能绘制。<a href=\"https://go-slides.github.io/docs/latest/emoji/\">Emoji →</a>"

[tr.out.hcl]
name = "HCL"
what = "凡是演示文稿接受 YAML 的地方都可以用 HCL2：<code>---hcl</code> front matter、<code>slides.hcl</code>、类型文件和数据文件，从而支持表达式和函数：<code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>。<code>slides expand</code> 会把 front matter 写回为 YAML。<a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"

[tr.out.watch-serve-preview]
name = "监视、服务、预览"
what = "<code>--watch</code> 只重新构建变动的部分并刷新已打开的页面；<code>--server dir</code> 为一个文件夹的演示文稿提供服务：<code>deck.md</code> 作为页面，<code>deck.md?pdf</code>、<code>?pptx</code>、<code>?png</code>、<code>?notes</code> 按需转换；只监听 <b>127.0.0.1</b>，校验 Host 和 Origin，绝不越出该文件夹；<code>--preview</code> 打开浏览器。拥有 marp-cli 的路由和实时刷新，却不对外开放端口。<a href=\"https://go-slides.github.io/docs/latest/cli/\">命令行 →</a>"

[tr.out.many-decks]
name = "批量演示文稿"
what = "<code>slides -I decks/ -o site/</code> 转换文件夹下的所有演示文稿并保持目录结构；可一次处理多个文件、一个文件夹或一个通配模式，<code>-P</code> 个并行。"

[tr.out.transitions]
name = "过渡动画"
what = "marp-cli 的 <code>&lt;!-- transition: fade 1s --&gt;</code>，包含 33 种内置过渡，借助浏览器的 View Transition API 播放；附带屏幕控制器；<code>--template bare</code>。"

[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
name = "PDF 备注、元数据、marp-cli 选项"
what = "<code>--notes</code> 将演讲者备注输出为文本，<code>--pdf-notes</code> 把备注放到 PDF 页面上，<code>--pdf-outlines</code> 生成书签；<code>--title</code>、<code>--author</code>、<code>--keywords</code>、<code>--url</code>、<code>--og-image</code>、<code>--theme</code>；并会读取 marp-cli 的 <code>.marprc</code> 和 <code>--config-file</code>（JSON、YAML）。"

[tr.out.overview-view]
name = "总览视图"
what = "按 <code>o</code>：所有幻灯片排成网格，方向键选择，回车或点击即可跳转；可叠加在页面或演讲者视图之上，沿用 marp-cli 的 URL 和同步机制，无需网络。幻灯片带有标签且可获得焦点；总览关闭时处于 inert 状态。<a href=\"https://go-slides.github.io/docs/latest/cli/\">命令行 →</a>"

[tr.out.presenter-view]
name = "演讲者视图"
what = "在页面上按 <code>p</code>：当前幻灯片、下一步、你的演讲者备注（已转义，绝不会出现在观众屏幕阅读器读取的内容中）、时钟和计时器，显示在第二个窗口中，两个窗口相互同步。沿用 marp-cli 的 URL 和同步机制，通过 <code>localStorage</code> 实现，无需服务器和网络。每页约 10 KB。<a href=\"https://go-slides.github.io/docs/latest/cli/\">命令行 →</a>"

[tr.out.line-numbers-and-code-callouts]
name = "代码行号与代码标注"
what = "<code>```go {lineNumbers}</code> 为代码块编行号（<code>{lineNumbers=10}</code> 从 10 开始）；在行尾注释中放一个标记（<code>// &lt;1&gt;</code>），再接一个编号列表，就会在该行及其说明上显示编号圆标，页面、图片、PDF、PPTX 和 ODP 中都一样。复制代码时不会带上行号和圆标。<a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">数学公式与代码 →</a>"

[tr.repo.slides]
blurb = "`slides` 命令及其库：用 Go 解析并渲染 Marp 的 Markdown，并在其上加入 Go 模板和幻灯片类型。已发布 v0.14.0：`go install github.com/go-slides/slides/cmd/slides@latest`。"

[tr.repo.docs]
blurb = "文档（Hugo + Hextra），对应 v0.14.0：入门、Marp 兼容性、模板、类型和命令行。<a href=\"https://github.com/go-slides/docs\">源码 →</a>"

[tr.repo.vscode]
blurb = "VS Code 扩展，地位如同 Marp for VS Code 之于 Marp：由编译成 WebAssembly 的 go-slides 在 VS Code 的 Markdown 预览中预览演示文稿（无需二进制，可在 vscode.dev 上使用），经由模板也能与编辑器同步滚动，错误显示在「问题」面板中，补全指令、类型和模板函数，在编辑器旁提供总览视图和演讲者视图，并通过 <code>slides</code> 导出带标签的无障碍 PDF。请安装 GitHub 发布页附带的 <code>.vsix</code>；上架 Marketplace 和 Open VSX 的准备已经就绪，但尚未发布。<a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"

[tr.repo.brand]
blurb = "标志：一张立在支架上的幻灯片，采用文档家族的靛蓝色，并提供各种格式：SVG、PNG、JPG、ICO、ICNS、头像和社交分享图。"

