[tr.out.html]
name = "HTML"
what = "Marp と同じく、デッキごとに 1 ページを出力します。各スライドはウィンドウに合わせて拡大縮小する SVG 枠付きの <code>&lt;section&gt;</code> で、テーマの CSS とキーボード操作のビューアーが付きます。"

[tr.out.slides-expand]
name = "slides expand"
what = "テンプレートを評価し、kind をスポットディレクティブに変換したデッキを、素の Marp Markdown として書き戻します。そこから先はどの Marp ツールにも渡せます。"

[tr.out.notes-kinds-themes]
name = "ノート、kind、テーマ"
what = "<code>slides notes</code> はスピーカーノートを出力し、<code>slides kinds</code> と <code>slides themes</code> はデッキで指定できるものを一覧表示します。"

[tr.out.slides-yaml]
name = "slides.yaml"
what = "デッキを集めたフォルダー用の設定ファイル。共有の kind、テーマ、テンプレートのデータ、HTML のオプション、言語を指定できます。"

[tr.out.png-jpeg]
name = "PNG / JPEG"
what = "<code>--images png|jpeg</code> はスライドごとに 1 枚の画像（<code>deck.001.png</code>, …）を、<code>--image</code> は最初のスライドを書き出します。レンダリングはヘッドレス Chrome ではなく、Go で書かれたブラウザエンジン <a href=\"https://github.com/go-webengine\">go-webengine</a> が行います。<code>--image-scale 2</code> で 2 倍の密度で描画します。"

[tr.out.pdf]
name = "PDF"
what = "<code>--pdf</code> または <code>-o deck.pdf</code>：スライドのサイズで 1 スライド 1 ページ、スライドと見出しのアウトライン付きで、<a href=\"https://github.com/go-pdfkit\">go-pdfkit</a> が書き出します。フォントは埋め込まれ、ネットワークには一切アクセスしません。v0.4.0 からページはベクターになりました。テキストは選択でき、図形はシャープで、100 スライドで 758 KiB（marp-cli は 837 KiB）です（<code>--pdf-raster</code> で 1 ページ 1 画像のままにできます）。"

[tr.out.pptx]
name = "PPTX"
what = "<code>--pptx</code> または <code>-o deck.pptx</code>：スピーカーノートとデッキのメタデータ付きで、<a href=\"https://github.com/go-ooxml\">go-ooxml</a> が書き出します。v0.5.0 からスライドは<b>編集可能</b>です。デッキ自身のフォント（埋め込み）によるテキストボックス、図形、グラデーション、一度だけ格納される画像で構成され、画像になる marp-cli とは異なります（<code>--pptx-raster</code> で画像のままにできます）。100 スライドで 348 ms・760 KiB、marp-cli は 7.8 s・7.2 MiB です。"

[tr.out.math-and-highlighting]
name = "数式とハイライト"
what = "<code>$…$</code> と <code>$$…$$</code> は <a href=\"https://github.com/go-tex\">go-tex</a> が組版し、コードブロックは <a href=\"https://github.com/go-rouge\">go-rouge</a> がハイライトします。HTML ページ、画像、PDF のいずれでも有効です。"

[tr.out.odp]
name = "ODP"
what = "<code>--odp</code> または <code>-o deck.odp</code>：スピーカーノート付きの OpenDocument プレゼンテーション。PPTX と同じく v0.5.0 から編集可能です（<code>--odp-raster</code> で 1 スライド 1 画像）。"

[tr.out.fitting-headings]
name = "見出しの自動フィット"
what = "<code># &lt;!-- fit --&gt; Title</code> は、ページでもすべてのエクスポートでも、スライドの幅いっぱいに 1 行で表示されます。"

[tr.out.emoji]
name = "絵文字"
what = "<code>:smile:</code> のショートコードと Unicode 絵文字（😄 👩‍💻 🇫🇷）は、Marp Core とまったく同じ形の <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> 画像になります。ただし CDN から読み込むのではなく <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> から埋め込むので、ネットワーク不要で、ページ、画像、PDF、PPTX、ODP に描画されます。<a href=\"https://go-slides.github.io/docs/latest/emoji/\">絵文字 →</a>"

[tr.out.hcl]
name = "HCL"
what = "デッキが YAML を受け付ける場所ならどこでも HCL2 が使えます。<code>---hcl</code> のフロントマター、<code>slides.hcl</code>、kind やデータのファイルで、式や関数を書けます：<code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>。<code>slides expand</code> はフロントマターを YAML として書き戻します。<a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"

[tr.out.watch-serve-preview]
name = "Watch、serve、プレビュー"
what = "<code>--watch</code> は変更された部分を再ビルドし、開いているページを再読み込みします。<code>--server dir</code> はデッキのフォルダーを配信します。<code>deck.md</code> はページとして、<code>deck.md?pdf</code>、<code>?pptx</code>、<code>?png</code>、<code>?notes</code> はリクエスト時に変換され、<b>127.0.0.1</b> 上で Host と Origin を検査し、フォルダーの外には出ません。<code>--preview</code> はブラウザを開きます。marp-cli のルートとライブリロードを、ポートを外部に開かずに実現します。<a href=\"https://go-slides.github.io/docs/latest/cli/\">コマンドライン →</a>"

[tr.out.many-decks]
name = "複数のデッキ"
what = "<code>slides -I decks/ -o site/</code> はフォルダー以下のすべてのデッキを変換し、ディレクトリ構成をそのまま再現します。複数のファイル、フォルダー、パターンを一度に指定でき、<code>-P</code> で並列数を指定できます。"

[tr.out.transitions]
name = "トランジション"
what = "marp-cli の <code>&lt;!-- transition: fade 1s --&gt;</code> と 33 種類の組み込みトランジションを、ブラウザの View Transition API で再生します。画面上のコントローラーと <code>--template bare</code> にも対応しています。"

[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
name = "PDF のノート、メタデータ、marp-cli のオプション"
what = "<code>--notes</code> はスピーカーノートをテキストで書き出し、<code>--pdf-notes</code> は PDF のページに載せ、<code>--pdf-outlines</code> はしおりを付けます。<code>--title</code>、<code>--author</code>、<code>--keywords</code>、<code>--url</code>、<code>--og-image</code>、<code>--theme</code> に対応し、marp-cli の <code>.marprc</code> と <code>--config-file</code>（JSON、YAML）も読み込みます。"

[tr.out.overview-view]
name = "一覧ビュー"
what = "<code>o</code> を押すと、すべてのスライドがグリッドで表示されます。矢印キーで選び、Enter かクリックで移動します。ページ上でも発表者ビュー上でも使え、marp-cli の URL と同期方式に従い、ネットワークは不要です。スライドにはラベルが付きフォーカス可能で、閉じた一覧ビューは inert になります。<a href=\"https://go-slides.github.io/docs/latest/cli/\">コマンドライン →</a>"

[tr.out.presenter-view]
name = "発表者ビュー"
what = "ページで <code>p</code> を押すと、現在のスライド、次のステップ、スピーカーノート（エスケープ済みで、聴衆側のスクリーンリーダーには読まれません）、時計とタイマーが別ウィンドウに表示され、2 つのウィンドウが互いに追従します。marp-cli の URL と同期方式を <code>localStorage</code> で実現し、サーバーもネットワークも不要です。1 ページあたり約 10 KB です。<a href=\"https://go-slides.github.io/docs/latest/cli/\">コマンドライン →</a>"

[tr.out.line-numbers-and-code-callouts]
name = "行番号とコードの注釈"
what = "<code>```go {lineNumbers}</code> はコードブロックに行番号を付けます（<code>{lineNumbers=10}</code> で 10 から開始）。行末のコメントにマーカー（<code>// &lt;1&gt;</code>）を書き、番号付きリストを続けると、その行と対応する注釈に番号付きの丸印が付きます。ページ、画像、PDF、PPTX、ODP で有効で、番号や丸印はコードと一緒にコピーされません。<a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">数式とコード →</a>"

[tr.repo.slides]
blurb = "`slides` コマンドとそのライブラリ。Marp の Markdown を Go で解析・レンダリングし、その上に Go テンプレートとkind（スライドの種類）を加えます。v0.15.0 としてリリース済み：`go install github.com/go-slides/slides/cmd/slides@latest`。"

[tr.repo.docs]
blurb = "v0.15.0 を解説するドキュメント（Hugo + Hextra）。入門、Marp との互換性、テンプレート、kind、コマンドラインを扱います。<a href=\"https://github.com/go-slides/docs\">ソース →</a>"

[tr.repo.vscode]
blurb = "Marp for VS Code が Marp にとってそうであるように、go-slides のための VS Code 拡張機能です。WebAssembly にコンパイルした go-slides が VS Code の Markdown プレビューでデッキを表示し（バイナリ不要、vscode.dev でも動作）、テンプレートを経由してもエディターと同期スクロールし、エラーは「問題」パネルに表示され、ディレクティブ・kind・テンプレート関数を補完し、エディターの横に一覧ビューと発表者ビューを開き、<code>slides</code> でエクスポートし、PDF はタグ付きでアクセシブルです。GitHub のリリースに添付された <code>.vsix</code> をインストールしてください。Marketplace と Open VSX での公開は準備中で、まだ公開されていません。<a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"

[tr.repo.brand]
blurb = "ロゴマーク（ドキュメントファミリーのインディゴで描いた、スタンドに載ったスライド）と、その各種フォーマット：SVG、PNG、JPG、ICO、ICNS、アバター、ソーシャル画像。"

