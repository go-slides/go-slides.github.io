# Слова карток hugo.toml українською.

[tr.out.html]
  name = "HTML"
  what = "Одна сторінка на презентацію, як її рендерить Marp: кожен слайд — <code>&lt;section&gt;</code> в SVG-рамці, що масштабується під вікно, з CSS теми та клавіатурним переглядачем."

[tr.out.slides-expand]
  name = "slides expand"
  what = "Презентація з обчисленими шаблонами та kinds, перетвореними на spot-директиви, переписана як звичайний Markdown Marp — будь-який інструмент Marp може взятися за неї далі."

[tr.out.notes-kinds-themes]
  name = "notes, kinds, themes"
  what = "<code>slides notes</code> виводить нотатки доповідача; <code>slides kinds</code> і <code>slides themes</code> перелічують те, що може назвати презентація."

[tr.out.slides-yaml]
  name = "slides.yaml"
  what = "Файл конфігурації для теки презентацій: спільні kinds, теми, дані шаблонів, параметри HTML і мова."

[tr.out.png-jpeg]
  name = "PNG / JPEG"
  what = "<code>--images png|jpeg</code> записує по одному зображенню на слайд (<code>deck.001.png</code>, …), <code>--image</code> — перший слайд. Рендерить <a href=\"https://github.com/go-webengine\">go-webengine</a>, рушій браузера на Go — не headless Chrome. <code>--image-scale 2</code> рендерить із подвійною щільністю."

[tr.out.pdf]
  name = "PDF"
  what = "<code>--pdf</code> або <code>-o deck.pdf</code>: одна сторінка на слайд розміру слайда, зі змістом зі слайдів і заголовків, пише <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. Шрифти вбудовані; мережа не задіяна. Починаючи з v0.4.0 сторінки векторні: текст, який можна виділяти, чіткі фігури, 758 КіБ на 100 слайдів проти 837 КіБ у marp-cli (<code>--pdf-raster</code> зберігає одне зображення на сторінку)."

[tr.out.pptx]
  name = "PPTX"
  what = "<code>--pptx</code> або <code>-o deck.pptx</code>: з нотатками доповідача та метаданими презентації, пише <a href=\"https://github.com/go-ooxml\">go-ooxml</a>. Починаючи з v0.5.0 слайди <b>редаговані</b> — текстові блоки власними шрифтами презентації (вбудованими), фігури, градієнти, зображення, що зберігаються один раз, — тоді як у marp-cli це картинки (<code>--pptx-raster</code> їх зберігає). 100 слайдів: 692 мс на одному ядрі та 276 мс на 16 проти 7,2 с у marp-cli (v0.26.1); 760 КіБ проти 7,2 МіБ у marp-cli."

[tr.out.math-and-highlighting]
  name = "Математика й підсвічування"
  what = "<code>$…$</code> та <code>$$…$$</code> верстає <a href=\"https://github.com/go-tex\">go-tex</a>, блоки коду підсвічує <a href=\"https://github.com/go-rouge\">go-rouge</a> — в HTML-сторінці, зображеннях і PDF."

[tr.out.odp]
  name = "ODP"
  what = "<code>--odp</code> або <code>-o deck.odp</code>: презентація OpenDocument з нотатками доповідача — редагована починаючи з v0.5.0, як і PPTX (<code>--odp-raster</code> для однієї картинки на слайд)."

[tr.out.fitting-headings]
  name = "Заголовки за шириною"
  what = "<code># &lt;!-- fit --&gt; Title</code> заповнює ширину слайда в один рядок, на сторінці й у кожному експорті."

[tr.out.emoji]
  name = "Емодзі"
  what = "Шорткоди <code>:smile:</code> та емодзі Unicode (😄 👩‍💻 🇫🇷) стають зображеннями <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> точно так, як їх пише Marp Core, — але вбудованими з <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> замість завантаження з CDN, тож мережа не потрібна, і вони малюються на сторінці, у зображеннях, PDF, PPTX та ODP. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">Емодзі →</a>"

[tr.out.hcl]
  name = "HCL"
  what = "HCL2 скрізь, де презентація приймає YAML, — front matter <code>---hcl</code>, <code>slides.hcl</code>, файли kinds і даних — заради виразів і функцій: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code> переписує front matter назад як YAML. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"

[tr.out.watch-serve-preview]
  name = "Watch, serve, попередній перегляд"
  what = "<code>--watch</code> збирає знову те, що змінилося, і перезавантажує відкриті сторінки; <code>--server dir</code> обслуговує теку презентацій — <code>deck.md</code> як сторінку, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code>, що перетворюються на запит, — на <b>127.0.0.1</b>, перевіряючи Host і Origin та ніколи не виходячи за межі теки; <code>--preview</code> відкриває браузер. Маршрути й живе перезавантаження marp-cli, без його відкритого порту. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Командний рядок →</a>"

[tr.out.many-decks]
  name = "Багато презентацій"
  what = "<code>slides -I decks/ -o site/</code> перетворює кожну презентацію під текою й віддзеркалює дерево; кілька файлів, тека чи шаблон одразу, <code>-P</code> одночасно."

[tr.out.transitions]
  name = "Переходи"
  what = "<code>&lt;!-- transition: fade 1s --&gt;</code> з marp-cli, з його 33 вбудованими переходами, які відтворюються через View Transition API браузера; екранний контролер; <code>--template bare</code>. Експорти в PDF, PPTX і ODP також несуть їх, на наступному слайді, а списки з фрагментами стають у PPTX і ODP побудовами по клацанню (<code>--pdf-fragments</code> записує одну сторінку PDF на крок). Починаючи з v0.18.0; перевірено лише в LibreOffice, не в PowerPoint."

[tr.out.notes-in-pdf-metadata-marp-cli-s-options]
  name = "Нотатки в PDF, метадані, параметри marp-cli"
  what = "<code>--notes</code> записує нотатки доповідача текстом, <code>--pdf-notes</code> кладе їх на сторінки PDF, <code>--pdf-outlines</code> — його закладки; <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; читаються <code>.marprc</code> та <code>--config-file</code> (JSON, YAML) з marp-cli."

[tr.out.overview-view]
  name = "Вигляд огляду"
  what = "Натисніть <code>o</code>: усі слайди в сітці, стрілки вибирають один, Enter або клацання веде до нього — поверх сторінки чи вигляду доповідача, з URL і синхронізацією marp-cli, без мережі. Слайди підписані й фокусовані; закритий огляд інертний. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Командний рядок →</a>"

[tr.out.presenter-view]
  name = "Вигляд доповідача"
  what = "Натисніть <code>p</code> на сторінці: поточний слайд, наступний крок, ваші нотатки доповідача (екрановані, ніколи не в тому, що читає екранний читач аудиторії), годинник і таймер, у другому вікні, що слідує за першим, а перше за ним, — URL і синхронізація marp-cli, через <code>localStorage</code>, без сервера й мережі. Близько 10 КБ на сторінку. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Командний рядок →</a>"

[tr.out.line-numbers-and-code-callouts]
  name = "Номери рядків і виноски в коді"
  what = "<code>```go {lineNumbers}</code> нумерує рядки блока коду (<code>{lineNumbers=10}</code> починає з 10); маркер у коментарі наприкінці рядка (<code>// &lt;1&gt;</code>) з нумерованим списком після блока дає нумерований диск на рядку та на його примітці — на сторінці, у зображеннях, PDF, PPTX та ODP. Номери й диски не копіюються разом із кодом. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">Математика й код →</a>"

[tr.out.theme-packages]
  name = "Пакети тем"
  what = "Тема в одному файлі <code>.gsta.xz</code>: tar-архів, стиснений xz, з <code>theme.hcl</code>, який називає її та перелічує її CSS, шрифти, ресурси й kinds. <code>slides theme pack|verify|install|list|remove</code> керують пакетами, а <code>--theme</code> приймає один із них. Архіви — це недовірений ввід: посилання, небезпечні шляхи, бомби та неправильні контрольні суми відхиляються з кодованими помилками. <a href=\"https://go-slides.github.io/docs/latest/themes/\">Пакети тем →</a>"

[tr.out.terminal-recordings]
  name = "Записи термінала"
  what = "<code>![cast](demo.cast)</code> вбудовує запис asciinema: він відтворюється у вбудованому програвачі на HTML-сторінці, без скриптів третіх сторін і з паузою за зменшеної анімації; у PDF, PPTX та ODP екран у вибраний момент (<code>#t=12.5</code>) малюється векторним текстом. <a href=\"https://go-slides.github.io/docs/latest/recordings/\">Записи термінала →</a>"

[tr.out.animations-in-the-exports]
  name = "Анімації в експортах"
  what = "Переходи Marp стають переходами слайдів у PPTX та ODP, а поетапні списки — появою по кліку; кожна сторінка PDF отримує перехід <code>/Trans</code>, а <code>--pdf-fragments</code> записує одну сторінку на крок фрагмента. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Командний рядок →</a>"

[tr.out.video]
  name = "Відео"
  what = "<code>![video](clip.mp4#t=12.5)</code> вбудовує відео: браузер відтворює його на HTML-сторінці, ніколи не вмикаючи звук самостійно і ставлячи на паузу за зменшеного руху; PDF показує кадр-прев'ю у вибраний момент із посиланням на файл, а PPTX та ODP вбудовують відео. <a href=\"https://go-slides.github.io/docs/latest/video/\">Відео →</a>"

[tr.out.svg-animation]
  name = "Анімований SVG"
  what = "Зображення SVG, що анімується саме, відтворюється на сторінці HTML. У PPTX і ODP кожен анімований елемент є фігурою з власною анімацією (рух, обертання, масштаб, прозорість, колір), що стартує разом зі слайдом, або анімованим GIF там, де вони не можуть цього виразити; PDF і зображення показують початковий стан. Локальне зображення, заблоковане без <code>--allow-local-files</code>, тепер повідомляється, а не відкидається мовчки. <a href=\"https://go-slides.github.io/docs/latest/svg-animation/\">Анімований SVG →</a>"

[tr.out.providers]
  name = "Математичний шрифт і емодзі за провайдерами"
  what = "Математичний шрифт (v0.22.0) і картинки емодзі (v0.23.0) надходять через провайдери: <code>mathfont.Provider</code> та <code>emoji.Provider</code>. Команда й надалі вбудовує обидва, а її вивід побайтово ідентичний. Хост, якому вони не потрібні, збирає з <code>slides_nomathfont</code> або <code>slides_noemoji</code> і не підключає цих даних (збірка <code>js/wasm</code> менша на 651 КБ і на 2,06 МБ у gzip), постачаючи їх пізніше: до того часу формула показується як вихідний TeX, а емодзі як текст. Картинка провайдера не більша за 256 КіБ і вбудовується як зображення <code>data:</code>."

[tr.out.providers-refresh]
  name = "Слайди оновлюються, коли надходить шрифт або картинки"
  what = "Хост, що реєструє математичний шрифт або картинки емодзі після першого відтворення, більше не лишається з текстом-заміною: після реєстрації провайдера кеш відтворення заново відтворює лише слайди, що відкотилися до заміни, а слайди без формул і емодзі лишаються в кеші. Вивід команди не змінюється."

[tr.out.provider-font-bound]
  name = "Шрифт провайдера обмежується до розбору"
  what = "Математичний шрифт від провайдера перебудовується з таблиць, які читає верстання, і відхиляється за кілька КБ, якщо заявлені в ньому лічильники змусили б парсер виділити забагато (шрифт у 924 байти, що виділив 1,36 ГБ). <b>Контури CFF не охоплено</b>, а постачуваний STIX Two Math — один із них: доки такого обмеження немає в go-opentype, вважайте <code>mathfont.Provider</code> довіреним входом. Вбудований шрифт відтворюється побайтово ідентично."

[tr.out.scheduler]
  name = "Один планувальник і таблиця для багатьох ядер"
  what = "Пул воркерів експорту та пул <code>-P</code> для кількох презентацій працюють обидва на спільному <code>inflight.Ordered</code> флоту: він обмежений, видає результати по порядку, зупиняється на першій помилці, а файли побайтово ідентичні. З <code>-P</code> повідомлення презентації та перелік невдалих тепер виводяться в порядку командного рядка, а не завершення. У випуску додано таблицю для багатьох ядер порівняно з marp-cli (<code>slidesbench -cores</code>); презентації по 20 слайдів і 100 слайдів у PNG швидші за marp-cli за будь-якої кількості ядер. <b>PDF зі 100 слайдів — не був</b>: 3166 мс на одному ядрі та 2568 мс на 16 проти 1513 мс у marp-cli; PDF і PPTX зі 100 слайдів не масштабувалися з ядрами (відстежувалося в <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>; виправлено у v0.26.1)."

[tr.out.shared-font-instances]
  name = "Спільні екземпляри шрифту"
  what = "go-webengine/engine v0.48.0 ділить статичні екземпляри змінного шрифту між сторінками, а не будує їх заново для кожної (<a href=\"https://github.com/go-webengine/engine/issues/443\">engine#443</a>); це виправляє регресію від v0.18.0 до v0.26.0, яку відстежували в <a href=\"https://github.com/go-slides/slides/issues/117\">#117</a>. PDF зі 100 слайдів займає 544 мс на одному ядрі (раніше 3166 мс) і 256 мс на 16, а пік пам'яті становить 169 МіБ замість 2182 МіБ; PPTX зі 100 слайдів займає 692 мс на одному ядрі (раніше 3299 мс) і 276 мс на 16. PDF важить 792,4 КіБ замість 1005,5 КіБ, бо шрифт вбудовується 3 рази замість 102; сторінки збігаються піксель у піксель. <b>go-slides тепер швидший за marp-cli для кожної виміряної презентації, режиму та кількості ядер.</b>"

[tr.repo.slides]
  blurb = "Команда `slides` та її бібліотека: Markdown Marp, розібраний і відрендерений на Go, з шаблонами Go та kinds слайдів понад тим. Випущено як v0.26.1: `go install github.com/go-slides/slides/cmd/slides@latest`."

[tr.repo.docs]
  blurb = "Документація (Hugo + Hextra), що описує v0.26.1: початок роботи, сумісність з Marp, шаблони, kinds і командний рядок. <a href=\"https://github.com/go-slides/docs\">Джерело →</a>"

[tr.repo.vscode]
  blurb = "Розширення VS Code, як Marp for VS Code — для Marp: презентації переглядаються в попередньому перегляді Markdown VS Code за допомогою go-slides, скомпільованого в WebAssembly (без бінарного файла, працює на vscode.dev), прокрутка синхронна з редактором навіть крізь шаблони, помилки на панелі Problems, автодоповнення директив, kinds і функцій шаблонів, вигляд огляду й вигляд доповідача поруч із редактором, експорт через <code>slides</code>, з доступним, тегованим PDF. Встановіть <code>.vsix</code>, доданий до випуску на GitHub; публікацію на Marketplace та Open VSX підготовлено, але її там ще немає. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"

[tr.repo.brand]
  blurb = "Знак — слайд на підставці, в індиго родини документів — і всі його формати: SVG, PNG, JPG, ICO, ICNS, аватар і соціальне зображення."

[tr.repo.gitd]
  blurb = "slides-gitd — git-бекенд для плейграунда go-slides, що розгортається самостійно: облікові дані форджа залишаються на сервері, кожен користувач ізольований, а працює все за oauth2-proxy. Чистий Go."

