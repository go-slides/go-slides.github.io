# oauth2-proxy, as Caddyfile.oidc's forward_auth asks it: it answers
# /oauth2/auth with 202 (signed in) or 401, and serves /oauth2/sign_in and
# /oauth2/callback. Any OpenID Connect provider works.
#
#   oauth2-proxy --config /etc/oauth2-proxy/oauth2-proxy.cfg
#
# No secret is in this file. The client secret and the cookie secret are
# files the secret store puts in place (readable by oauth2-proxy alone);
# the cookie secret is 32 random bytes.

http_address = "127.0.0.1:4180"
reverse_proxy = true
# X-Forwarded-* is believed from Caddy alone
trusted_proxy_ips = ["127.0.0.1/32", "::1/128"]
upstreams = ["static://202"]
set_xauthrequest = true

provider = "oidc"
oidc_issuer_url = "https://id.example.org/realms/example"
client_id = "go-slides"
client_secret_file = "/run/secrets/oauth2-proxy-client-secret"
code_challenge_method = "S256"

# No host: each site's sign-in comes back to its own /oauth2/callback (the
# host is the one Caddy forwarded), so each keeps its own cookie. Register
# every one at the provider, exactly (OpenID Connect Core 3.1.2.1):
#   https://slides.example.org/oauth2/callback
#   https://decks.example.org/oauth2/callback
redirect_url = "/oauth2/callback"
# where a sign-in may send the browser back to afterwards
whitelist_domains = ["slides.example.org", "decks.example.org"]

# who may come in: the provider's users with an address in this domain
email_domains = ["example.org"]

cookie_secret_file = "/run/secrets/oauth2-proxy-cookie-secret"
cookie_secure = true
cookie_samesite = "lax"
