    <path d="M38 50 H218"/>
    <path d="M54 50 V150 Q54 162 66 162 H190 Q202 162 202 150 V50"/>
    <path d="M106 96 H170"/>
    <path d="M106 128 H150"/>
    <path d="M128 162 V196"/>
    <path d="M128 196 L98 222"/><path d="M128 196 L158 222"/>
  </g>
  <g fill="#FFFFFF"><circle cx="84" cy="96" r="9"/><circle cx="84" cy="128" r="9"/></g>
</svg>
