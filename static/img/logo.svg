<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="go-slides">
  <defs><linearGradient id="slides" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#4F46E5"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient></defs>
  <rect width="256" height="256" rx="56" fill="url(#slides)"/>
  <!-- A slide on its stand: the screen hangs from its roller, two bullet
       points on it, and the tripod underneath. A deck is a document shown one
       page at a time, hence the document family's colours. -->
