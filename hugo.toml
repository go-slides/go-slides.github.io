baseURL = "https://go-slides.github.io/"
title = "go-slides"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# Seven languages. English is at the root (/), the others under their code
# (/fr/); each is listed under its own name in the selector the kit puts in the
# top bar (go-fleettools/landingkit v0.8.0, language-selector.html). A page per
# language: content/_index.<lang>.md. The words are i18n/<lang>.yaml, the
# cards' words config/_default/params.<lang>.toml. Chinese is Simplified
# (zh-Hans); `locale` is the page's lang. The playground's own interface is
# English: its page exists in English only, and the selector there leads to
# each language's home.
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[languages]
  [languages.en]
    label = "English"
    weight = 1
  # Order: English (the source), then by script -- Latin, Cyrillic, CJK -- and
  # alphabetically by language code within a script. Portuguese is Brazilian
  # (pt-BR), the larger audience.
  [languages.de]
    label = "Deutsch"
    weight = 2
  [languages.es]
    label = "Español"
    weight = 3
  [languages.fr]
    label = "Français"
    weight = 4
  [languages.it]
    label = "Italiano"
    weight = 5
  [languages.pl]
    label = "Polski"
    weight = 6
  [languages.pt]
    label = "Português"
    locale = "pt-BR"
    weight = 7
  [languages.ru]
    label = "Русский"
    weight = 8
  [languages.uk]
    label = "Українська"
    weight = 9
  [languages.ja]
    label = "日本語"
    weight = 10
  [languages.ko]
    label = "한국어"
    weight = 11
  [languages.zh]
    label = "简体中文"
    locale = "zh-Hans"
    weight = 12

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

# The go-slides/slides release the page announces: the status strip, the meta
# description and the docs links read it. What a release changes in the
# English words is in i18n/en.yaml (and the cards below); the translations in
# i18n/<lang>.yaml and config/_default/params.<lang>.toml follow.
[params]
  version = "v0.16.0"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

# The hero: the kit's hero-carousel.html over these cards. The first is the
# terminal the hero always showed (layouts/partials/hero-terminal.html), so
# the first paint and its LCP are what they were; the pictures after it are
# fetched once the page has loaded. /playground/cards/<n>.jpg are the loading
# carousel's pictures, rendered by the deploy (playground/cmd/build) from
# playground/cards/cards.md; img/hero/playground.webp is the live playground.
[params.hero]
  label = "go-slides in pictures"
  interval = 6000
[[params.hero.cards]]
  terminal = true
[[params.hero.cards]]
  img = "/img/hero/playground.webp"
  width = 1200
  height = 750
  alt = "The playground: the Markdown editor, the slide rail and the live preview"
  caption = "The playground: write a deck in your browser"
  href = "/playground/"
[[params.hero.cards]]
  img = "/playground/cards/1.jpg"
  width = 480
  height = 270
  alt = "A slide generated from data with Go templates"
  caption = "Go templates: generate slides from data"
  href = "https://go-slides.github.io/docs/latest/templates/"
[[params.hero.cards]]
  img = "/playground/cards/2.jpg"
  width = 480
  height = 270
  alt = "A slide styled by its kind"
  caption = "Slide kinds: name a set of directives once"
  href = "https://go-slides.github.io/docs/latest/kinds/"
[[params.hero.cards]]
  img = "/playground/cards/3.jpg"
  width = 480
  height = 270
  alt = "A slide with typeset math"
  caption = "Math typeset by go-tex, in Go"
  href = "https://go-slides.github.io/docs/latest/math-and-code/"
[[params.hero.cards]]
  img = "/playground/cards/5.jpg"
  width = 480
  height = 270
  alt = "A slide about PDF, PPTX and ODP export"
  caption = "Vector PDF, editable PPTX and ODP"
  href = "https://go-slides.github.io/docs/latest/cli/"
[[params.hero.cards]]
  title = "VS Code"
  text = "The same live preview beside your Markdown, scrolling with it."
  href = "https://go-slides.github.io/docs/latest/vscode/"
  more = "The extension"

# Every field below is rendered by layouts/index.html (the cards in #repos and
# the strip under the hero). A field nothing renders does not stay true.
# "status": ready = released; active = on main, no version tagged yet.
# "label" (optional) replaces the status text on the card.
[[params.repos]]
  name   = "slides"
  status = "ready"
  label  = "v0.16.0"
  url    = "https://github.com/go-slides/slides"
  blurb  = "The `slides` command and its library: Marp's Markdown parsed and rendered in Go, with Go templates and slide kinds on top. Released as v0.16.0: `go install github.com/go-slides/slides/cmd/slides@latest`."
[[params.repos]]
  name   = "docs"
  status = "ready"
  label  = "v0.16"
  url    = "https://go-slides.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra), describing v0.16.0: getting started, Marp compatibility, templates, kinds and the command line. <a href=\"https://github.com/go-slides/docs\">Source →</a>"
[[params.repos]]
  name   = "vscode"
  status = "ready"
  label  = "v0.5.0"
  url    = "https://github.com/go-slides/vscode"
  blurb  = "The VS Code extension, as Marp for VS Code is Marp's: decks previewed in VS Code's Markdown preview by go-slides compiled to WebAssembly (no binary, works on vscode.dev), scrolling in sync with the editor through templates, errors in the Problems panel, completion of directives, kinds and template functions, an overview and a presenter view beside the editor, export through <code>slides</code>, with an accessible, tagged PDF. Install the <code>.vsix</code> attached to the GitHub release; publication on the Marketplace and Open VSX is prepared, but it is not there yet. <a href=\"https://go-slides.github.io/docs/latest/vscode/\">VS Code →</a>"
[[params.repos]]
  name   = "brand"
  status = "ready"
  url    = "https://github.com/go-slides/brand"
  blurb  = "The mark — a slide on its stand, in the document family's indigo — and every format of it: SVG, PNG, JPG, ICO, ICNS, avatar and social image."

# What the slides command does. "when" is the release of go-slides/slides that
# first had it ("v0.1.0", "v0.8.0"), "on main" (merged after the latest
# release) or "planned" (not built).
[[params.outputs]]
  name = "HTML"
  id   = "html"
  when = "v0.1.0"
  what = "One page per deck, the way Marp renders it: each slide an SVG-framed <code>&lt;section&gt;</code> that scales to the window, the theme's CSS, and a keyboard viewer."
[[params.outputs]]
  name = "slides expand"
  id   = "slides-expand"
  when = "v0.1.0"
  what = "The deck with its templates evaluated and its kinds turned into spot directives, written back as plain Marp Markdown — so any Marp tool can take it from there."
[[params.outputs]]
  name = "notes, kinds, themes"
  id   = "notes-kinds-themes"
  when = "v0.1.0"
  what = "<code>slides notes</code> prints the speaker notes; <code>slides kinds</code> and <code>slides themes</code> list what a deck can name."
[[params.outputs]]
  name = "slides.yaml"
  id   = "slides-yaml"
  when = "v0.1.0"
  what = "A configuration file for a folder of decks: shared kinds, themes, template data, HTML options and language."
[[params.outputs]]
  name = "PNG / JPEG"
  id   = "png-jpeg"
  when = "v0.1.0"
  what = "<code>--images png|jpeg</code> writes one image per slide (<code>deck.001.png</code>, …), <code>--image</code> the first slide. Rendered by <a href=\"https://github.com/go-webengine\">go-webengine</a>, a browser engine in Go — not a headless Chrome. <code>--image-scale 2</code> renders at twice the density."
[[params.outputs]]
  name = "PDF"
  id   = "pdf"
  when = "v0.1.0"
  what = "<code>--pdf</code>, or <code>-o deck.pdf</code>: one page per slide at the slide's size, with an outline of slides and headings, written by <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. Fonts are embedded; nothing touches the network. Since v0.4.0 the pages are vectors: selectable text, sharp shapes, 758 KiB for 100 slides against marp-cli's 837 KiB (<code>--pdf-raster</code> keeps one image per page)."
[[params.outputs]]
  name = "PPTX"
  id   = "pptx"
  when = "v0.2.0"
  what = "<code>--pptx</code>, or <code>-o deck.pptx</code>: with its speaker notes and the deck's metadata, written by <a href=\"https://github.com/go-ooxml\">go-ooxml</a>. Since v0.5.0 the slides are <b>editable</b> — text boxes in the deck's own fonts (embedded), shapes, gradients, pictures stored once — where marp-cli's are pictures (<code>--pptx-raster</code> keeps them). 100 slides: 348 ms and 760 KiB, against marp-cli's 7.8 s and 7.2 MiB."
[[params.outputs]]
  name = "Math and highlighting"
  id   = "math-and-highlighting"
  when = "v0.2.0"
  what = "<code>$…$</code> and <code>$$…$$</code> typeset by <a href=\"https://github.com/go-tex\">go-tex</a>, fenced code highlighted by <a href=\"https://github.com/go-rouge\">go-rouge</a> — in the HTML page, images and PDF."
[[params.outputs]]
  name = "ODP"
  id   = "odp"
  when = "v0.3.0"
  what = "<code>--odp</code>, or <code>-o deck.odp</code>: an OpenDocument presentation with its speaker notes — editable since v0.5.0, like the PPTX (<code>--odp-raster</code> for one picture per slide)."
[[params.outputs]]
  name = "Fitting headings"
  id   = "fitting-headings"
  when = "v0.3.0"
  what = "<code># &lt;!-- fit --&gt; Title</code> fills the slide width on one line, in the page and in every export."
[[params.outputs]]
  name = "Emoji"
  id   = "emoji"
  when = "v0.4.0"
  what = "<code>:smile:</code> shortcodes and Unicode emoji (😄 👩‍💻 🇫🇷) become <a href=\"https://github.com/jdecked/twemoji\">Twemoji</a> images exactly as Marp Core writes them — but embedded from <a href=\"https://github.com/go-icons/twemoji\">go-icons/twemoji</a> instead of loaded from a CDN, so they need no network and draw in the page, images, PDF, PPTX and ODP. <a href=\"https://go-slides.github.io/docs/latest/emoji/\">Emoji →</a>"
[[params.outputs]]
  name = "HCL"
  id   = "hcl"
  when = "v0.3.0"
  what = "HCL2 wherever a deck takes YAML — a <code>---hcl</code> front matter, <code>slides.hcl</code>, kinds and data files — for expressions and functions: <code>footer = \"${upper(data.company)} · ${page()}/${total()}\"</code>. <code>slides expand</code> writes the front matter back as YAML. <a href=\"https://go-slides.github.io/docs/latest/hcl/\">HCL →</a>"
[[params.outputs]]
  name = "Watch, serve, preview"
  id   = "watch-serve-preview"
  when = "v0.6.0"
  what = "<code>--watch</code> builds again what changes and reloads the open pages; <code>--server dir</code> serves a folder of decks — <code>deck.md</code> as a page, <code>deck.md?pdf</code>, <code>?pptx</code>, <code>?png</code>, <code>?notes</code> converted on request — on <b>127.0.0.1</b>, checking the Host and Origin, never leaving the folder; <code>--preview</code> opens the browser. marp-cli's routes and live reload, without its open port. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Command line →</a>"
[[params.outputs]]
  name = "Many decks"
  id   = "many-decks"
  when = "v0.6.0"
  what = "<code>slides -I decks/ -o site/</code> converts every deck under a folder and mirrors the tree; several files, a folder or a pattern at once, <code>-P</code> at a time."
[[params.outputs]]
  name = "Transitions"
  id   = "transitions"
  when = "v0.6.0"
  what = "marp-cli's <code>&lt;!-- transition: fade 1s --&gt;</code>, with its 33 built-in transitions, played with the browser's View Transition API; an on-screen controller; <code>--template bare</code>."
[[params.outputs]]
  name = "Notes in PDF, metadata, marp-cli's options"
  id   = "notes-in-pdf-metadata-marp-cli-s-options"
  when = "v0.6.0"
  what = "<code>--notes</code> writes the speaker notes as text, <code>--pdf-notes</code> puts them on the PDF pages, <code>--pdf-outlines</code> its bookmarks; <code>--title</code>, <code>--author</code>, <code>--keywords</code>, <code>--url</code>, <code>--og-image</code>, <code>--theme</code>; marp-cli's <code>.marprc</code> and <code>--config-file</code> (JSON, YAML) are read."
[[params.outputs]]
  name = "Overview view"
  id   = "overview-view"
  when = "v0.8.0"
  what = "Press <code>o</code>: every slide in a grid, the arrows choose one, Enter or a click goes to it — over the page or over the presenter view, in marp-cli's URLs and with its sync, no network. Slides are labelled and focusable; the closed overview is inert. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Command line →</a>"
[[params.outputs]]
  name = "Presenter view"
  id   = "presenter-view"
  when = "v0.7.0"
  what = "Press <code>p</code> on the page: the current slide, the next step, your speaker notes (escaped, never in what the audience's screen reader reads), a clock and a timer, in a second window that follows the first and the first follows it — marp-cli's URLs and sync, through <code>localStorage</code>, no server and no network. About 10 KB a page. <a href=\"https://go-slides.github.io/docs/latest/cli/\">Command line →</a>"
[[params.outputs]]
  name = "Line numbers and code callouts"
  id   = "line-numbers-and-code-callouts"
  when = "v0.8.0"
  what = "<code>```go {lineNumbers}</code> numbers the lines of a code block (<code>{lineNumbers=10}</code> starts at 10); a marker in a comment at the end of a line (<code>// &lt;1&gt;</code>) followed by a numbered list gives a numbered disc on the line and on its note — in the page, images, PDF, PPTX and ODP. The numbers and discs are not copied with the code. <a href=\"https://go-slides.github.io/docs/latest/math-and-code/\">Math and code →</a>"

# The strip under the top bar: the code's licence and cgo, and the data
# shipped under its own licence (read from its licence files).
[params.mantra]
  items = ["LICENSE=BSD-3-Clause", "CGO_ENABLED=0", "themes: MIT"]
