baseURL = "https://go-slides.github.io/"
title = "go-slides"
disableKinds = ["taxonomy", "term", "RSS", "sitemap", "404"]

[markup.goldmark.renderer]
  unsafe = true

# The design -- layouts/partials/styles.html, theme-toggle.html,
# fork-ribbon.html and icons/{github,book}.html -- comes from the shared Hugo
# module github.com/go-fleettools/landingkit, not from copies here: the copies
# drifted. Its version is pinned in go.mod (Renovate bumps it), and kit.go
# keeps `go mod tidy` from deleting that requirement. A file of the same name
# under layouts/partials/ would silently override the module's.
[module]
  [[module.imports]]
    path = "github.com/go-fleettools/landingkit"

[params.brand]
# Generated by go-fleettools/landingkit from static/img/logo.svg: the colours are
# READ from the logo's gradient, never chosen. Do not add other keys:
# neutrals (backgrounds, surfaces, greys) belong to the shared sheet.
# Contrast: base on white 15.99:1, bright on the dark background 3.07:1.
  base = "#1e1b4b"
  deep = "#12102e"
  bright = "#4f46e5"
  shadow = "rgba(30,27,75,.7)"
  glow = "rgba(30,27,75,.6)"
  wash = "rgba(30,27,75,.10)"
  washDeep = "rgba(18,16,46,.06)"
  chipBg = "#eae9fc"
  chipBorder = "#cac8f7"
  chipFg = "#12102e"
  chipBgDark = "rgba(79,70,229,.14)"
  chipBorderDark = "rgba(79,70,229,.32)"
  chipFgDark = "#9e99f1"
  statsEnd = "#d5d3f9"
  bandText = "#e3e1fb"

# Every field below is rendered by layouts/index.html (the cards in #repos and
# the strip under the hero). A field nothing renders does not stay true.
# "status": ready = released; active = on main, no version tagged yet.
[[params.repos]]
  name   = "slides"
  status = "active"
  url    = "https://github.com/go-slides/slides"
  blurb  = "The `slides` command and its library: Marp's Markdown parsed and rendered in Go, with Go templates and slide kinds on top. On main; no version is tagged yet."
[[params.repos]]
  name   = "docs"
  status = "active"
  url    = "https://go-slides.github.io/docs/"
  blurb  = "The documentation (Hugo + Hextra), describing main until the first release: getting started, Marp compatibility, templates, kinds and the command line. <a href=\"https://github.com/go-slides/docs\">Source →</a>"
[[params.repos]]
  name   = "brand"
  status = "ready"
  url    = "https://github.com/go-slides/brand"
  blurb  = "The mark — a slide on its stand, in the document family's indigo — and every format of it: SVG, PNG, JPG, ICO, ICNS, avatar and social image."

# What the slides command does. "when" is either "on main" (merged in
# go-slides/slides, not yet in a tagged release) or "planned" (not built).
[[params.outputs]]
  name = "HTML"
  when = "on main"
  what = "One page per deck, the way Marp renders it: each slide an SVG-framed <code>&lt;section&gt;</code> that scales to the window, the theme's CSS, and a keyboard viewer."
[[params.outputs]]
  name = "slides expand"
  when = "on main"
  what = "The deck with its templates evaluated and its kinds turned into spot directives, written back as plain Marp Markdown — so any Marp tool can take it from there."
[[params.outputs]]
  name = "notes, kinds, themes"
  when = "on main"
  what = "<code>slides notes</code> prints the speaker notes; <code>slides kinds</code> and <code>slides themes</code> list what a deck can name."
[[params.outputs]]
  name = "slides.yaml"
  when = "on main"
  what = "A configuration file for a folder of decks: shared kinds, themes, template data, HTML options and language."
[[params.outputs]]
  name = "PNG / JPEG"
  when = "on main"
  what = "<code>--images png|jpeg</code> writes one image per slide (<code>deck.001.png</code>, …), <code>--image</code> the first slide. Rendered by <a href=\"https://github.com/go-webengine\">go-webengine</a>, a browser engine in Go — not a headless Chrome. <code>--image-scale 2</code> renders at twice the density."
[[params.outputs]]
  name = "PDF"
  when = "on main"
  what = "<code>--pdf</code>, or <code>-o deck.pdf</code>: one page per slide at the slide's size, with an outline of slides and headings, written by <a href=\"https://github.com/go-pdfkit\">go-pdfkit</a>. Fonts are embedded; nothing touches the network."
[[params.outputs]]
  name = "PPTX"
  when = "planned"
  what = "Through <a href=\"https://github.com/go-ooxml\">go-ooxml</a>'s OPC container."
[[params.outputs]]
  name = "Math and highlighting"
  when = "planned"
  what = "Math through <a href=\"https://github.com/go-tex\">go-tex</a>, code highlighting through <a href=\"https://github.com/go-rouge\">go-rouge</a>."
